    const res=(x,y,lab,val,c,vert)=>{ if(vert){g.rect(x-15,y-28,30,56,{f:g.C.bg,s:c,lw:2,r:3});}
      else g.rect(x-32,y-14,64,28,{f:g.C.bg,s:c,lw:2,r:3});
      g.text(lab+' '+val+'Ω',x+(vert?38:0),y+(vert?4:-22),{c,s:11,a:vert?'left':'center',m:true}); };
    res(cx-L/4,top,'R_A',p.Ra,g.C.cyan); res(cx+L/4,top,'R_B',p.Rb,g.C.rose); res(cx,g.H/2,'R_C',p.Rc,g.C.accent,true);
    const flow=(x1,y1,x2,y2,I,c)=>{ if(Math.abs(I)<1e-4) return;
      const f=((s.t*Math.min(Math.abs(I)*3,2.5))%1), d=I>0?f:1-f;
      g.circle(x1+(x2-x1)*d,y1+(y2-y1)*d,4,c); };
    for(let i=0;i<5;i++){ const off=i/5;
      flow(cx-L/2,top+off*0,cx,top,i1,g.C.amber); }
    g.text('loop 1 current '+fmt(i1)+' A   ·   loop 2 current '+fmt(i2)+' A   ·   shared branch '+fmt(i3)+' A',
      g.W/2,g.H-34,{c:g.C.mut,s:12,m:true});
    g.text('Junction rule: currents in = currents out. Loop rule: ΣΔV = 0',g.W/2,32,{c:g.C.mut,s:12});
  },
  read(p){const {i1,i2,i3}=kSolve(p);
    return [R('Current in left loop',i1,'A'),R('Current in right loop',i2,'A'),R('Current in R_C',i3,'A'),
      R('Voltage across R_C',i3*p.Rc,'V'),R('Power in R_A',i1*i1*p.Ra,'W'),R('Power in R_B',i2*i2*p.Rb,'W'),
      R('Junction check',i1-i2-i3,'A')];},
  note:'The junction check should always read zero — that is Kirchhoff’s current law holding.'
};
function kSolve(p){
  const a1=p.Ra+p.Rc, b1=p.Rc, a2=p.Rc, b2=p.Rb+p.Rc;
  const det=a1*b2-b1*a2;
  const i1=(p.E1*b2-b1*p.E2)/det, i2=(a1*p.E2-p.E1*a2)/det;
  return {i1,i2,i3:i1-i2};
}

ENGINES.wheatstone={

    const arm=(p1,p2,lab,val,c)=>{ g.line(p1[0],p1[1],p2[0],p2[1],g.C.metal,2.5);
      const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;

      g.text(lab,mx,my+4,{c,s:11,b:true,m:true});
      g.text(fmt(val)+'Ω',mx+(p2[0]>p1[0]?26:-26),my+(p2[1]>p1[1]?22:-18),{c,s:10,m:true}); };
    arm(A,B,'P',p.P,g.C.cyan); arm(B,Cp,'Q',p.Q,g.C.violet);

ENGINES.magfield={
  c:[C('I','Current',0,20,5,0.5,' A'),C('d','Distance from wire',1,30,10,0.5,' cm'),
     SEL('src','Source','Straight wire,Circular coil,Bar magnet'.split(',')),C('N','Turns (coil)',1,80,20,1)],
  draw(g,p,s){
    const cx=g.W/2,cy=g.H/2;
    if(p.src==='Straight wire'){
      g.line(cx,30,cx,g.H-30,g.C.amber,5);
      for(let r=40;r<Math.min(g.W,g.H)/2;r+=38){
        g.circle(cx,cy,r,null,`rgba(251,113,133,${clamp(.45*p.I/(r/40)/4,.06,.5)})`,1.8);
        const a=s.t*1.2*Math.sign(p.I||1)+r/60;
        g.circle(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3.5,g.C.rose);}
      for(let i=0;i<5;i++){const y=40+((s.t*90+i*90)%(g.H-80));
        g.arrow(cx,y,cx,y+22,g.C.accent,2.5,7);}
      g.circle(cx+p.d*8,cy,6,g.C.cyan,null,0,10);
      g.text('P',cx+p.d*8,cy-14,{c:g.C.cyan,s:11});
    } else if(p.src==='Circular coil'){
      const R=90;
      g.ctx.save(); g.ctx.translate(cx,cy); g.ctx.scale(1,0.36);
      g.circle(0,0,R,null,g.C.amber,5); g.ctx.restore();
      for(let i=-3;i<=3;i++){ const off=i*26; const pts=[];
        for(let t=-1;t<=1;t+=0.02){ pts.push([cx+t*260, cy+off*(1+2.6*t*t)]); }
        g.path(pts,`rgba(251,113,133,${.35-Math.abs(i)*0.06})`,1.6);}
      g.arrow(cx,cy+14,cx,cy-70,g.C.accent,3,9);
      g.text('B on axis',cx+10,cy-78,{c:g.C.accent,s:11,a:'left'});
    } else {
      const mL=80;
      g.rect(cx-mL,cy-18,mL,36,{f:g.C.rose,r:3}); g.rect(cx,cy-18,mL,36,{f:g.C.cyan,r:3});
      g.text('N',cx-mL/2,cy+6,{c:'#fff',s:15,b:true}); g.text('S',cx+mL/2,cy+6,{c:'#fff',s:15,b:true});
      for(let i=0;i<14;i++){
        const a=(i/14)*Math.PI*2; let x=cx-mL+Math.cos(a)*24,y=cy+Math.sin(a)*24;
        const pts=[[x,y]];
        for(let k=0;k<420;k++){
          const dx1=x-(cx-mL),dy1=y-cy,r1=Math.max(18,Math.hypot(dx1,dy1));
          const dx2=x-(cx+mL),dy2=y-cy,r2=Math.max(18,Math.hypot(dx2,dy2));
          const Bx=dx1/r1**3-dx2/r2**3, By=dy1/r1**3-dy2/r2**3, m=Math.hypot(Bx,By);
          if(!m) break; x+=Bx/m*2.4; y+=By/m*2.4;
          if(x<0||x>g.W||y<0||y>g.H) break; pts.push([x,y]);}
        g.path(pts,'rgba(251,113,133,.30)',1.5);}
    }
    g.text(fieldLabel(p),g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
  },
  read(p){const mu=4*Math.PI*1e-7;
    const Bw=mu*p.I/(2*Math.PI*(p.d/100)), Bc=mu*p.N*p.I/(2*(p.d/100));
    return [R('Current',p.I,'A'),R('Distance',p.d,'cm'),
      R('B near straight wire',Bw*1e6,'µT'),R('B at coil centre',Bc*1e6,'µT'),
      R('Turns',p.N),R('Field direction','Right-hand grip rule')];},
  note:'Point the right thumb along the current and your fingers curl the way B circles the wire.'
};
function fieldLabel(p){const mu=4*Math.PI*1e-7;
  if(p.src==='Straight wire') return 'B = µ₀I/2πr = '+fmt(mu*p.I/(2*Math.PI*(p.d/100))*1e6)+' µT';
  if(p.src==='Circular coil') return 'B = µ₀NI/2R = '+fmt(mu*p.N*p.I/(2*(p.d/100))*1e6)+' µT';
  return 'Bar magnet: field leaves N and returns to S';}

ENGINES.lorentz={
  c:[C('q','Charge',-5,5,1,0.1,' e'),C('v','Speed',0.5,10,4,0.1,' ×10⁶ m/s'),
     C('B','Magnetic field',0.05,2,0.5,0.05,' T'),C('ang','Angle to field',0,90,90,1,'°')],
  init:()=>({x:0,y:0,vx:1,vy:0,path:[]}),
  step(s,p,dt){
    const q=p.q*1.602e-19, m=9.109e-31, v=p.v*1e6, B=p.B;
    const w=q*B/m, ang=p.ang*Math.PI/180;
    s.a=(s.a||0)+w*dt*1e-8*Math.sin(ang);
    const r=m*v*Math.sin(ang)/Math.abs(q*B||1e-9);
    s.x=r*Math.cos(s.a); s.y=r*Math.sin(s.a)*Math.sign(q||1);
    s.path.push([s.x,s.y]); if(s.path.length>500) s.path.shift();
  },
  draw(g,p,s){
    const cx=g.W/2,cy=g.H/2;
    for(let x=60;x<g.W-40;x+=54) for(let y=54;y<g.H-30;y+=54){
      g.circle(x,y,6,null,'rgba(34,211,238,.35)',1.4); g.circle(x,y,1.8,'rgba(34,211,238,.6)');}
    g.text('B out of the screen',g.W-60,28,{c:g.C.cyan,s:11,a:'right'});
    const m=9.109e-31,q=Math.abs(p.q*1.602e-19)||1e-30, r=m*p.v*1e6*Math.sin(p.ang*Math.PI/180)/(q*p.B);
    const sc=Math.min(g.W,g.H)/2.6/Math.max(r,1e-9);
    g.path(s.path.map(pt=>[cx+pt[0]*sc,cy+pt[1]*sc]),'rgba(0,229,160,.45)',2);
    const px=cx+(s.x||0)*sc, py=cy+(s.y||0)*sc;
    g.circle(px,py,8,p.q>0?g.C.rose:g.C.accent,null,0,14);
    g.arrow(px,py,px-(s.y||0)*sc*0.3-14,py+(s.x||0)*sc*0.3,g.C.amber,2,7);
    g.text('radius r = mv/qB = '+fmt(r*1000)+' mm',g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
    if(p.ang<89) g.text('A velocity component along B is unaffected, so the real path is a helix',g.W/2,g.H-26,{c:g.C.mut,s:11});
  },
  read(p){const m=9.109e-31,q=Math.abs(p.q*1.602e-19)||1e-30,v=p.v*1e6,ang=p.ang*Math.PI/180;
    const F=q*v*p.B*Math.sin(ang), r=m*v*Math.sin(ang)/(q*p.B);
    return [R('Magnetic force',F*1e15,'fN'),R('Radius',r*1000,'mm'),
      R('Period',2*Math.PI*m/(q*p.B)*1e9,'ns'),R('Cyclotron frequency',q*p.B/(2*Math.PI*m)/1e9,'GHz'),
      R('Speed',p.v,'×10⁶ m/s'),R('Angle to B',p.ang,'°')];},
  note:'The magnetic force never changes the speed — only the direction, so it does no work.'
};

ENGINES.induction={
  c:[SEL('mode','Setup','Magnet through coil,Rotating loop,Eddy-current brake'.split(',')),
     C('N','Coil turns',1,200,50,1),C('v','Speed',0.2,8,2,0.1),
     C('B','Field strength',0.1,2,0.6,0.05,' T'),C('A','Loop area',5,200,60,1,' cm²')],
  init:()=>({x:-1.5,phase:0,emf:0,hist:[]}),
  step(s,p,dt){
    if(p.mode==='Rotating loop'){ s.phase+=p.v*dt*2;
      s.emf=p.N*p.B*(p.A*1e-4)*p.v*2*Math.sin(s.phase); }

      s.emf=-p.N*p.B*(p.A*1e-4)*(-12*d*flux)*p.v*0.6*10; }

      g.rect(mx-38,cy-13,38,26,{f:g.C.rose,r:3}); g.rect(mx,cy-13,38,26,{f:g.C.cyan,r:3});
      g.text('N',mx-19,cy+5,{c:'#fff',s:12,b:true}); g.text('S',mx+19,cy+5,{c:'#fff',s:12,b:true});
      g.arrow(mx,cy-34,mx+34,cy-34,g.C.accent,2.4,7);
      if(p.mode==='Eddy-current brake') g.text('induced eddy currents oppose the motion',cx+60,cy+90,{c:g.C.mut,s:11});
    }
    g.circle(cx-170,cy+110,24,g.C.bg,g.C.violet,2); g.text('G',cx-170,cy+116,{c:g.C.violet,s:13,b:true});

    g.line(cx-170,cy+110,cx-170+Math.sin(ang)*19,cy+110-Math.cos(ang)*19,g.C.rose,2.5);
    const pts=s.hist.map((v,i)=>[i,v]);
    g.plot({x:g.W*0.58,y:80,w:g.W*0.35,h:g.H-180,xmin:0,xmax:260,ymin:-Math.max(1,...s.hist.map(Math.abs))*1.2,
      ymax:Math.max(1,...s.hist.map(Math.abs))*1.2,series:[{pts,c:g.C.accent}],title:'Induced EMF',xlab:'time',ylab:'EMF (V)'});
    g.text('EMF appears only while the flux is changing',g.W/2,30,{c:g.C.mut,s:12});
  },
  read(p,s){return [R('Induced EMF',s.emf||0,'V'),R('Coil turns',p.N),R('Loop area',p.A,'cm²'),
    R('Field',p.B,'T'),R('Peak EMF',p.N*p.B*(p.A*1e-4)*p.v*2,'V'),
    R('Direction','Opposes the change (Lenz)')];},
  note:'Faster motion, more turns or a stronger magnet all raise the EMF — Faraday’s law in action.'
};

ENGINES.transformer={

    ac(cx-cw/2-110,p.Vp,g.C.amber);
    g.rect(cx+cw/2+90,cy-26,44,52,{f:g.C.bg,s:g.C.rose,lw:2,r:3});
    g.text(p.Rl+'Ω',cx+cw/2+112,cy+5,{c:g.C.rose,s:11,b:true,m:true});
    g.text(fmt(Vs)+' V',cx+cw/2+112,cy-44,{c:g.C.accent,s:12,b:true,m:true});
    for(let i=0;i<4;i++){const f=((s.t*0.6+i/4)%1);
      g.circle(cx-cw/2+cw*Math.sin(f*6.28)*0+cx*0+cx-cw/2+4,cy-ch/2+ch*f,3,'rgba(167,139,250,.7)');}
    g.text(p.Ns>p.Np?'Step-up transformer':p.Ns<p.Np?'Step-down transformer':'Isolation transformer (1:1)',

ENGINES.ac={
  c:[C('Vm','Peak voltage',5,340,325,1,' V'),C('f','Frequency',10,200,50,1,' Hz'),
     C('Rr','Resistance',1,200,50,1,' Ω'),C('Lh','Inductance',1,500,100,1,' mH'),
     C('Cu','Capacitance',1,500,100,1,' µF')],
  draw(g,p,s){
    const w=2*Math.PI*p.f, XL=w*p.Lh/1000, XC=1/(w*p.Cu*1e-6);
    const Z=Math.hypot(p.Rr,XL-XC), phi=Math.atan2(XL-XC,p.Rr);
    const Im=p.Vm/Z;
    const per=1/p.f, x0=60,x1=g.W*0.62,y=g.H*0.35,A=90;
    const pv=[],pi=[];
    for(let i=0;i<=240;i++){const t=i/240*2*per;
      pv.push([t,p.Vm*Math.sin(w*t)]); pi.push([t,Im*Math.sin(w*t-phi)*(p.Vm/Math.max(Im,1e-6))/1]);}
    g.plot({x:x0,y:60,w:x1-x0,h:g.H-150,xmin:0,xmax:2*per,ymin:-p.Vm*1.15,ymax:p.Vm*1.15,
      series:[{pts:pv,c:g.C.amber},{pts:pi.map(q=>[q[0],q[1]]),c:g.C.accent}],
      title:'Voltage (amber) and current (green, scaled)',xlab:'t (s)',ylab:'V (V)'});
    const cx=g.W*0.82, cy=g.H/2, sc=Math.min(90/Math.max(Z,1),3);
    g.circle(cx,cy,92,null,g.C.grid,1);
    g.arrow(cx,cy,cx+p.Rr*sc,cy,g.C.accent,2.5,8); g.text('R',cx+p.Rr*sc+10,cy+4,{c:g.C.accent,s:11,a:'left'});
    g.arrow(cx+p.Rr*sc,cy,cx+p.Rr*sc,cy-(XL-XC)*sc,g.C.violet,2.5,8);
    g.arrow(cx,cy,cx+p.Rr*sc,cy-(XL-XC)*sc,g.C.amber,2.5,9);
    g.text('Z',cx+p.Rr*sc*0.5-14,cy-(XL-XC)*sc*0.5,{c:g.C.amber,s:12,b:true});
    g.text('impedance phasor',cx,cy+112,{c:g.C.mut,s:11});
  },
  read(p){const w=2*Math.PI*p.f,XL=w*p.Lh/1000,XC=1/(w*p.Cu*1e-6);
    const Z=Math.hypot(p.Rr,XL-XC),phi=Math.atan2(XL-XC,p.Rr),Im=p.Vm/Z;
    return [R('Inductive reactance',XL,'Ω'),R('Capacitive reactance',XC,'Ω'),R('Impedance',Z,'Ω'),
      R('Phase angle',phi*180/Math.PI,'°'),R('RMS voltage',p.Vm/Math.SQRT2,'V'),R('RMS current',Im/Math.SQRT2,'A'),
      R('Power factor',Math.cos(phi)),R('Average power',p.Vm*Im/2*Math.cos(phi),'W'),
      R('Resonant frequency',1/(2*Math.PI*Math.sqrt(p.Lh/1000*p.Cu*1e-6)),'Hz')];},
  note:'At resonance XL = XC, impedance drops to R and the current peaks.'
};

ENGINES.rectifier={
  c:[SEL('mode','Circuit','Half-wave,Full-wave bridge,Full-wave with filter'.split(',')),
     C('Vm','Peak input',5,50,12,0.5,' V'),C('f','Frequency',10,200,50,1,' Hz'),
     C('Rl','Load',50,5000,1000,10,' Ω'),C('Cu','Filter capacitor',1,1000,100,1,' µF')],
  draw(g,p,s){
    const per=1/p.f, w=2*Math.PI*p.f, tau=p.Rl*p.Cu*1e-6;
    const inp=[],out=[];
    let vc=0;
    for(let i=0;i<=400;i++){
      const t=i/400*3*per, vin=p.Vm*Math.sin(w*t);
      inp.push([t,vin]);
      let vo;
      if(p.mode==='Half-wave') vo=Math.max(0,vin-0.7);
      else vo=Math.max(0,Math.abs(vin)-1.4);
      if(p.mode==='Full-wave with filter'){ vc=Math.max(vo, vc-(vc/tau)*(3*per/400)); vo=vc; }
      out.push([t,vo]);
    }
    const half=(g.H-170)/2;
    g.plot({x:70,y:60,w:g.W-140,h:half,xmin:0,xmax:3*per,ymin:-p.Vm*1.1,ymax:p.Vm*1.1,
      series:[{pts:inp,c:g.C.cyan}],title:'AC input',xlab:''});
    g.plot({x:70,y:80+half,w:g.W-140,h:half,xmin:0,xmax:3*per,ymin:-p.Vm*0.15,ymax:p.Vm*1.1,
      series:[{pts:out,c:g.C.accent}],title:'Rectified output across the load',xlab:'t (s)'});
  },
  read(p){const Vdc=p.mode==='Half-wave'?p.Vm/Math.PI:(p.mode==='Full-wave bridge'?2*p.Vm/Math.PI:p.Vm-0.7);
    const ripple=p.mode==='Full-wave with filter'?p.Vm/(2*p.f*p.Rl*p.Cu*1e-6):p.Vm*0.48;
    return [R('Peak input',p.Vm,'V'),R('DC output',Vdc,'V'),R('Ripple voltage',ripple,'V'),
      R('Ripple factor',ripple/Math.max(Vdc,0.01)),R('Load current',Vdc/p.Rl*1000,'mA'),
      R('Diodes used',p.mode==='Half-wave'?1:4)];},
  note:'A bigger filter capacitor flattens the ripple because the discharge time constant grows.'
};

ENGINES.reflection={

  draw(g,p,s){

    g.rect(0,my,g.W,10,{f:g.C.metal}); for(let x=0;x<g.W;x+=14) g.line(x,my+10,x-8,my+22,g.C.bd,1.5);
    g.line(cx,my-L-10,cx,my+30,g.C.grid,1.5,[5,5]);
    g.text('normal',cx+8,my-L-2,{c:g.C.dim,s:10,a:'left'});
    g.arrow(cx-L*Math.sin(r),my-L*Math.cos(r),cx,my,g.C.accent,3,10);
    g.arrow(cx,my,cx+L*Math.sin(r),my-L*Math.cos(r),g.C.amber,3,10);
    const arc=(a,c,lab)=>{g.ctx.save();g.ctx.beginPath();
      g.ctx.arc(cx,my,60,-Math.PI/2-(a<0?-a:0),-Math.PI/2+(a>0?a:0));

ENGINES.refraction={

ENGINES.lens={
  c:[SEL('type','Lens','Converging (convex),Diverging (concave)'.split(',')),
     C('f','Focal length',20,260,110,1,' cm'),C('u','Object distance',10,420,200,1,' cm'),
     C('ho','Object height',10,90,45,1,' cm')],
  draw(g,p,s){
    const conv=p.type.startsWith('Conv'), f=conv?p.f:-p.f;
    const cx=g.W/2, cy=g.H/2+10, sc=Math.min(1,(g.W/2-70)/Math.max(p.u,Math.abs(p.f)*2.2));
    g.line(30,cy,g.W-30,cy,g.C.grid,1.4);
    g.ctx.save(); g.ctx.translate(cx,cy);
    const lh=110;
    if(conv){ g.ctx.beginPath(); g.ctx.ellipse(0,0,16,lh,0,0,6.283); }
    else { g.ctx.beginPath(); g.ctx.moveTo(-14,-lh); g.ctx.lineTo(-6,-lh*0.1); g.ctx.lineTo(-6,lh*0.1);
      g.ctx.lineTo(-14,lh); g.ctx.lineTo(14,lh); g.ctx.lineTo(6,lh*0.1); g.ctx.lineTo(6,-lh*0.1); g.ctx.lineTo(14,-lh); g.ctx.closePath(); }
    g.ctx.fillStyle='rgba(167,139,250,.18)'; g.ctx.fill(); g.ctx.strokeStyle=g.C.violet; g.ctx.lineWidth=2; g.ctx.stroke(); g.ctx.restore();
    [-1,1].forEach(sg=>{ g.circle(cx+sg*Math.abs(f)*sc,cy,4,g.C.amber);
      g.text(sg<0?'F':"F'",cx+sg*Math.abs(f)*sc,cy+20,{c:g.C.amber,s:11}); });
    const v=1/(1/f-1/(-p.u))*1, vv=(f*(-p.u))/((-p.u)+f)*-1;
    const vi=(p.u*f)/(p.u-f), hi=-vi/p.u*p.ho;
    const ox=cx-p.u*sc, oy=cy-p.ho*sc;
    g.arrow(ox,cy,ox,oy,g.C.accent,3,9); g.text('object',ox,cy+20,{c:g.C.accent,s:11});
    const ix=cx+vi*sc, iy=cy-hi*sc;
    const virtual=vi<0;
    g.arrow(ix,cy,ix,iy,virtual?'rgba(251,113,133,.7)':g.C.rose,3,9);
    g.text(virtual?'virtual image':'real image',ix,cy+ (hi>0?20:-8),{c:g.C.rose,s:11});
    const ray=(pts,c,dash)=>g.path(pts,c,1.8);
    ray([[ox,oy],[cx,oy],[ix,iy]],'rgba(0,229,160,.65)');
    ray([[ox,oy],[cx,cy],[ix,iy]],'rgba(34,211,238,.55)');
    if(virtual){ g.line(cx,oy,ix,iy,'rgba(0,229,160,.3)',1.4,[5,4]); }
    g.text('1/v − 1/u = 1/f    v = '+fmt(vi)+' cm    m = '+fmt(-vi/p.u)+'×',g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
  },
  read(p){const conv=p.type.startsWith('Conv'),f=conv?p.f:-p.f,vi=(p.u*f)/(p.u-f);
    return [R('Focal length',f,'cm'),R('Object distance',p.u,'cm'),R('Image distance',vi,'cm'),
      R('Magnification',-vi/p.u),R('Image height',-vi/p.u*p.ho,'cm'),R('Power',100/f,'D'),
      R('Image type',vi<0?'Virtual, erect':'Real, inverted')];},

};

ENGINES.mirror={

ENGINES.prism={

    g.poly([apex,bl,br],'rgba(167,139,250,.14)',g.C.violet,2.5);
    const cols=[['#fb7185',-1],['#fbbf24',-0.5],['#00e5a0',0],['#22d3ee',0.6],['#a78bfa',1]];
    const i1=p.i*Math.PI/180;
    cols.forEach(([col,k])=>{
      const n=p.n*(1+p.disp*k*3);
      const r1=Math.asin(Math.sin(i1)/n), r2=A-r1;
      const sin_i2=n*Math.sin(r2);
      if(Math.abs(sin_i2)>1) return;
      const i2=Math.asin(sin_i2), dev=i1+i2-A;
      const hit=[cx-side*0.32*Math.sin(A/2)-40, cy-40];
      const entry=[(apex[0]+bl[0])/2+18,(apex[1]+bl[1])/2+8];
      const exit=[(apex[0]+br[0])/2-18,(apex[1]+br[1])/2+8];
      g.path([[entry[0]-170*Math.cos(0.25),entry[1]-170*Math.sin(0.25)],entry],col,2.2);
      g.path([entry,exit],col,2.2);
      g.path([exit,[exit[0]+220*Math.cos(dev+0.25),exit[1]+220*Math.sin(dev*1.6+0.2)]],col,2.4);
    });
    const r1=Math.asin(Math.sin(i1)/p.n), r2=A-r1, dev=i1+Math.asin(Math.max(-1,Math.min(1,p.n*Math.sin(r2))))-A;
    g.text('deviation '+fmt(dev*180/Math.PI,1)+'°  ·  minimum deviation '+fmt(minDev(p),1)+'°',
      g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
    g.text('White light splits because n is slightly larger for violet than for red',g.W/2,g.H-20,{c:g.C.mut,s:11});
  },
  read(p){const A=p.A*Math.PI/180,i1=p.i*Math.PI/180,r1=Math.asin(Math.sin(i1)/p.n),r2=A-r1;
    const s2=p.n*Math.sin(r2), ok=Math.abs(s2)<=1;
    return [R('Prism angle',p.A,'°'),R('Refraction angle r₁',r1*180/Math.PI,'°'),
      R('Emergence angle',ok?fmt(Math.asin(s2)*180/Math.PI):'TIR','°'),
      R('Deviation',ok?fmt((i1+Math.asin(s2)-A)*180/Math.PI):'—','°'),
      R('Minimum deviation',minDev(p),'°'),R('Refractive index',p.n),
      R('Angular dispersion',p.disp*(minDev(p)),'°')];},
  note:'At minimum deviation the ray passes symmetrically and n = sin((A+Dm)/2)/sin(A/2).'
};
function minDev(p){const A=p.A*Math.PI/180;return (2*Math.asin(p.n*Math.sin(A/2))-A)*180/Math.PI;}

ENGINES.ydse={
  c:[C('lam','Wavelength',380,750,550,1,' nm'),C('d','Slit separation',0.05,2,0.4,0.01,' mm'),
     C('D','Screen distance',0.3,4,1.5,0.05,' m'),C('slits','Number of slits',2,6,2,1)],
  draw(g,p,s){
    const lam=p.lam*1e-9, d=p.d/1000, D=p.D;
    const beta=lam*D/d;
    const col=wl2rgb(p.lam);
    const sx=70, scr=g.W-150, cy=g.H/2;
    g.rect(sx,cy-120,10,240,{f:g.C.metal});
    for(let k=0;k<p.slits;k++){ const y=cy+(k-(p.slits-1)/2)*18; g.rect(sx,y-3,10,6,{f:g.C.bg}); }
    g.rect(scr,cy-150,12,300,{f:g.C.face,s:g.C.bd,lw:1.5});
    for(let py=cy-150;py<cy+150;py++){
      const y=(py-cy)/300*0.03;
      const phase=Math.PI*d*y/(lam*D);
      const I=Math.pow(Math.sin(p.slits*phase)/Math.max(1e-6,p.slits*Math.sin(phase)),2);
      g.rect(scr,py,12,1,{f:`rgba(${col[0]},${col[1]},${col[2]},${clamp(I,0,1)})`});
    }
    for(let k=0;k<p.slits;k++){ const y=cy+(k-(p.slits-1)/2)*18;
      for(let m=-3;m<=3;m++) g.line(sx+10,y,scr,cy+m*beta/0.03*300*0.5,`rgba(${col[0]},${col[1]},${col[2]},.08)`,1); }
    g.text('fringe width β = λD/d = '+fmt(beta*1000)+' mm',g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
    const pts=[]; for(let i=0;i<=200;i++){ const y=(-0.015+0.03*i/200);
      const phase=Math.PI*d*y/(lam*D);
      pts.push([y*1000,Math.pow(Math.sin(p.slits*phase)/Math.max(1e-6,p.slits*Math.sin(phase)),2)]);}
    g.plot({x:sx+60,y:g.H-160,w:scr-sx-100,h:120,xmin:-15,xmax:15,ymin:0,ymax:1.1,
      series:[{pts,c:`rgb(${col[0]},${col[1]},${col[2]})`}],xlab:'position on screen (mm)',ylab:'intensity'});
  },
  read(p){const beta=p.lam*1e-9*p.D/(p.d/1000);
    return [R('Fringe width',beta*1000,'mm'),R('Wavelength',p.lam,'nm'),R('Slit separation',p.d,'mm'),
      R('Screen distance',p.D,'m'),R('Angular fringe width',beta/p.D*1000,'mrad'),
      R('3rd bright fringe at',3*beta*1000,'mm')];},
  note:'Fringe width grows with wavelength and screen distance, and shrinks as the slits move apart.'
};
function wl2rgb(w){let r,g2,b;
  if(w<440){r=-(w-440)/60;g2=0;b=1;} else if(w<490){r=0;g2=(w-440)/50;b=1;}
  else if(w<510){r=0;g2=1;b=-(w-510)/20;} else if(w<580){r=(w-510)/70;g2=1;b=0;}
  else if(w<645){r=1;g2=-(w-645)/65;b=0;} else {r=1;g2=0;b=0;}
  return [Math.round(clamp(r,0,1)*255),Math.round(clamp(g2,0,1)*255),Math.round(clamp(b,0,1)*255)];}

ENGINES.diffraction={

ENGINES.polarization={
  c:[C('th','Analyser angle',0,180,45,1,'°'),C('I0','Source intensity',10,100,100,1,' %'),
     SEL('src','Source light','Unpolarised,Polarised'.split(','))],
  draw(g,p,s){
    const cy=g.H/2, r=p.th*Math.PI/180;
    const after1=p.src==='Unpolarised'?p.I0/2:p.I0;
    const out=after1*Math.cos(r)**2;
    const filt=(x,ang,lab,c)=>{ g.ctx.save(); g.ctx.translate(x,cy);
      g.circle(0,0,62,'rgba(167,139,250,.10)',c,2.5);
      for(let i=-5;i<=5;i++){ const off=i*11;
        g.line(off*Math.cos(ang)+Math.sin(ang)*60,off*Math.sin(ang)-Math.cos(ang)*60,
               off*Math.cos(ang)-Math.sin(ang)*60,off*Math.sin(ang)+Math.cos(ang)*60,c,1.4);}
      g.ctx.restore(); g.text(lab,x,cy+86,{c,s:11}); };
    const x1=g.W*0.36,x2=g.W*0.64;
    const beam=(xa,xb,I,unpol)=>{ for(let i=0;i<9;i++){ const y=cy-32+i*8;
      g.line(xa,y,xb,y,`rgba(251,191,36,${clamp(I/160,0.04,.55)})`,2);} };
    beam(60,x1-62,p.I0,true); beam(x1+62,x2-62,after1); beam(x2+62,g.W-60,out);
    filt(x1,0,'polariser',g.C.violet); filt(x2,r,'analyser',g.C.cyan);
    g.circle(g.W-46,cy,24,`rgba(251,191,36,${clamp(out/100,0,1)})`,g.C.bd,1.5);
    g.text(fmt(out,1)+'%',g.W-46,cy+48,{c:g.C.amber,s:12,b:true,m:true});
    g.text("Malus' law: I = I₀cos²θ",g.W/2,32,{c:g.C.ink,s:13,b:true,m:true});
    if(Math.abs(p.th-90)<2) g.text('Crossed polarisers — the light is blocked',g.W/2,g.H-24,{c:g.C.rose,s:12,b:true});
  },
  read(p){const a1=p.src==='Unpolarised'?p.I0/2:p.I0, out=a1*Math.cos(p.th*Math.PI/180)**2;
    return [R('Angle between axes',p.th,'°'),R('After polariser',a1,'%'),R('Transmitted intensity',out,'%'),
      R('cos²θ',Math.cos(p.th*Math.PI/180)**2),R('Blocked fraction',100-out,'%')];},
  note:'An unpolarised beam loses half its intensity at the first filter, whatever the angle.'
};

ENGINES.photoelectric={
  c:[C('lam','Light wavelength',180,700,400,1,' nm'),C('Iw','Light intensity',0,100,60,1,' %'),

    const W={Caesium:2.14,Sodium:2.28,Zinc:4.3,Copper:4.7,Platinum:6.35}[p.met];

    const col=wl2rgb(clamp(p.lam,380,700));
    for(let i=0;i<6;i++){ const y=cy-60+i*24, f=((s.t*1.5+i/6)%1);
      g.line(cx-150+ -60+f*60,y,cx-120+f*60-60,y,`rgba(${col[0]},${col[1]},${col[2]},.8)`,2.5);}

    g.circle(cx,cy+150,22,g.C.bg,g.C.amber,2); g.text('A',cx,cy+156,{c:g.C.amber,s:13,b:true});
    const pts=[]; for(let i=0;i<=60;i++){ const l=180+i*(520/60), e=1240/l-W;
      pts.push([1240/l,Math.max(0,e)]);}

      title:'Max KE against photon energy',xlab:'hf (eV)',ylab:'KE (eV)'});
    g.text(emits?'Electrons are emitted':'No emission — photon energy is below the work function',

  },
  read(p){const W={Caesium:2.14,Sodium:2.28,Zinc:4.3,Copper:4.7,Platinum:6.35}[p.met];
    const E=1240/p.lam, KE=E-W;
    return [R('Photon energy',E,'eV'),R('Work function',W,'eV'),R('Max kinetic energy',Math.max(0,KE),'eV'),
      R('Stopping potential',Math.max(0,KE),'V'),R('Threshold wavelength',1240/W,'nm'),
      R('Threshold frequency',W*1.602e-19/6.626e-34/1e14,'×10¹⁴ Hz'),

};

ENGINES.bohr={
  c:[C('Z','Atomic number Z',1,10,1,1),C('ni','Initial level nᵢ',1,8,3,1),C('nf','Final level n_f',1,8,2,1)],
  init:()=>({a:0,glow:0}),
  step(s,p,dt){ s.a+=dt; s.glow=Math.max(0,s.glow-dt); if(Math.random()<dt*0.7) s.glow=0.7; },
  draw(g,p,s){
    const cx=g.W*0.32, cy=g.H/2, base=Math.min(g.W,g.H)/18;
    for(let n=1;n<=Math.max(p.ni,p.nf,4);n++){
      const r=base*n*n/1.6;
      g.circle(cx,cy,r,null,n===p.ni||n===p.nf?'rgba(0,229,160,.5)':'rgba(255,255,255,.08)',n===p.ni||n===p.nf?1.8:1);
      g.text('n='+n,cx+r+6,cy-4,{c:g.C.dim,s:10,a:'left',m:true});
      if(n===p.ni||n===p.nf){ const a=s.a*(3/n)+n; 
        g.circle(cx+Math.cos(a)*r,cy+Math.sin(a)*r,5,g.C.cyan,null,0,10);} }
    g.circle(cx,cy,9+p.Z,g.C.rose,null,0,18);
    const Ei=-13.6*p.Z*p.Z/(p.ni*p.ni), Ef=-13.6*p.Z*p.Z/(p.nf*p.nf), dE=Ei-Ef;
    if(dE>0&&s.glow>0){ const lam=1240/dE, col=wl2rgb(clamp(lam,380,700));
      const r1=base*p.ni*p.ni/1.6;
      for(let i=0;i<5;i++){ const a=s.a*2+i; 
        g.line(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*(r1+60*s.glow),cy+Math.sin(a)*(r1+60*s.glow),
          `rgba(${col[0]},${col[1]},${col[2]},${s.glow})`,2);} }
    const lv=[]; for(let n=1;n<=8;n++) lv.push(-13.6*p.Z*p.Z/(n*n));
    const x0=g.W*0.62, w=g.W*0.3, yTop=70, yBot=g.H-90;
    lv.forEach((E,i)=>{ const y=yBot-(E+13.6*p.Z*p.Z)/(13.6*p.Z*p.Z)*(yBot-yTop);
      g.line(x0,y,x0+w,y,(i+1===p.ni||i+1===p.nf)?g.C.accent:g.C.grid,(i+1===p.ni||i+1===p.nf)?2:1);
      g.text('n='+(i+1),x0-8,y+4,{c:g.C.dim,s:10,a:'right',m:true});});
    const yi=yBot-(Ei+13.6*p.Z*p.Z)/(13.6*p.Z*p.Z)*(yBot-yTop), yf=yBot-(Ef+13.6*p.Z*p.Z)/(13.6*p.Z*p.Z)*(yBot-yTop);
    g.arrow(x0+w/2,yi,x0+w/2,yf,dE>0?g.C.amber:g.C.violet,2.5,9);
    g.text((dE>0?'emission ':'absorption ')+fmt(Math.abs(dE))+' eV',x0+w/2,(yi+yf)/2-10,{c:g.C.amber,s:11,m:true});
  },
  read(p){const Ei=-13.6*p.Z*p.Z/(p.ni*p.ni), Ef=-13.6*p.Z*p.Z/(p.nf*p.nf), dE=Ei-Ef;
    return [R('Energy at nᵢ',Ei,'eV'),R('Energy at n_f',Ef,'eV'),R('Transition energy',Math.abs(dE),'eV'),
      R('Photon wavelength',1240/Math.abs(dE||1e-9),'nm'),R('Orbit radius nᵢ',0.529*p.ni*p.ni/p.Z,'Å'),
      R('Process',dE>0?'Emission':dE<0?'Absorption':'No change'),
      R('Series',p.nf===1?'Lyman (UV)':p.nf===2?'Balmer (visible)':p.nf===3?'Paschen (IR)':'Higher IR')];},
  note:'Balmer lines land in the visible range because they all end on n = 2.'
};

ENGINES.decay={
  c:[C('N0','Initial nuclei',100,10000,1000,10),C('hl','Half-life',1,120,20,1,' s'),
     C('span','Observation window',10,600,120,5,' s')],
  init:()=>({t:0}),
  step(s,p,dt){ s.t+=dt*4; if(s.t>p.span) s.t=0; },
  draw(g,p,s){
    const lam=Math.LN2/p.hl, N=p.N0*Math.exp(-lam*s.t);
    const gx=60,gy=70,gw=g.W*0.52,gh=g.H-170;
    const pts=[],lg=[];
    for(let i=0;i<=120;i++){const tt=p.span*i/120;pts.push([tt,p.N0*Math.exp(-lam*tt)]);
      lg.push([tt,Math.log(p.N0*Math.exp(-lam*tt))]);}
    g.plot({x:gx,y:gy,w:gw,h:gh,xmin:0,xmax:p.span,ymin:0,ymax:p.N0*1.05,series:[{pts,c:g.C.accent}],
      marks:[[s.t,N,g.C.amber,6]],title:'Undecayed nuclei',xlab:'t (s)',ylab:'N'});
    for(let k=1;k<=4;k++){ const t=p.hl*k; if(t>p.span) break;
      g.line(gx+t/p.span*gw,gy,gx+t/p.span*gw,gy+gh,'rgba(251,113,133,.3)',1.4,[4,4]);}
    const bx=gx+gw+50, bw=g.W-bx-50, cols=14, rows=10;
    const frac=N/p.N0;
    for(let i=0;i<cols*rows;i++){ const cxp=bx+(i%cols)*(bw/cols), cyp=gy+Math.floor(i/cols)*18;
      const alive=(i/(cols*rows))<frac;
      g.circle(cxp+7,cyp+8,5,alive?g.C.accent:'rgba(120,130,150,.25)');}
    g.text('sample',bx+bw/2,gy-12,{c:g.C.mut,s:11});
  },
  read(p,s){const lam=Math.LN2/p.hl, N=p.N0*Math.exp(-lam*s.t);
    return [R('Elapsed time',s.t,'s'),R('Nuclei remaining',N),R('Decayed',p.N0-N),
      R('Decay constant λ',lam,'/s'),R('Half-life',p.hl,'s'),R('Mean lifetime',1/lam,'s'),

ENGINES.debroglie={
  c:[SEL('part','Particle','Electron,Proton,Neutron,Alpha,Dust grain'.split(',')),
     C('V','Accelerating voltage',1,5000,100,1,' V'),C('slit','Slit width',0.01,5,0.5,0.01,' nm')],
  draw(g,p,s){
    const m={Electron:9.109e-31,Proton:1.673e-27,Neutron:1.675e-27,Alpha:6.64e-27,'Dust grain':1e-12}[p.part];
    const q={Electron:1.602e-19,Proton:1.602e-19,Neutron:1.602e-19,Alpha:3.2e-19,'Dust grain':1.602e-19}[p.part];
    const lam=6.626e-34/Math.sqrt(2*m*q*p.V);
    const nm=lam*1e9, ratio=nm/p.slit;
    const cx=g.W/2, cy=g.H/2;
    g.rect(90,cy-130,10,260,{f:g.C.metal}); g.rect(90,cy-clamp(p.slit*14,3,50)/2,10,clamp(p.slit*14,3,50),{f:g.C.bg});
    for(let i=0;i<9;i++){ const y=cy-70+i*18, f=((s.t*0.6+i/9)%1);
      g.circle(20+f*60,y,3,'rgba(0,229,160,.6)');}
    const spread=clamp(ratio*260,4,260);
    for(let py=cy-160;py<cy+160;py++){
      const yy=(py-cy)/spread*Math.PI;
      const I=yy===0?1:Math.pow(Math.sin(yy)/yy,2);
      g.rect(g.W-120,py,14,1,{f:`rgba(0,229,160,${clamp(I,0,1)})`});}
    g.rect(g.W-120,cy-160,14,320,{s:g.C.bd,lw:1.5});
    g.text('λ = h/√(2mqV) = '+(nm<0.001?nm.toExponential(2):fmt(nm))+' nm',g.W/2,36,{c:g.C.ink,s:13,b:true,m:true});
    g.text(ratio>0.05?'Wavelength comparable to the slit — strong diffraction'
      :'Wavelength far smaller than the slit — the particle behaves classically',
      g.W/2,g.H-28,{c:g.C.mut,s:12});
  },
  read(p){const m={Electron:9.109e-31,Proton:1.673e-27,Neutron:1.675e-27,Alpha:6.64e-27,'Dust grain':1e-12}[p.part];
    const q={Electron:1.602e-19,Proton:1.602e-19,Neutron:1.602e-19,Alpha:3.2e-19,'Dust grain':1.602e-19}[p.part];
    const v=Math.sqrt(2*q*p.V/m), lam=6.626e-34/(m*v);
    return [R('Speed',v,'m/s'),R('Momentum',m*v,'kg·m/s'),R('de Broglie wavelength',lam*1e9,'nm'),
      R('Kinetic energy',q*p.V/1.602e-19,'eV'),R('Slit/λ ratio',p.slit/(lam*1e9)),
      R('Behaviour',lam*1e9/p.slit>0.05?'Wave-like':'Particle-like')];},
  note:'Everything has a wavelength; for anything heavier than an atom it is far too small to notice.'
};

ENGINES.diode={
  c:[SEL('kind','Device','Silicon diode,Germanium diode,Zener diode,LED'.split(',')),
     C('V','Applied voltage',-12,3,0.7,0.01,' V'),C('Rs','Series resistor',10,2000,220,10,' Ω'),
     C('Vz','Zener breakdown',2,12,5.1,0.1,' V')],
  draw(g,p,s){
    const d=diodeI(p), I=d.I;
    const cx=g.W*0.26, cy=g.H/2;
    g.rect(cx-130,cy-70,260,140,{s:g.C.bd,lw:1.5,r:8});
    g.poly([[cx-14,cy-16],[cx-14,cy+16],[cx+14,cy]],d.on?'rgba(0,229,160,.45)':'rgba(120,130,150,.2)',g.C.accent,2);
    g.line(cx+14,cy-18,cx+14,cy+18,g.C.accent,3);
    g.line(cx-90,cy,cx-14,cy,g.C.metal,2); g.line(cx+14,cy,cx+90,cy,g.C.metal,2);
    if(p.kind==='LED'&&d.on) g.circle(cx,cy,26+8*Math.sin(s.t*6),'rgba(251,191,36,.25)',null,0,20);
    for(let i=0;i<6;i++){ if(Math.abs(I)<1e-5) break; const f=((s.t*clamp(Math.abs(I)*20,0.3,3)+i/6)%1);
      g.circle(cx-90+f*180*Math.sign(I||1),cy,3.2,g.C.accent);}
    g.text(p.kind,cx,cy-56,{c:g.C.mut,s:12});
    const pts=[]; for(let i=0;i<=200;i++){ const v=-12+i*(15/200);
      pts.push([v,diodeI({...p,V:v}).I*1000]);}
    g.plot({x:g.W*0.56,y:70,w:g.W*0.36,h:g.H-160,xmin:-12,xmax:3,ymin:-40,ymax:40,
      series:[{pts,c:g.C.accent}],marks:[[p.V,I*1000,g.C.amber,6]],
      title:'I–V characteristic',xlab:'V (V)',ylab:'I (mA)'});
  },
  read(p){const d=diodeI(p);
    return [R('Applied voltage',p.V,'V'),R('Diode current',d.I*1000,'mA'),R('Diode voltage drop',d.Vd,'V'),
      R('Resistor voltage',p.V-d.Vd,'V'),R('Power in diode',d.Vd*d.I*1000,'mW'),
      R('State',d.on?(p.V<0?'Breakdown':'Forward conducting'):'Non-conducting')];},
  note:'A diode only conducts past its knee voltage: about 0.7 V for silicon, 0.3 V for germanium.'
};
function diodeI(p){
  const knee={'Silicon diode':0.7,'Germanium diode':0.3,'Zener diode':0.7,'LED':1.8}[p.kind];
  if(p.V>=knee){ const I=(p.V-knee)/p.Rs; return {I,Vd:knee,on:true}; }
  if(p.kind==='Zener diode'&&p.V<=-p.Vz){ const I=(p.V+p.Vz)/p.Rs; return {I,Vd:-p.Vz,on:true}; }
  return {I:p.V>0?1e-7*p.V:-1e-8,Vd:p.V,on:false};
}

ENGINES.solarcell={
  c:[C('G','Irradiance',100,1200,1000,10,' W/m²'),C('ang','Panel tilt error',0,80,0,1,'°'),
     C('A','Panel area',0.05,3,0.5,0.01,' m²'),C('eff','Cell efficiency',5,28,18,0.5,' %'),
     C('T','Cell temperature',0,80,25,1,' °C'),C('Rl','Load resistance',0.5,60,10,0.5,' Ω')],
  draw(g,p,s){
    const d=solar(p);
    const cx=g.W*0.26, cy=g.H/2+10;
    g.ctx.save(); g.ctx.translate(cx,cy); g.ctx.rotate(-p.ang*Math.PI/180);
    g.rect(-110,-70,220,140,{f:'rgba(34,211,238,.18)',s:g.C.cyan,lw:2,r:4});
    for(let i=1;i<4;i++) g.line(-110+i*55,-70,-110+i*55,70,g.C.bd,1.2);
    for(let i=1;i<3;i++) g.line(-110,-70+i*46,110,-70+i*46,g.C.bd,1.2);
    g.ctx.restore();
    g.circle(g.W*0.12,80,26,g.C.amber,null,0,26);
    for(let i=0;i<7;i++){ const x=g.W*0.12+ i*18-20, y0=110;
      g.arrow(x,y0,x+ (cx-x)*0.5, y0+(cy-y0)*0.5,`rgba(251,191,36,${.5-p.ang/200})`,1.6,6);}
    g.rect(g.W*0.44,cy-24,16,48,{f:g.C.bg,s:g.C.rose,lw:2}); g.text(p.Rl+'Ω',g.W*0.44+30,cy+4,{c:g.C.rose,s:11,a:'left',m:true});
    const pts=[],pp=[];
    for(let i=0;i<=80;i++){ const v=i*d.Voc/80;
      const I=Math.max(0,d.Isc*(1-Math.exp((v-d.Voc)/(0.06*d.Voc))));
      pts.push([v,I]); pp.push([v,v*I]);}
    g.plot({x:g.W*0.56,y:70,w:g.W*0.36,h:g.H-160,xmin:0,xmax:d.Voc*1.05,ymin:0,ymax:d.Isc*1.15,
      series:[{pts,c:g.C.accent},{pts:pp.map(q=>[q[0],q[1]/Math.max(...pp.map(r=>r[1]))*d.Isc]),c:'rgba(251,191,36,.7)'}],
      marks:[[d.V,d.I,g.C.amber,6]],title:'I–V (green) and power (amber)',xlab:'V (V)',ylab:'I (A)'});
  },
  read(p){const d=solar(p);
    return [R('Effective irradiance',d.Geff,'W/m²'),R('Open-circuit voltage',d.Voc,'V'),
      R('Short-circuit current',d.Isc,'A'),R('Operating voltage',d.V,'V'),R('Operating current',d.I,'A'),
      R('Output power',d.P,'W'),R('Maximum power point',d.Pmax,'W'),R('Conversion efficiency',d.P/(d.Geff*p.A)*100,'%')];},
  note:'Output falls with cosine of the tilt error and with rising cell temperature — hence solar trackers and cooling.'
};
function solar(p){
  const Geff=p.G*Math.cos(p.ang*Math.PI/180);
  const Pmax=Geff*p.A*p.eff/100*(1-0.004*(p.T-25));
  const Voc=Math.max(0.1,(0.6+0.05*Math.log10(Math.max(Geff,1)/1000+1))*12*(1-0.003*(p.T-25)));
  const Isc=Math.max(0.001,Pmax/Voc/0.78);
  const I=Math.max(0,Isc*(1-Math.exp((Math.min(Voc,Isc*p.Rl)-Voc)/(0.06*Voc))));
  const V=Math.min(I*p.Rl,Voc);
  return {Geff,Pmax:Math.max(0,Pmax),Voc,Isc,V,I,P:V*I};
}

ENGINES.logic={
  c:[SEL('gate','Gate','AND,OR,NOT,NAND,NOR,XOR,XNOR'.split(',')),
     C('A','Input A',0,1,0,1),C('B','Input B',0,1,0,1)],
  draw(g,p,s){
    const f={AND:(a,b)=>a&&b?1:0,OR:(a,b)=>a||b?1:0,NOT:a=>a?0:1,
      NAND:(a,b)=>a&&b?0:1,NOR:(a,b)=>a||b?0:1,XOR:(a,b)=>a^b,XNOR:(a,b)=>a===b?1:0}[p.gate];
    const A=Math.round(p.A),B=Math.round(p.B), Y=p.gate==='NOT'?f(A):f(A,B);
    const cx=g.W*0.36, cy=g.H/2, w=110, h=86;
    const on=g.C.accent, off='rgba(120,135,160,.5)';
    const bub=['NAND','NOR','NOT','XNOR'].includes(p.gate);
    g.ctx.save(); g.ctx.translate(cx,cy);
    g.ctx.beginPath();
    if(['AND','NAND'].includes(p.gate)){ g.ctx.moveTo(-w/2,-h/2); g.ctx.lineTo(0,-h/2);
      g.ctx.arc(0,0,h/2,-Math.PI/2,Math.PI/2); g.ctx.lineTo(-w/2,h/2); g.ctx.closePath(); }
    else if(p.gate==='NOT'){ g.ctx.moveTo(-w/2,-h/2); g.ctx.lineTo(w/2,0); g.ctx.lineTo(-w/2,h/2); g.ctx.closePath(); }
    else { g.ctx.moveTo(-w/2,-h/2); g.ctx.quadraticCurveTo(-w/6,0,-w/2,h/2);

    if(['XOR','XNOR'].includes(p.gate)){ g.ctx.save(); g.ctx.translate(cx-12,cy); g.ctx.beginPath();
      g.ctx.moveTo(-w/2,-h/2); g.ctx.quadraticCurveTo(-w/6,0,-w/2,h/2); g.ctx.strokeStyle=g.C.amber; g.ctx.lineWidth=2.5;
      g.ctx.stroke(); g.ctx.restore(); }
    g.text(p.gate,cx-8,cy+6,{c:g.C.amber,s:15,b:true});

ENGINES.flipflop={
  c:[SEL('kind','Type','SR latch,D flip-flop,JK flip-flop,T flip-flop'.split(',')),
     C('in1','Input 1 (S/D/J/T)',0,1,0,1),C('in2','Input 2 (R/K)',0,1,0,1),C('clk','Clock rate',0.2,4,1,0.1,' Hz')],
  init:()=>({Q:0,last:0}),
  step(s,p,dt){
    const edge=Math.floor(s.t*p.clk)!==Math.floor((s.t-dt)*p.clk);
    s.pulse=Math.sin(s.t*p.clk*2*Math.PI)>0?1:0;
    if(!edge||!s.pulse) return;
    const a=Math.round(p.in1), b=Math.round(p.in2);
    if(p.kind==='SR latch'){ if(a&&!b)s.Q=1; else if(b&&!a)s.Q=0; else if(a&&b)s.Q='X'; }
    else if(p.kind==='D flip-flop') s.Q=a;
    else if(p.kind==='JK flip-flop'){ if(a&&b)s.Q=s.Q?0:1; else if(a)s.Q=1; else if(b)s.Q=0; }
    else if(p.kind==='T flip-flop'){ if(a) s.Q=s.Q?0:1; }

    g.line(cx-200,cy+70,cx-90,cy+70,s.pulse?g.C.amber:'rgba(120,135,160,.5)',3);
    g.text('CLK',cx-212,cy+74,{c:g.C.amber,s:12,a:'right',m:true});

    g.text('Q = '+Q,cx+210,cy-25,{c:Q===1?g.C.accent:g.C.mut,s:13,b:true,a:'left',m:true});

    const pts=[];for(let i=0;i<=200;i++){const t=i/200*6; pts.push([t,Math.sin(t*p.clk*2*Math.PI)>0?1:0]);}
    g.plot({x:70,y:g.H-140,w:g.W-140,h:90,xmin:0,xmax:6,ymin:-0.2,ymax:1.3,series:[{pts,c:g.C.amber}],xlab:'clock'});
    if(Q==='X') g.text('S = R = 1 is a forbidden state',g.W/2,40,{c:g.C.rose,s:12,b:true});
  },
  read(p,s){return [R('Type',p.kind),R('Stored bit Q',s.Q),R('Input 1',Math.round(p.in1)),
    R('Input 2',Math.round(p.in2)),R('Clock',p.clk,'Hz'),R('Clock level',s.pulse||0)];},
  note:'A flip-flop is one bit of memory: it holds its state until the clock tells it to change.'

ENGINES.counter={
  c:[C('bits','Number of bits',2,8,4,1),C('f','Clock frequency',0.3,6,1.5,0.1,' Hz'),
     SEL('dir','Direction','Up,Down'.split(','))],
  init:()=>({n:0,last:-1}),
  step(s,p,dt){
    const tick=Math.floor(s.t*p.f);
    if(tick!==s.last){ s.last=tick; const max=Math.pow(2,Math.round(p.bits));
      s.n=p.dir==='Up'?(s.n+1)%max:(s.n-1+max)%max; }
  },
  draw(g,p,s){
    const bits=Math.round(p.bits), max=Math.pow(2,bits);

    for(let i=0;i<bits;i++){
      const bit=(s.n>>(bits-1-i))&1, x=g.W/2-(bits*bw)/2+i*bw;
      g.rect(x+4,y,bw-8,bw-8,{f:bit?'rgba(0,229,160,.28)':'rgba(120,135,160,.10)',s:bit?g.C.accent:g.C.bd,lw:2,r:8});

      g.text('2'+['⁷','⁶','⁵','⁴','³','²','¹','⁰'][8-bits+i],x+bw/2,y+bw+14,{c:g.C.dim,s:11,m:true});}
    g.text(s.n.toString(2).padStart(bits,'0'),g.W/2,y-30,{c:g.C.cyan,s:16,b:true,m:true});
    g.text('decimal '+s.n+' of '+(max-1),g.W/2,g.H-70,{c:g.C.ink,s:14,b:true,m:true});
    g.text('every flip-flop halves the frequency of the one before it',g.W/2,g.H-44,{c:g.C.mut,s:11});
  },
  read(p,s){const bits=Math.round(p.bits);
    return [R('Count',s.n),R('Binary',s.n.toString(2).padStart(bits,'0')),R('Modulus',Math.pow(2,bits)),
      R('Clock frequency',p.f,'Hz'),R('Output frequency',p.f/Math.pow(2,bits),'Hz'),
      R('Full cycle time',Math.pow(2,bits)/p.f,'s')];},
  note:'An n-bit ripple counter divides the clock by 2ⁿ — the basis of digital timekeeping.'
};

    const cx=g.W*0.42, cy=g.H/2;

    g.rect(cx-20,cy-108,64,24,{f:g.C.bg,s:g.C.rose,lw:2,r:3}); g.text(p.Rf+'k',cx+12,cy-92,{c:g.C.rose,s:11,b:true,m:true});
    g.rect(cx-180,cy-42,54,24,{f:g.C.bg,s:g.C.cyan,lw:2,r:3}); g.text(p.Rin+'k',cx-153,cy-26,{c:g.C.cyan,s:11,b:true,m:true});
    g.text('Vin = '+fmt(p.Vin)+' V',cx-190,cy+50,{c:g.C.accent,s:12,a:'left',m:true});
    g.text('Vout = '+fmt(d.Vout)+' V',cx+176,cy+5,{c:d.clip?g.C.rose:g.C.amber,s:13,b:true,a:'left',m:true});
    if(d.clip) g.text('output clipped at the supply rail',g.W/2,g.H-40,{c:g.C.rose,s:12,b:true});
    const pts=[];for(let i=0;i<=100;i++){const v=-5+i/10;
      pts.push([v,opampOut({...p,Vin:v}).Vout]);}
    g.plot({x:g.W-250,y:80,w:190,h:g.H-190,xmin:-5,xmax:5,ymin:-p.Vcc,ymax:p.Vcc,
      series:[{pts,c:g.C.accent}],marks:[[p.Vin,d.Vout,g.C.amber,5]],xlab:'Vin (V)',ylab:'Vout (V)'});
  },
  read(p){const d=opampOut(p);
    return [R('Configuration',p.cfg),R('Gain',d.gain),R('Input voltage',p.Vin,'V'),
      R('Output voltage',d.Vout,'V'),R('Saturated',d.clip?'Yes':'No'),
      R('Input impedance',p.cfg==='Inverting'?p.Rin+' kΩ':'very high')];},
  note:'Ideal op-amp rules: no current into the inputs, and feedback drives the input difference to zero.'
};
function opampOut(p){
  let gain;
  if(p.cfg==='Inverting') gain=-p.Rf/p.Rin;
  else if(p.cfg==='Non-inverting') gain=1+p.Rf/p.Rin;
  else if(p.cfg==='Voltage follower') gain=1;
  else gain=-p.Rf/p.Rin*2;
  let V=gain*p.Vin, clip=false;
  if(Math.abs(V)>p.Vcc){ V=Math.sign(V)*p.Vcc; clip=true; }
  return {gain,Vout:V,clip};
}

ENGINES.oscillator={
  c:[C('Rk','Resistance',1,200,10,1,' kΩ'),C('Cu','Capacitance',0.01,10,1,0.01,' µF'),
     SEL('wave','Output','Square (astable),Sine (LC),Triangle'.split(',')),C('Lh','Inductance',0.1,100,10,0.1,' mH')],
  draw(g,p,s){
    const f=p.wave==='Sine (LC)'?1/(2*Math.PI*Math.sqrt(p.Lh*1e-3*p.Cu*1e-6))
      :1.44/((2*p.Rk*1000)*p.Cu*1e-6)/1000*1000;
    const per=1/f, pts=[];
    for(let i=0;i<=300;i++){ const t=i/300*3*per, ph=(t/per)%1;
      let v; if(p.wave.startsWith('Square')) v=ph<0.5?1:0;
      else if(p.wave.startsWith('Sine')) v=0.5+0.5*Math.sin(2*Math.PI*ph);
      else v=ph<0.5?ph*2:2-ph*2;
      pts.push([t,v*5]);}
    g.plot({x:70,y:90,w:g.W-140,h:g.H-210,xmin:0,xmax:3*per,ymin:-0.5,ymax:5.8,
      series:[{pts,c:g.C.accent}],title:p.wave+' output',xlab:'t (s)',ylab:'V (V)'});
    const led=((s.t*f)%1)<0.5;
    g.circle(g.W/2,g.H-56,15,led?'rgba(251,191,36,.7)':'rgba(120,135,160,.15)',g.C.bd,1.5,led?18:0);

function rocket(p){
  const P=p.P*1e5, mw=p.Vb*p.Vw/100/1000*1000, ve=Math.sqrt(2*(P-1e5)/1000);
  const m0=p.m0/1000, mtot=m0+mw/1000;

  const r=p.ang*Math.PI/180, vx=v0*Math.cos(r), vy=v0*Math.sin(r);
  const T=2*vy/9.81;

}

    return [R('Coupling coefficient',k),R('Transfer efficiency',eff*100,'%'),
      R('Delivered power',p.Pin*eff,'W'),R('Power lost',p.Pin*(1-eff),'W'),
      R('Separation',p.d,'cm'),R('Misalignment',p.align,'°')];},
  note:'Inductive charging depends on shared flux, so efficiency dives once the coils separate or tilt.'
};

ENGINES.vernier={
  c:[SEL('tool','Instrument','Vernier caliper,Screw gauge'.split(',')),
     C('main','Main scale reading',0,60,23,1,' div'),C('vern','Vernier / circular division',0,49,7,1,' div'),
     C('zero','Zero error',-5,5,0,1,' div')],
  draw(g,p,s){
    const cal=p.tool==='Vernier caliper';
    const LC=cal?0.1/10:0.5/50;
    const reading=cal? p.main*1+p.vern*LC - p.zero*LC : p.main*0.5+p.vern*LC - p.zero*LC;
    const x0=70, x1=g.W-70, y=g.H/2-60;
    g.line(x0,y,x1,y,g.C.metal,3);
    for(let i=0;i<=60;i++){ const x=x0+(x1-x0)*i/60;
      g.line(x,y,x,y-(i%10===0?22:12),g.C.bd,i%10===0?2:1);
      if(i%10===0) g.text(cal?i+'':(i/2)+'',x,y-28,{c:g.C.dim,s:10,m:true});}
    const vx=x0+(x1-x0)*p.main/60;
    g.line(vx,y+8,vx+(x1-x0)*10/60,y+8,g.C.accent,3);
    for(let i=0;i<=10;i++){ const x=vx+(x1-x0)*(i*0.9)/60;
      g.line(x,y+8,x,y+8+(i===p.vern%10?24:14),i===p.vern%10?g.C.amber:g.C.accent,i===p.vern%10?2.5:1.2);
      if(i%5===0) g.text(i+'',x,y+46,{c:g.C.dim,s:10,m:true});}
    g.text('least count = '+fmt(LC,cal?2:3)+' '+(cal?'mm':'mm'),g.W/2,g.H-80,{c:g.C.mut,s:12,m:true});
    g.text('reading = '+fmt(reading,3)+' mm',g.W/2,g.H-46,{c:g.C.ink,s:16,b:true,m:true});
  },
  read(p){const cal=p.tool==='Vernier caliper', LC=cal?0.01:0.01;
    const lc=cal?0.1/10:0.5/50;
    const raw=cal? p.main+p.vern*lc : p.main*0.5+p.vern*lc;
    return [R('Instrument',p.tool),R('Least count',lc,'mm'),R('Main scale',cal?p.main:p.main*0.5,'mm'),
      R('Vernier contribution',p.vern*lc,'mm'),R('Raw reading',raw,'mm'),
      R('Zero error',p.zero*lc,'mm'),R('Corrected reading',raw-p.zero*lc,'mm')];},
  note:'Always subtract the zero error: a positive zero error makes every reading too large.'
};

ENGINES.errors={
  c:[C('n','Number of trials',3,20,8,1),C('mean','True value',1,100,25,0.5),
     C('sd','Random scatter',0,8,1.5,0.1),C('bias','Systematic offset',-6,6,0,0.1)],
  resetOnChange:true,
  init:p=>{ const d=[]; for(let i=0;i<20;i++){ let u=0,v=0;
      while(!u)u=Math.random(); while(!v)v=Math.random();
      d.push(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)); } return {z:d}; },
  draw(g,p,s){
    const n=Math.round(p.n), vals=s.z.slice(0,n).map(z=>p.mean+p.bias+z*p.sd);
    const m=vals.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)**2,0)/Math.max(1,n-1));
    const lo=Math.min(...vals,p.mean)-2, hi=Math.max(...vals,p.mean)+2;
    const pts=vals.map((v,i)=>[i+1,v]);
    g.plot({x:80,y:80,w:g.W-160,h:g.H-200,xmin:0,xmax:n+1,ymin:lo,ymax:hi,
      series:[{pts,c:g.C.accent,dots:true,r:5},
        {pts:[[0,p.mean],[n+1,p.mean]],c:'rgba(251,113,133,.7)',w:1.8},
        {pts:[[0,m],[n+1,m]],c:'rgba(251,191,36,.8)',w:1.8}],
      title:'Trial readings (red = true value, amber = mean)',xlab:'trial',ylab:'reading'});
    g.text('mean '+fmt(m)+'  ±  '+fmt(sd/Math.sqrt(n))+'   (standard error)',g.W/2,g.H-40,{c:g.C.ink,s:13,b:true,m:true});
  },
  read(p,s){const n=Math.round(p.n), vals=s.z.slice(0,n).map(z=>p.mean+p.bias+z*p.sd);
    const m=vals.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)**2,0)/Math.max(1,n-1));
    return [R('Trials',n),R('Mean',m),R('Standard deviation',sd),R('Standard error',sd/Math.sqrt(n)),
      R('Systematic error',m-p.mean),R('Percentage error',Math.abs(m-p.mean)/p.mean*100,'%'),
      R('Accuracy',Math.abs(p.bias)<0.3?'Good':'Biased'),R('Precision',sd<1?'High':'Low')];},
  note:'More trials shrink the random error as 1/√n, but they never remove a systematic offset.'
};

ENGINES.arduino={
  c:[SEL('sig','Signal','PWM output,Analogue read,Digital pulse'.split(',')),
     C('duty','Duty cycle',0,100,50,1,' %'),C('f','Frequency',1,500,50,1,' Hz'),
     C('Vref','Reference voltage',3.3,5,5,0.1,' V'),C('adc','Analogue input',0,1023,512,1,' counts')],
  draw(g,p,s){
    const per=1/p.f, pts=[];
    for(let i=0;i<=400;i++){ const t=i/400*3*per, ph=(t/per)%1;
      let v;
      if(p.sig==='PWM output') v=ph<p.duty/100?p.Vref:0;
      else if(p.sig==='Analogue read') v=p.adc/1023*p.Vref;
      else v=ph<0.08?p.Vref:0;
      pts.push([t,v]);}
    g.plot({x:70,y:80,w:g.W-140,h:g.H-210,xmin:0,xmax:3*per,ymin:-0.3,ymax:p.Vref*1.15,
      series:[{pts,c:g.C.accent}],title:p.sig,xlab:'t (s)',ylab:'V'});
    const avg=p.sig==='PWM output'?p.Vref*p.duty/100:p.sig==='Analogue read'?p.adc/1023*p.Vref:p.Vref*0.08;
    const led=((s.t*p.f)%1)<p.duty/100;
    g.circle(g.W/2,g.H-60,16,led?`rgba(251,191,36,${0.3+p.duty/140})`:'rgba(120,135,160,.15)',g.C.bd,1.5,led?18:0);
    g.text('average output '+fmt(avg)+' V',g.W/2,g.H-22,{c:g.C.ink,s:13,b:true,m:true});
  },
  read(p){const avg=p.sig==='PWM output'?p.Vref*p.duty/100:p.sig==='Analogue read'?p.adc/1023*p.Vref:p.Vref*0.08;
    return [R('Signal',p.sig),R('Average voltage',avg,'V'),R('Duty cycle',p.duty,'%'),
      R('Frequency',p.f,'Hz'),R('ADC counts',Math.round(p.adc)),R('ADC resolution',p.Vref/1024*1000,'mV'),
      R('Period',1/p.f*1000,'ms')];},
  note:'PWM fakes an analogue voltage by switching fast — the load only feels the average.'
};
