          </div></div>
        <div class="gwrap"><canvas id="gcv"></canvas></div>
        <div class="gstats" id="gstats"></div>
      </div>`;
    ['gx','gy','gfit'].forEach(id=>$('#'+id).onchange=()=>this.drawGraph());
    this.drawGraph();
    if(!this._gr){ this._gr=true; window.addEventListener('resize',()=>{ if(this.tab==='graph') this.drawGraph(); }); }
  },
  drawGraph(){
    const cv=$('#gcv'); if(!cv) return;
    const rows=App.state.obs[this.exp.id]||[], keys=Object.keys(rows[0].d);
    const xk=keys[+$('#gx').value], yk=keys[+$('#gy').value], fit=$('#gfit').value==='1';
    const dpr=Math.min(2,window.devicePixelRatio||1), r=cv.getBoundingClientRect();
    cv.width=r.width*dpr; cv.height=r.height*dpr;
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    const W=r.width,H=r.height, g=Gfx(ctx,W,H); g.clear();
    const xs=rows.map(o=>o.d[xk]), ys=rows.map(o=>o.d[yk]);
    const pad=v=>{const a=Math.min(...v),b=Math.max(...v),d=(b-a)||Math.abs(a)||1;return [a-d*0.12,b+d*0.12];};
    const [x0,x1]=pad(xs),[y0,y1]=pad(ys);
    const n=rows.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
    const sxy=xs.reduce((a,b,i)=>a+b*ys[i],0), sxx=xs.reduce((a,b)=>a+b*b,0);
    const den=(n*sxx-sx*sx);
    const m=den?(n*sxy-sx*sy)/den:0, c=(sy-m*sx)/n;
    const ybar=sy/n;
    const ssTot=ys.reduce((a,b)=>a+(b-ybar)**2,0);
    const ssRes=ys.reduce((a,b,i)=>a+(b-(m*xs[i]+c))**2,0);
    const r2=ssTot?1-ssRes/ssTot:1;
    const series=[{pts:rows.map(o=>[o.d[xk],o.d[yk]]),c:Pal.c.accent,dots:true,r:5}];
    if(fit&&den) series.unshift({pts:[[x0,m*x0+c],[x1,m*x1+c]],c:'rgba(251,191,36,.85)',w:2});
    g.plot({x:70,y:40,w:W-110,h:H-100,xmin:x0,xmax:x1,ymin:y0,ymax:y1,series,
      xlab:xk+(rows[0].u[xk]?' ('+rows[0].u[xk]+')':''),
      ylab:yk+(rows[0].u[yk]?' ('+rows[0].u[yk]+')':'')});
    $('#gstats').innerHTML=`
      <div class="gstat"><small>Points</small><b>${n}</b></div>
      <div class="gstat"><small>Gradient</small><b>${fmt(m)}</b></div>
      <div class="gstat"><small>Intercept</small><b>${fmt(c)}</b></div>
      <div class="gstat"><small>R²</small><b>${fmt(r2,4)}</b></div>
      <div class="gstat"><small>x mean</small><b>${fmt(sx/n)}</b></div>
      <div class="gstat"><small>y mean</small><b>${fmt(ybar)}</b></div>`;
  },
  startViva(){
    const qs=quizFor(this.exp.sim);
    this.viva={qs,i:0,score:0};
    this.renderQ();
  },
  renderQ(){
    const v=this.viva, q=v.qs[v.i];
    $('#tabBody').innerHTML=`
      <div class="card" style="max-width:720px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px">
          <span>Question ${v.i+1} of ${v.qs.length}</span><span>Score ${v.score}/${v.i}</span></div>
        <div class="bar"><i style="width:${v.i/v.qs.length*100}%"></i></div>
        <h3 style="font-size:15px;color:var(--text);margin:14px 0 12px">${q.q}</h3>
        <div style="display:flex;flex-direction:column;gap:8px" id="opts">
          ${q.o.map((o,i)=>`<button class="q-opt" onclick="Lab.answer(${i})">
            <span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}
        </div>
        <div id="qexp"></div>
        <div id="qnext" style="display:none;margin-top:14px">
          <button class="btn btn-primary" onclick="Lab.nextQ()">
            ${v.i+1<v.qs.length?'Next question':'Finish viva'}<i class="fas fa-arrow-right"></i></button>
        </div>
      </div>`;
  },
  answer(i){
    const v=this.viva, q=v.qs[v.i];
    $$('#opts .q-opt').forEach((b,j)=>{ b.disabled=true; b.style.cursor='default';
      if(j===q.a) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
    if(i===q.a){ v.score++; App.toast('Correct'); } else App.toast('Not quite','e');
    $('#qexp').innerHTML=`<div class="q-exp"><b>Why:</b> ${q.e}</div>`;
    $('#qnext').style.display='block';
  },
  nextQ(){
    const v=this.viva; v.i++;
    if(v.i<v.qs.length) return this.renderQ();
    const pct=Math.round(v.score/v.qs.length*100);
    App.state.scores[this.exp.id]=pct;
    App.log('fa-trophy','Scored '+pct+'% on '+this.exp.name,'var(--amber)');
    App.save();
    $('#tabBody').innerHTML=`
      <div class="card" style="max-width:520px;text-align:center">
        <div style="font-size:40px;color:var(--accent);margin-bottom:8px"><i class="fas fa-trophy"></i></div>
        <h3 style="justify-content:center;font-size:20px;color:var(--text)">${pct}%</h3>
        <p style="text-align:center">${v.score} of ${v.qs.length} correct on ${esc(this.exp.name)}.
        ${pct===100?'Nothing left to fix here.':pct>=60?'Worth a second look at the theory tab before moving on.':'Go back through the theory and try the simulation again — it will make more sense the second time.'}</p>
        <div class="cbtns" style="justify-content:center">
          <button class="cbtn p" onclick="Lab.startViva()"><i class="fas fa-rotate-right"></i>Try again</button>
          <button class="cbtn" onclick="Lab.tabTo('theory')"><i class="fas fa-book"></i>Back to theory</button>
          <button class="cbtn" onclick="App.go('lab')"><i class="fas fa-flask"></i>Next experiment</button>
        </div>
      </div>`;
    App.renderHome();
  }

          background:linear-gradient(135deg,var(--accent),var(--cyan));color:#04231a;font-size:24px">
          <i class="fas fa-robot"></i></div>
        <h3 style="justify-content:center;color:var(--text);font-size:18px">Physics tutor</h3>
        <p style="text-align:center">Ask about any concept, formula or experiment in the lab. Answers are drawn from the same notes the experiments use.</p>
        <div class="chips" style="justify-content:center;margin-top:12px">
          ${['Explain Newton’s second law','How does a transformer work?','What is the photoelectric effect?','Why do we plot T² against L?']
            .map(s=>`<button class="chip" onclick="App.ask('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}
        </div>
      </div>
      <div class="ai-chat">
        <div class="ai-msgs" id="aiMsgs">
          <div class="msg ai"><div class="av"><i class="fas fa-robot"></i></div>
            <div class="bub">Ask me anything in the syllabus — a concept, a formula, or which experiment to open for a topic.</div></div>
        </div>
        <div class="ai-in">
          <input id="aiIn" placeholder="Ask a physics question…" onkeydown="if(event.key==='Enter')App.sendAI()">
          <button onclick="App.sendAI()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>`;
};
App.sendAI=function(){ const i=$('#aiIn'); const q=i.value.trim(); if(!q) return; i.value=''; this.ask(q); };
App.ask=function(q){
  if(!$('#aiMsgs')){ this.go('ai'); setTimeout(()=>this.ask(q),80); return; }
  const box=$('#aiMsgs');
  box.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="av"><i class="fas fa-user"></i></div><div class="bub">${esc(q)}</div></div>`);
  box.scrollTop=box.scrollHeight;
  const typing=document.createElement('div');
  typing.className='msg ai';
  typing.innerHTML='<div class="av"><i class="fas fa-robot"></i></div><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div>';
  box.appendChild(typing); box.scrollTop=box.scrollHeight;
  setTimeout(()=>{ typing.remove();
    box.insertAdjacentHTML('beforeend',
      `<div class="msg ai"><div class="av"><i class="fas fa-robot"></i></div><div class="bub">${this.answer(q)}</div></div>`);
    box.scrollTop=box.scrollHeight;
  },520);
};
App.answer=function(q){
  const ql=q.toLowerCase();
  const hits=EXPERIMENTS.filter(e=>{
    const n=e.name.toLowerCase();
    return n.split(/[^a-z]+/).filter(w=>w.length>3).some(w=>ql.includes(w));
  }).slice(0,3);
  const fhits=FORMULAS.filter(f=>{
    const n=f[1].toLowerCase();
    return n.split(/[^a-z]+/).filter(w=>w.length>3).some(w=>ql.includes(w));
  }).slice(0,3);
  let out='';
  if(hits.length){
    const t=TH[hits[0].sim]||TH.generic;
    out+=`<b>${hits[0].name}</b><br>${t.th}<br>`+
      t.f.slice(0,2).map(f=>`<code>${f[0]}  —  ${f[1]}</code>`).join('')+
      `Open it here: `+hits.map(h=>`<a href="#" onclick="Lab.open('${h.id}');return false" style="color:var(--accent)">${h.name}</a>`).join(' · ');
    return out;
  }
  if(fhits.length){
    return `Here is what you need:<br>`+fhits.map(f=>`<code>${f[2]}</code>${f[1]} — ${f[3]}`).join('<br>');
  }
  if(/plot|graph|gradient|slope/.test(ql))
    return `Plotting is how most of these experiments are checked. Record several readings on the simulation tab, then open the graph tab and choose the two quantities. The app fits a straight line and gives you the gradient, intercept and R², so you can compare the gradient with what the theory predicts. A good example is <b>T² against L</b> for a pendulum, where the gradient is 4π²/g.`;
  if(/how|use|start|begin|work/.test(ql))
    return `Every experiment has five tabs. <b>Theory</b> gives the aim, the physics and the procedure. <b>Simulation</b> is live — move the sliders and the readouts recompute from the real equations. <b>Record</b> captures the current readings into <b>Observations</b>. <b>Graph</b> plots any two recorded quantities with a best-fit line. <b>Viva</b> checks you understood it.`;
  return `I could not match that to a specific topic. Try naming the quantity or the experiment — for example "Snell's law", "half-life", "transformer", or "moment of inertia". There are ${EXPERIMENTS.length} experiments in the lab and the search box at the top will jump straight to any of them.`;
};

App.boot();
</script>
</body>
</html>
