const TH={
kinematics:{aim:'To study motion with constant acceleration and read velocity and displacement off graphs.',
 th:'A body with constant acceleration changes velocity at a steady rate. The displacement–time curve is a parabola whose slope at any instant is the velocity, and the velocity–time line is straight with slope equal to the acceleration. The area under the velocity–time graph gives displacement, which is why the two graphs always tell the same story in different ways.',
 f:[['v = u + at','velocity after time t'],['s = ut + ½at²','displacement after time t'],['v² = u² + 2as','velocity without time']],
 ap:['Motion track and trolley','Ticker timer or motion sensor','Metre rule','Stopwatch'],
 pr:['Set the initial velocity and acceleration.','Watch the trolley and both graphs together.','Record readings at several times.','Plot v against t and check the slope equals a.'],
 pc:['Take the time from a clear starting instant.','Keep signs consistent: deceleration is a negative a.']},
projectile:{aim:'To study two-dimensional motion under gravity and find how range depends on launch angle.',
 th:'A projectile is two independent motions happening at once: constant velocity horizontally and constant acceleration vertically. Splitting the launch velocity into components makes the whole path predictable. For a launch and landing at the same height the range is symmetric about 45°, and complementary angles give equal ranges.',
 f:[['R = v₀²sin2θ/g','horizontal range'],['H = v₀²sin²θ/2g','maximum height'],['T = 2v₀sinθ/g','time of flight']],
 ap:['Projectile launcher','Protractor','Metre scale','Carbon paper landing sheet'],
 pr:['Fix the launch speed.','Change the angle in steps of 5°.','Record the range each time.','Plot range against angle and locate the peak.'],
 pc:['Air resistance is ignored in this model.','Measure the angle from the horizontal, not the launcher body.']},
newton:{aim:'To verify Newton’s second law and study friction on a horizontal surface.',
 th:'Acceleration is produced by the net force, not the applied force. Friction opposes relative sliding and is proportional to the normal reaction, so on a flat surface the block only moves once the applied force exceeds μmg. Once moving, the surplus force divided by the mass gives the acceleration.',
 f:[['F − f = ma','Newton’s second law with friction'],['f = μN','friction force'],['N = mg','normal reaction on level ground']],
 ap:['Trolley and track','Spring balance or force sensor','Slotted masses','Friction surfaces'],
 pr:['Set a mass and increase the force until the block just moves.','Record force, friction and acceleration.','Repeat for several masses at the same force.','Plot a against 1/m.'],
 pc:['Pull horizontally, or the normal force changes.','Let the reading settle before recording.']},
incline:{aim:'To resolve forces on an inclined plane and find the coefficient of friction.',
 th:'On a slope the weight splits into a component along the surface, mg sinθ, and one pressing into it, mg cosθ. Sliding begins when mg sinθ first exceeds the maximum friction μmg cosθ, and at that instant μ = tanθ. That angle is called the angle of repose.',
 f:[['a = g(sinθ − μcosθ)','acceleration down the slope'],['N = mg cosθ','normal reaction'],['μ = tanθ','at the angle of repose']],
 ap:['Adjustable inclined plane','Wooden block','Protractor','Slotted masses'],
 pr:['Set μ and slowly raise the angle.','Note the angle at which sliding starts.','Compare tanθ with the set μ.','Repeat at other friction values.'],
 pc:['Raise the angle slowly, or the block is jolted loose.','The block must start from rest each time.']},
atwood:{aim:'To study connected masses over a pulley and measure g from a small acceleration.',
 th:'Two unequal masses joined over a pulley share one acceleration, set by the difference in weights divided by the total mass. Because the difference can be made small, the acceleration is far gentler than free fall and easy to time, which is exactly why Atwood built the machine.',
 f:[['a = (m₂ − m₁)g/(m₁ + m₂)','system acceleration'],['T = 2m₁m₂g/(m₁ + m₂)','string tension']],
 ap:['Low-friction pulley','Light inextensible string','Slotted masses','Timer'],
 pr:['Load both sides and release.','Time the fall through a fixed distance.','Change the mass difference and repeat.','Calculate g from the measured acceleration.'],
 pc:['Keep the string over the groove of the pulley.','Ignore string mass only if it is genuinely light.']},
energy:{aim:'To verify conservation of mechanical energy on a curved track.',
 th:'On a smooth track the sum of kinetic and potential energy stays constant: as the body descends, potential energy converts into kinetic energy and back again on the way up. Adding friction drains the total, and the mechanical energy lost turns into heat at the contact surfaces.',
 f:[['KE = ½mv²','kinetic energy'],['PE = mgh','gravitational potential energy'],['KE + PE = constant','when no friction acts']],
 ap:['Curved track','Steel ball','Photogate','Metre scale'],
 pr:['Release the ball from a set height.','Read KE and PE from the energy bars.','Check the total stays flat with no friction.','Add friction and watch the total fall.'],
 pc:['Release from rest each time.','Measure heights from the same reference level.']},
collision:{aim:'To verify conservation of momentum and classify collisions by restitution.',
 th:'In every collision the total momentum of an isolated system is unchanged, because the forces the bodies exert on each other are equal and opposite. Kinetic energy is a different matter: it survives only in a perfectly elastic collision. The coefficient of restitution measures how much relative speed remains after impact.',
 f:[['m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂','conservation of momentum'],['e = (v₂ − v₁)/(u₁ − u₂)','coefficient of restitution']],
 ap:['Air track or linear track','Two carts with bumpers','Photogates','Mass set'],
 pr:['Set the masses and approach speeds.','Record the velocities after impact.','Check the momentum totals match.','Repeat for e = 1 and e = 0.'],
 pc:['Keep the track level.','Read velocities immediately after impact.']},
circular:{aim:'To study circular motion and the centripetal force needed to maintain it.',
 th:'A body moving in a circle is accelerating even at constant speed, because its direction changes. That acceleration points to the centre and needs a real force behind it — here the string tension. Since the force grows as the square of angular speed, spinning faster quickly overwhelms the string.',
 f:[['a = ω²r = v²/r','centripetal acceleration'],['F = mω²r','centripetal force'],['T = 2π/ω','period']],
 ap:['Whirling tube and string','Rubber bung','Slotted masses','Stopwatch'],
 pr:['Set the radius and mass.','Increase angular speed and read the tension.','Note when the string breaking load is exceeded.','Plot tension against ω².'],
 pc:['Keep clear of the swinging mass.','Measure the radius to the centre of the bob.']},
rotation:{aim:'To study τ = Iα and compare moments of inertia of different bodies.',
 th:'Torque plays the role of force in rotation and moment of inertia plays the role of mass. Moment of inertia depends not just on how much mass there is but on how far that mass sits from the axis, which is why a ring resists far more than a solid sphere of the same mass and radius.',
 f:[['τ = Iα','rotational form of Newton’s second law'],['I = kMR²','k depends on the shape'],['L = Iω','angular momentum']],
 ap:['Rotating disc apparatus','Set of rings, discs and spheres','Hanging mass and pulley','Timer'],
 pr:['Choose a body and apply a known torque.','Record the angular acceleration.','Repeat for each shape.','Compare measured I with kMR².'],
 pc:['Keep the axle friction as low as possible.','Measure the radius to the rim, not the hub.']},
rolling:{aim:'To compare rolling bodies racing down an incline.',
 th:'A rolling body must supply both translational and rotational kinetic energy, so only part of the released potential energy goes into forward motion. The split depends purely on the shape factor k, which is why mass and radius cancel out and a solid sphere always beats a ring.',
 f:[['a = g sinθ/(1 + k)','acceleration while rolling'],['KE = ½mv²(1 + k)','total kinetic energy']],
 ap:['Inclined plane','Ring, disc and sphere of equal radius','Stopwatch','Metre scale'],
 pr:['Set the incline angle.','Release each body from the same point.','Time the descent.','Rank the bodies and compare with 1/(1 + k).'],
 pc:['Ensure the body rolls without slipping.','Release without any push.']},
torque:{aim:'To verify the principle of moments for a balanced beam.',
 th:'A rigid body is in equilibrium only when the forces balance and the turning effects balance too. Each load contributes a torque equal to its weight times its distance from the pivot, so a small mass far out can balance a large mass close in.',
 f:[['τ = F × d','moment of a force'],['Στ_clockwise = Στ_anticlockwise','condition for balance']],
 ap:['Metre rule and knife-edge pivot','Slotted masses and hangers','Balance stand'],
 pr:['Hang a known mass on one side.','Adjust the second mass or distance until balanced.','Record both moments.','Repeat and plot m₁ against 1/d₁.'],
 pc:['Pivot the rule at its own centre of gravity.','Read distances from the pivot, not the ends.']},
orbit:{aim:'To study orbital motion under gravity and test Kepler’s laws.',
 th:'Gravity provides exactly the centripetal force an orbit needs. A launch speed equal to the circular value gives a circle; anything less or more gives an ellipse, and √2 times the circular speed lets the body escape entirely. The period depends only on the semi-major axis, which is Kepler’s third law.',
 f:[['v = √(GM/r)','circular orbital speed'],['v_esc = √(2GM/r)','escape speed'],['T² ∝ a³','Kepler’s third law']],
 ap:['Orbit simulator','Stopwatch','Data logger'],
 pr:['Set the star mass and orbit radius.','Vary the launch speed factor.','Record period and eccentricity.','Plot T² against a³.'],
 pc:['Let the orbit complete before reading the period.','Watch for escape when the speed factor passes 1.41.']},
hooke:{aim:'To verify Hooke’s law and measure the spring constant.',
 th:'Within its elastic limit a spring stretches in direct proportion to the load. The constant of proportionality, k, is the stiffness of the spring, and the gradient of a load–extension graph gives it directly. The work done stretching the spring is stored as elastic potential energy.',
 f:[['F = kx','Hooke’s law'],['E = ½kx²','elastic potential energy'],['T = 2π√(m/k)','period if released']],
 ap:['Helical spring','Slotted masses','Metre scale','Pointer and stand'],
 pr:['Note the unloaded pointer position.','Add masses one at a time and record the extension.','Plot load against extension.','Take k from the gradient.'],
 pc:['Do not exceed the elastic limit.','Let oscillations die out before reading.']},
young:{aim:'To determine Young’s modulus of a wire from stress and strain.',
 th:'Stress is force per unit area and strain is the fractional change in length. Their ratio inside the elastic region is Young’s modulus, a property of the material and not of the sample size. Because area depends on the square of the diameter, a small measurement error there matters a great deal.',
 f:[['stress = F/A','force per unit area'],['strain = ΔL/L','fractional extension'],['Y = stress/strain','Young’s modulus']],
 ap:['Searle’s apparatus','Micrometer screw gauge','Slotted masses','Vernier scale'],
 pr:['Measure the wire diameter at several places.','Load the wire in steps and record extension.','Plot stress against strain.','Take Y from the straight-line gradient.'],
 pc:['Measure the diameter carefully — it is squared.','Unload and check the wire returns to its original length.']},
viscosity:{aim:'To determine the viscosity of a liquid by the falling-sphere method.',
 th:'A sphere falling through a liquid speeds up until viscous drag plus upthrust balance its weight, after which it falls at a steady terminal velocity. Stokes’ law links that velocity to the viscosity, and because it depends on the square of the radius, larger spheres fall far faster.',
 f:[['F = 6πηrv','Stokes’ drag'],['v_t = 2r²(ρ_s − ρ_l)g/9η','terminal velocity']],
 ap:['Tall glass cylinder','Steel spheres of known radius','Stopwatch','Viscous liquid'],
 pr:['Drop a sphere along the axis of the tube.','Time it between two marks well below the surface.','Repeat for several radii.','Calculate η from the terminal velocity.'],
 pc:['Start timing only once the sphere has reached steady speed.','Keep the liquid free of bubbles.']},
surfacetension:{aim:'To study capillary rise and determine surface tension.',
 th:'Molecules at a liquid surface are pulled inward, making the surface behave like a stretched skin. In a narrow tube this tension drags the liquid up until the weight of the raised column balances it. If the liquid does not wet the tube the contact angle exceeds 90° and the level is pushed down instead.',
 f:[['h = 2T cosθ/ρgr','capillary rise'],['ΔP = 2T/r','excess pressure in a drop']],
 ap:['Capillary tubes of different bore','Travelling microscope','Beaker of liquid','Thermometer'],
 pr:['Dip a clean capillary tube in the liquid.','Measure the rise with a travelling microscope.','Repeat for several tube radii.','Plot h against 1/r.'],
 pc:['The tube must be scrupulously clean.','Read the bottom of the meniscus consistently.']},
buoyancy:{aim:'To verify Archimedes’ principle and predict floating or sinking.',
 th:'Any body in a fluid feels an upward force equal to the weight of the fluid it displaces. If the body is denser than the fluid it cannot displace enough to support itself and sinks; if it is less dense, it settles with just enough of itself below the surface for the upthrust to match its weight.',
 f:[['F_b = ρ_fluid V_displaced g','upthrust'],['submerged fraction = ρ_object/ρ_fluid','for a floating body']],
 ap:['Spring balance','Overflow can and measuring cylinder','Test blocks','Liquids of different density'],
 pr:['Weigh the object in air.','Lower it into the liquid and record the apparent weight.','Collect and weigh the displaced liquid.','Compare the loss in weight with the upthrust.'],
 pc:['The object must be fully submerged for the check.','Avoid the object touching the container walls.']},
hydraulic:{aim:'To verify Pascal’s law and study force multiplication in a hydraulic lift.',
 th:'Pressure applied to an enclosed fluid is transmitted undiminished everywhere. Because pressure is force per unit area, the same pressure produces a far larger force on a larger piston. Work is not multiplied, though: the large piston moves through a proportionally smaller distance.',
 f:[['P = F/A','pressure'],['F₂ = F₁A₂/A₁','force multiplication'],['F₁d₁ = F₂d₂','work is conserved']],
 ap:['Hydraulic press model','Two syringes of different bore','Connecting tube','Slotted masses'],
 pr:['Apply a known force to the small piston.','Measure the force lifted on the large piston.','Record both piston movements.','Compare the work done at each end.'],
 pc:['Keep the system free of air bubbles.','Measure the piston diameters accurately.']},
bernoulli:{aim:'To study the relation between flow speed and pressure in a venturi tube.',
 th:'A fluid squeezing through a narrower section must speed up to carry the same flow rate. Bernoulli’s equation says that the extra kinetic energy has to come from somewhere, and it comes from the pressure — which is why the throat of a venturi reads lowest.',
 f:[['A₁v₁ = A₂v₂','equation of continuity'],['P + ½ρv² + ρgh = constant','Bernoulli’s equation']],
 ap:['Venturi tube','Manometer tubes','Water supply','Flow meter'],
 pr:['Set a steady flow rate.','Read the pressure at the wide section and at the throat.','Change the throat diameter and repeat.','Compare the pressure drop with ½ρ(v₂² − v₁²).'],
 pc:['Wait for the manometer levels to settle.','Keep the tube horizontal so height terms cancel.']},
torricelli:{aim:'To verify Torricelli’s law for the speed of liquid leaving a tank.',
 th:'Liquid leaving a small hole behaves like a body that has fallen freely through the depth above the hole, so its speed depends only on that depth. The jet then follows a projectile path, and the horizontal range is greatest when the hole sits halfway up the liquid column.',
 f:[['v = √(2gh)','efflux speed'],['Q = Av','volume flow rate'],['R = 2√(h(H − h))','range of the jet']],
 ap:['Tall tank with side holes','Metre scale','Measuring cylinder','Stopwatch'],
 pr:['Fill the tank to a marked level.','Open one hole and measure the jet range.','Repeat for holes at different heights.','Plot range against hole height.'],
 pc:['Keep the water level topped up during a reading.','Measure depth from the free surface to the hole.']},
gaslaw:{aim:'To verify the gas laws and combine them into PV = nRT.',
 th:'Each classical gas law holds one quantity fixed. Boyle found pressure inversely proportional to volume at constant temperature, Charles found volume proportional to absolute temperature at constant pressure, and Gay-Lussac found pressure proportional to temperature at constant volume. Together they give the ideal gas equation.',
 f:[['PV = constant','Boyle’s law'],['V/T = constant','Charles’ law'],['PV = nRT','ideal gas equation']],
 ap:['Gas syringe or Boyle’s law apparatus','Pressure gauge','Water bath and thermometer','Clamp stand'],
 pr:['Choose the law to test.','Vary only the free quantity in steps.','Record the pair of readings each time.','Plot the pair and confirm a straight line.'],
 pc:['Allow the gas to reach thermal equilibrium.','Always use absolute temperature in kelvin.']},
kinetic:{aim:'To relate temperature to molecular motion using kinetic theory.',
 th:'Gas pressure comes from countless molecular impacts on the walls. Temperature measures the average kinetic energy of those molecules, so heating a gas simply speeds its molecules up. The speeds are spread out in the Maxwell distribution, which broadens and shifts right as temperature rises.',
 f:[['PV = ⅓Nmv̄²','kinetic theory of pressure'],['½mv̄² = (3/2)kT','average kinetic energy'],['v_rms = √(3RT/M)','root-mean-square speed']],
 ap:['Kinetic theory model','Brownian motion cell and microscope','Smoke cell','Light source'],
 pr:['Set the temperature and molar mass.','Observe the particle speeds and distribution.','Record v_rms at several temperatures.','Plot v_rms² against T.'],
 pc:['Lighter gases move faster at the same temperature.','Use kelvin, never celsius.']},
heattransfer:{aim:'To study conduction through a rod and compare thermal conductivities.',
 th:'Heat flows down a temperature gradient at a rate set by the material, the cross-section and the length. Metals conduct hundreds of times better than glass or wood because free electrons carry energy through them, which is why a metal spoon in hot tea heats up so quickly.',
 f:[['Q/t = kAΔT/L','rate of heat conduction'],['R = L/kA','thermal resistance']],
 ap:['Searle’s bar apparatus','Steam chamber and ice box','Thermometers','Rods of different metals'],
 pr:['Set the two end temperatures.','Record the steady heat current.','Change the rod material and repeat.','Compare the measured conductivities.'],
 pc:['Wait for the steady state before recording.','Lag the rod to reduce side losses.']},
cooling:{aim:'To verify Newton’s law of cooling.',
 th:'A hot body loses heat at a rate proportional to how much hotter it is than its surroundings, so its excess temperature decays exponentially. Plotting the logarithm of the excess against time straightens the curve and lets you read the cooling constant off the slope.',
 f:[['dT/dt = −k(T − T_s)','Newton’s law of cooling'],['T = T_s + (T₀ − T_s)e^(−kt)','solution']],
 ap:['Calorimeter and hot liquid','Thermometer','Stopwatch','Draught screen'],
 pr:['Heat the liquid and start the clock.','Record temperature every half minute.','Plot ln(T − T_room) against t.','Take k from the slope.'],
 pc:['Keep the room temperature steady.','Stir gently so the temperature is uniform.']},
expansion:{aim:'To measure the coefficient of linear expansion of a solid.',
 th:'Heating a solid increases the average separation of its atoms, so the sample grows in proportion to its original length and to the temperature rise. The coefficient is tiny, so precise instruments are needed — and materials like invar are chosen when expansion must be avoided.',
 f:[['ΔL = αL₀ΔT','linear expansion'],['ΔA = 2αA₀ΔT','area expansion'],['ΔV = 3αV₀ΔT','volume expansion']],
 ap:['Expansion apparatus','Steam generator','Micrometer or dial gauge','Thermometer'],
 pr:['Measure the rod at room temperature.','Heat it with steam and record the new temperature.','Measure the extension.','Calculate α and compare with the accepted value.'],
 pc:['Allow the rod to reach a steady temperature.','Guard against the rod sagging under its own weight.']},
calorimetry:{aim:'To find the final temperature of a mixture using the principle of calorimetry.',
 th:'When two bodies at different temperatures are mixed, heat flows from hot to cold until they reach a common temperature. If no heat escapes, the heat lost by one equals the heat gained by the other, and the balance point depends on both masses and both specific heat capacities.',
 f:[['Q = mcΔT','heat exchanged'],['m₁c₁(T₁ − T_f) = m₂c₂(T_f − T₂)','calorimetry balance']],
 ap:['Copper calorimeter and stirrer','Thermometer','Balance','Heating source'],
 pr:['Record the mass and temperature of each body.','Mix them and stir gently.','Record the steady final temperature.','Compare with the calculated value.'],
 pc:['Lag the calorimeter to reduce losses.','Allow for the heat capacity of the calorimeter itself.']},
carnot:{aim:'To study the Carnot cycle and the limits on engine efficiency.',
 th:'A Carnot engine takes heat from a hot reservoir, converts part of it to work and dumps the rest into a cold one. Its efficiency depends only on the two absolute temperatures, and no real engine working between the same two can do better. Run backwards, the same cycle becomes a refrigerator or a heat pump.',
 f:[['η = 1 − T_C/T_H','Carnot efficiency'],['COP_ref = T_C/(T_H − T_C)','refrigerator performance'],['COP_hp = T_H/(T_H − T_C)','heat pump performance']],
 ap:['Heat engine model','Two heat reservoirs','Thermometers','P–V recorder'],
 pr:['Set the reservoir temperatures.','Read the work and waste heat per cycle.','Vary the cold temperature and repeat.','Plot efficiency against T_C/T_H.'],
 pc:['Always use kelvin.','Real engines fall well short of the Carnot value.']},
shm:{aim:'To study simple harmonic motion of a mass on a spring.',
 th:'When the restoring force is proportional to the displacement and points back toward equilibrium, the motion is simple harmonic. Displacement and velocity are sinusoidal and a quarter cycle out of step, and the period depends only on the mass and the stiffness — not on how far you pull it.',
 f:[['F = −kx','restoring force'],['T = 2π√(m/k)','period'],['v_max = Aω','maximum speed']],
 ap:['Helical spring and masses','Stopwatch','Metre scale','Motion sensor'],
 pr:['Displace the mass and release it.','Time twenty oscillations and find T.','Repeat for several masses.','Plot T² against m.'],
 pc:['Keep the amplitude small so the motion stays harmonic.','Time many oscillations to reduce reaction-time error.']},
pendulum:{aim:'To find the acceleration due to gravity using a simple pendulum.',
 th:'For small angles the restoring torque on a pendulum bob is proportional to its displacement, so the motion is simple harmonic with a period that depends only on length and gravity. Plotting T² against length gives a straight line whose gradient leads directly to g.',
 f:[['T = 2π√(L/g)','period of a simple pendulum'],['g = 4π²L/T²','gravity from the graph']],
 ap:['Pendulum bob and thread','Split cork and clamp stand','Stopwatch','Metre scale'],
 pr:['Set a length and displace by less than 10°.','Time twenty complete oscillations.','Repeat for several lengths.','Plot T² against L and find g from the slope.'],
 pc:['Keep the amplitude small.','Measure length to the centre of the bob.']},
damped:{aim:'To study damped oscillations and the three damping regimes.',
 th:'Adding a resistive force proportional to velocity drains energy from an oscillator. Light damping leaves the oscillation intact inside a decaying envelope; critical damping returns the system to rest in the shortest possible time; heavier damping is slower still and never overshoots.',
 f:[['mẍ + bẋ + kx = 0','equation of damped motion'],['b_crit = 2√(mk)','critical damping'],['Q = ω₀m/b','quality factor']],
 ap:['Spring–mass system','Damping vane in oil','Motion sensor','Timer'],
 pr:['Displace and release the mass.','Record the decay of successive amplitudes.','Increase the damping and repeat.','Identify the critical damping value.'],
 pc:['Keep the vane fully immersed.','Release without a sideways push.']},
wave:{aim:'To study travelling waves and verify v = fλ.',
 th:'A wave carries energy without carrying matter: each particle simply oscillates about its own position. In a transverse wave the oscillation is across the direction of travel, in a longitudinal wave it is along it. Frequency is fixed by the source and the medium decides the speed, so the wavelength follows.',
 f:[['v = fλ','wave equation'],['T = 1/f','period'],['k = 2π/λ','wave number']],
 ap:['Ripple tank or long spring','Vibration generator','Stroboscope','Metre scale'],
 pr:['Set the frequency and observe the wave.','Measure the wavelength on the screen.','Calculate the speed.','Repeat for several frequencies.'],
 pc:['Measure over several wavelengths and divide.','Keep the amplitude modest so the wave stays linear.']},
superposition:{aim:'To study the superposition of two waves.',
 th:'When two waves meet, the displacements simply add at every point. Waves in step reinforce and waves in antiphase cancel, and everything between gives a partial result. Two identical waves travelling in opposite directions produce a standing wave.',
 f:[['y = y₁ + y₂','principle of superposition'],['A = √(A₁² + A₂² + 2A₁A₂cosφ)','resultant amplitude']],
 ap:['Two signal generators','Twin loudspeakers','Oscilloscope','Microphone'],
 pr:['Set both amplitudes and wavelengths.','Sweep the phase difference.','Record the resultant amplitude.','Plot amplitude against phase.'],
 pc:['Match the amplitudes for full cancellation.','Keep both sources coherent.']},
standing:{aim:'To study standing waves on a stretched string and its harmonics.',
 th:'A wave reflected at a fixed end interferes with the incoming wave, and only wavelengths that fit the length survive. The result is a pattern of fixed nodes and vigorously moving antinodes. Each allowed pattern is a harmonic, and its frequency is a whole-number multiple of the fundamental.',
 f:[['λ_n = 2L/n','allowed wavelengths'],['f_n = nv/2L','harmonic frequencies'],['v = √(T/µ)','speed on the string']],
 ap:['Vibration generator','Stretched string and pulley','Slotted masses','Metre scale'],
 pr:['Set the tension and length.','Raise the frequency until a clear pattern forms.','Record the harmonic number and frequency.','Plot f against n.'],
 pc:['Look for the sharpest, steadiest pattern.','Count nodes carefully, including the ends.']},
sonometer:{aim:'To study how the frequency of a stretched wire depends on length and tension.',
 th:'A sonometer isolates one vibrating length of wire between two bridges. Frequency falls as the length grows and rises with the square root of the tension, so both relationships can be tested separately by keeping the other variable fixed.',
 f:[['f = (1/2L)√(T/µ)','fundamental frequency'],['f ∝ 1/L','at constant tension'],['f ∝ √T','at constant length']],
 ap:['Sonometer with bridges','Tuning forks','Slotted masses','Paper rider'],
 pr:['Set the tension with hanging masses.','Adjust the bridges until the paper rider jumps.','Record the resonating length.','Plot f against 1/L.'],
 pc:['Use a light paper rider to spot resonance.','Keep the wire free of kinks.']},
doppler:{aim:'To study the Doppler effect for sound.',
 th:'When a source moves, the waves ahead of it are compressed and the waves behind are stretched, so an observer hears a higher pitch on approach and a lower one on recession. The shift depends on the speeds involved compared with the speed of sound.',
 f:[["f' = f(v + v_o)/(v − v_s)",'observed frequency'],['v = 331.3 + 0.606T','speed of sound in air']],
 ap:['Moving sound source','Frequency meter','Trolley and track','Microphone'],
 pr:['Set the source speed and frequency.','Record the observed frequency on approach.','Repeat with the source receding.','Plot the shift against source speed.'],
 pc:['Keep the observer on the line of motion.','Watch for reflections from nearby walls.']},
beats:{aim:'To study beats produced by two close frequencies.',
 th:'Two notes of nearly equal frequency drift in and out of step, producing a slow rise and fall in loudness. The number of loudness peaks per second equals the difference between the two frequencies, which makes beats a precise way of matching one source to another.',
 f:[['f_beat = |f₁ − f₂|','beat frequency'],['T_beat = 1/f_beat','beat period']],
 ap:['Two tuning forks','Loading wax','Stopwatch','Microphone and oscilloscope'],
 pr:['Sound both sources together.','Count the beats in ten seconds.','Change one frequency slightly.','Plot beat frequency against the difference.'],
 pc:['Use forks of nearly equal frequency.','Count over a long interval for accuracy.']},
resonancetube:{aim:'To determine the speed of sound in air by the resonance-tube method.',
 th:'An air column resonates when its length matches a quarter wavelength (closed pipe) or a half wavelength (open pipe) of the driving fork. Successive resonance lengths differ by exactly half a wavelength, so measuring two of them removes the end correction entirely.',
 f:[['v = 4Lf','first resonance, closed pipe'],['v = 2f(L₂ − L₁)','removing the end correction'],['v = 331.3 + 0.606T','expected value']],
 ap:['Resonance tube and reservoir','Tuning forks of known frequency','Metre scale','Thermometer'],
 pr:['Sound the fork over the tube.','Lower the water until the sound is loudest.','Record both resonance lengths.','Calculate v and compare with the temperature formula.'],
 pc:['Keep the fork just above the tube mouth.','Record the air temperature — it changes v.']},
coulomb:{aim:'To study the force between point charges.',
 th:'Two charges attract or repel with a force proportional to the product of the charges and inversely proportional to the square of the distance. The medium matters too: immersing the charges in a material of higher permittivity, such as water, cuts the force dramatically.',
 f:[['F = kq₁q₂/r²','Coulomb’s law'],['k = 1/4πε₀ = 9 × 10⁹','constant in vacuum']],
 ap:['Torsion balance','Charged pith balls','Insulating stand','Metre scale'],
 pr:['Charge both spheres.','Set a separation and record the force.','Halve the separation and repeat.','Plot F against 1/r².'],
 pc:['Keep the apparatus dry — humidity leaks charge.','Handle the insulating rods only by their ends.']},
efield:{aim:'To map the electric field and equipotentials around charges.',
 th:'Field lines start on positive charge and end on negative charge, and their crowding shows where the field is strong. Equipotential surfaces link points at the same potential and always cross field lines at right angles, because no work is done moving along them.',
 f:[['E = F/q','electric field strength'],['E = kq/r²','field of a point charge'],['V = kq/r','potential of a point charge']],
 ap:['Conducting paper and electrodes','Low-voltage supply','Digital voltmeter','Probe'],
 pr:['Set the two charges and separation.','Trace the field lines on screen.','Switch to equipotentials and compare.','Check that they intersect at right angles.'],
 pc:['Field lines never cross one another.','Potential is a scalar; field is a vector.']},
capacitor:{aim:'To study the factors that determine capacitance.',
 th:'A parallel-plate capacitor stores charge in proportion to the voltage applied. Capacitance grows with plate area and with the dielectric constant of the insulator between the plates, and falls as the plates are pulled apart. The stored energy is the work done separating the charge.',
 f:[['C = ε₀ε_r A/d','parallel-plate capacitance'],['Q = CV','charge stored'],['E = ½CV²','energy stored']],
 ap:['Parallel-plate capacitor','Dielectric slabs','Electrometer','DC supply'],
 pr:['Set the area and separation.','Record the capacitance.','Insert a dielectric and repeat.','Plot C against 1/d.'],
 pc:['Discharge the capacitor before handling it.','Keep the plates parallel.']},
ohm:{aim:'To verify Ohm’s law and find an unknown resistance.',
 th:'For a metallic conductor at constant temperature, the current through it is proportional to the potential difference across it. Plotting current against voltage gives a straight line through the origin whose gradient is the conductance, so resistance is simply the reciprocal.',
 f:[['V = IR','Ohm’s law'],['P = VI = I²R','electrical power'],['E = Pt','electrical energy']],
 ap:['Battery and rheostat','Ammeter and voltmeter','Resistance coil','Connecting leads'],
 pr:['Connect the ammeter in series and voltmeter in parallel.','Vary the supply and record V and I.','Plot I against V.','Take the resistance from the gradient.'],
 pc:['Keep the current low so the coil does not heat up.','Check the meter zero before starting.']},
seriesparallel:{aim:'To study resistors combined in series and in parallel.',
 th:'Resistors in series carry the same current and share the voltage, so their resistances add. In parallel they share the same voltage and split the current, so it is the conductances that add — and the combination is always smaller than the smallest resistor.',
 f:[['R = R₁ + R₂ + R₃','series combination'],['1/R = 1/R₁ + 1/R₂ + 1/R₃','parallel combination']],
 ap:['Resistance box','Battery and switch','Ammeter and voltmeter','Connecting leads'],
 pr:['Connect the resistors in series and measure the total.','Repeat in parallel.','Compare with the calculated values.','Try a mixed network.'],
 pc:['Check every joint — loose leads add resistance.','Switch off between rearrangements.']},
kirchhoff:{aim:'To verify Kirchhoff’s current and voltage laws in a two-loop network.',
 th:'Kirchhoff’s current law is conservation of charge at a junction, and his voltage law is conservation of energy around a loop. Together they let any network be solved, however tangled, by writing one equation per independent loop and solving them simultaneously.',
 f:[['ΣI_in = ΣI_out','junction rule'],['ΣΔV = 0','loop rule']],
 ap:['Two cells of known EMF','Three resistors','Milliammeters','Connecting leads'],
 pr:['Build the two-loop network.','Measure the current in each branch.','Check the junction sums to zero.','Compare with the calculated loop currents.'],
 pc:['Keep a consistent sign convention around each loop.','Note the polarity of each cell.']},
rc:{aim:'To study charging and discharging of a capacitor through a resistor.',
 th:'The capacitor voltage approaches the supply exponentially, gaining about 63% of its final value in one time constant and settling after roughly five. Discharge is the mirror image. Since τ = RC, either component can be found if the other is known.',
 f:[['V = V₀(1 − e^(−t/RC))','charging'],['V = V₀e^(−t/RC)','discharging'],['τ = RC','time constant']],
 ap:['Electrolytic capacitor','High-value resistor','Stopwatch and voltmeter','DC supply'],
 pr:['Charge through the resistor and record V every few seconds.','Plot V against t.','Find the time to reach 63% of the supply.','Compare with the calculated RC.'],
 pc:['Observe capacitor polarity.','Discharge fully before each run.']},
wheatstone:{aim:'To measure an unknown resistance with a Wheatstone bridge.',
 th:'The bridge is balanced when the two potential dividers reach the same potential, so no current crosses the galvanometer. At that point the ratio of resistances in one arm equals the ratio in the other, and because it is a null method the result does not depend on the sensitivity of the meter.',
 f:[['P/Q = S/X','balance condition'],['X = SQ/P','unknown resistance']],
 ap:['Metre bridge or bridge box','Galvanometer','Resistance box','Jockey and cell'],
 pr:['Connect the unknown in the fourth arm.','Adjust the known resistance for zero deflection.','Record the balance ratio.','Calculate X and repeat with the arms interchanged.'],
 pc:['Tap the jockey, do not drag it.','Keep the current brief to avoid heating.']},
potentiometer:{aim:'To compare EMFs and measure internal resistance with a potentiometer.',
 th:'A steady current down a uniform wire creates a constant potential gradient along it. At the balance point the cell under test draws no current, so the wire reads its true EMF rather than a terminal voltage reduced by internal resistance.',
 f:[['k = E_driver/L','potential gradient'],['E = k·l','EMF from balance length'],['r = R(l₁ − l₂)/l₂','internal resistance']],
 ap:['Potentiometer wire and driver cell','Galvanometer and jockey','Cells under test','Resistance box'],
 pr:['Set up a steady driver current.','Find the null point for the test cell.','Record the balance length.','Repeat with a load to find internal resistance.'],
 pc:['The driver EMF must exceed the test EMF.','Keep the jockey contact light and brief.']},
magfield:{aim:'To map the magnetic field around currents and magnets.',
 th:'A current produces circular field lines around a wire, and the right-hand grip rule gives their direction. Coils concentrate the field along their axis, and a bar magnet produces a dipole field that leaves the north pole and re-enters at the south. Field strength always falls off with distance.',
 f:[['B = µ₀I/2πr','field near a long straight wire'],['B = µ₀NI/2R','field at the centre of a coil']],
 ap:['Current-carrying conductor','Plotting compass','Iron filings and card','Ammeter'],
 pr:['Pass a known current through the conductor.','Plot the field with a compass at several distances.','Repeat for a coil and a bar magnet.','Plot B against 1/r.'],
 pc:['Keep other magnets and iron well away.','Switch the current off between readings to avoid heating.']},
solenoid:{aim:'To study the magnetic field inside a solenoid and the effect of a core.',
 th:'A long solenoid produces a nearly uniform field inside and almost none outside. The field depends on the turns per metre and the current, but not on the coil diameter. Inserting a ferromagnetic core raises the field by a factor of the relative permeability, which can run into the thousands.',
 f:[['B = µ₀nI','field inside a long solenoid'],['B = µ₀µ_r nI','with a magnetic core'],['Φ = BA','magnetic flux']],
 ap:['Long solenoid','Hall probe or search coil','Iron and ferrite cores','Ammeter'],
 pr:['Pass a measured current through the solenoid.','Record the field on the axis.','Insert a core and repeat.','Plot B against I.'],
 pc:['Measure at the centre, away from the ends.','Let the coil cool between runs.']},
lorentz:{aim:'To study the force on charges and currents in a magnetic field.',
 th:'A charge moving across a magnetic field feels a force perpendicular to both its velocity and the field, so it moves in a circle of radius mv/qB. Because the force is always perpendicular to motion it does no work and the speed never changes. The same effect on many charges in a wire gives F = BIL.',
 f:[['F = qvB sinθ','force on a moving charge'],['r = mv/qB','radius of the circular path'],['F = BIL sinθ','force on a current-carrying conductor']],
 ap:['Fine beam tube','Helmholtz coils','High-voltage supply','Gaussmeter'],
 pr:['Accelerate electrons through a known voltage.','Apply the magnetic field and measure the beam radius.','Vary B and repeat.','Plot r against 1/B.'],
 pc:['Observe high-voltage safety rules.','Keep the field perpendicular to the beam.']},
induction:{aim:'To verify Faraday’s and Lenz’s laws of electromagnetic induction.',
 th:'An EMF appears in a circuit whenever the magnetic flux through it changes — the faster the change, the larger the EMF. The induced current always flows in the direction that opposes the change producing it, which is Lenz’s law and simply conservation of energy in disguise.',
 f:[['ε = −N dΦ/dt','Faraday’s law with Lenz’s sign'],['Φ = BA cosθ','magnetic flux'],['ε = NBAω sinωt','rotating coil']],
 ap:['Coil of many turns','Bar magnet','Centre-zero galvanometer','Copper disc and magnet'],
 pr:['Move the magnet into the coil and note the deflection.','Reverse the motion and observe the reversal.','Increase the speed and compare.','Try more turns and a stronger magnet.'],
 pc:['The galvanometer must be centre-zero.','Nothing is induced while the magnet is held still.']},
motorgen:{aim:'To study the electric motor and generator as one machine.',
 th:'A current-carrying coil in a magnetic field experiences a torque, which is the motor effect. Turn the same coil mechanically and the changing flux induces an EMF instead. The two are inverse processes, and every motor generates a back EMF while it runs.',
 f:[['τ = NBIA sinθ','torque on a coil'],['ε = NBAω sinωt','generated EMF'],['P = τω','mechanical power']],
 ap:['Demonstration motor/generator','Permanent magnets','DC and AC supplies','Oscilloscope'],
 pr:['Feed current in and measure the torque.','Reverse the roles and spin the coil.','Record the EMF produced.','Compare peak values with NBAω.'],
 pc:['Check the commutator contacts are clean.','Do not stall the motor under load.']},
transformer:{aim:'To study voltage and current transformation with turns ratio.',
 th:'An alternating current in the primary creates a changing flux in the core, which induces an EMF in the secondary. Voltage transforms in the ratio of the turns and current in the inverse ratio, so power is roughly conserved — the shortfall is the core and copper losses.',
 f:[['V_s/V_p = N_s/N_p','turns ratio'],['I_p/I_s = N_s/N_p','current ratio'],['η = P_out/P_in','efficiency']],
 ap:['Demountable transformer core','Primary and secondary coils','AC supply','Meters'],
 pr:['Fit coils of known turns.','Measure the secondary voltage on no load.','Add a load and record both currents.','Calculate the efficiency.'],
 pc:['Transformers work on AC only.','Do not short the secondary.']},
ac:{aim:'To study AC quantities and the series LCR circuit.',
 th:'In AC circuits a resistor keeps current and voltage in step, an inductor makes current lag and a capacitor makes it lead. Their combined opposition is impedance, and at the frequency where the two reactances cancel the circuit resonates, drawing its maximum current.',
 f:[['X_L = 2πfL','inductive reactance'],['X_C = 1/2πfC','capacitive reactance'],['Z = √(R² + (X_L − X_C)²)','impedance'],['f₀ = 1/2π√(LC)','resonant frequency']],
 ap:['Signal generator','Inductor, capacitor and resistor','Oscilloscope','AC ammeter'],
 pr:['Set a frequency and record current and phase.','Sweep the frequency through resonance.','Plot current against frequency.','Read f₀ from the peak.'],
 pc:['RMS values are what meters read, not peaks.','Beware of high voltages across L and C at resonance.']},
rectifier:{aim:'To study half-wave and full-wave rectification with smoothing.',
 th:'A diode conducts in one direction only, so it converts alternating current into a pulsing one-way current. A bridge of four diodes uses both halves of the cycle, and a capacitor across the load holds the voltage up between peaks, leaving only a small ripple.',
 f:[['V_dc = V_m/π','half-wave average'],['V_dc = 2V_m/π','full-wave average'],['r = V_ripple/V_dc','ripple factor']],
 ap:['Step-down transformer','Silicon diodes','Electrolytic capacitor','Oscilloscope'],
 pr:['Build the half-wave circuit and sketch the output.','Rebuild as a bridge and compare.','Add the smoothing capacitor.','Record ripple against capacitance.'],
 pc:['Watch the diode and capacitor polarity.','Never connect the mains directly.']},
reflection:{aim:'To verify the laws of reflection at a plane mirror.',
 th:'A ray striking a mirror leaves at the same angle on the other side of the normal, with the incident ray, the reflected ray and the normal all in one plane. The image formed is virtual, laterally inverted and the same distance behind the mirror as the object is in front.',
 f:[['i = r','law of reflection'],['number of images = 360/θ − 1','for two inclined mirrors']],
 ap:['Plane mirror and stand','Optical pins','Protractor and drawing board','Ray box'],
 pr:['Direct a ray at a marked point on the mirror.','Mark the incident and reflected rays.','Measure both angles from the normal.','Repeat for several angles.'],
 pc:['Measure angles from the normal, not the surface.','Use the silvered back surface as the mirror line.']},
refraction:{aim:'To verify Snell’s law and find the critical angle.',
 th:'Light changes speed when it enters a new medium, and unless it arrives along the normal it changes direction too. The ratio of the sines of the angles is constant and equals the ratio of refractive indices. Going from dense to rare there is an angle beyond which refraction is impossible and all the light reflects back.',
 f:[['n₁sin i = n₂sin r','Snell’s law'],['n = c/v','refractive index'],['sin C = n₂/n₁','critical angle']],
 ap:['Rectangular glass slab','Optical pins','Protractor','Drawing board'],
 pr:['Trace a ray entering the slab.','Mark the refracted ray and measure both angles.','Repeat for several angles of incidence.','Plot sin i against sin r.'],
 pc:['Keep pins upright and well separated.','Mark the slab outline before moving it.']},
lens:{aim:'To find the focal length of a lens and verify the lens formula.',
 th:'A converging lens brings parallel rays to a real focus, and the image position follows from the lens equation. A diverging lens spreads them, always forming a small upright virtual image. Plotting 1/v against 1/u gives a straight line whose intercepts both equal 1/f.',
 f:[['1/v − 1/u = 1/f','lens formula'],['m = v/u','magnification'],['P = 1/f','power in dioptres']],
 ap:['Convex and concave lenses','Optical bench','Illuminated object and screen','Metre scale'],
 pr:['Place the object at a measured distance.','Move the screen until the image is sharp.','Record u and v for several positions.','Plot 1/v against 1/u.'],
 pc:['Keep the lens, object and screen at the same height.','Focus by approaching the sharp point from both sides.']},
mirror:{aim:'To find the focal length of a spherical mirror and verify the mirror formula.',
 th:'A concave mirror converges light and can form real or virtual images depending on where the object sits. A convex mirror always diverges light, giving a diminished upright virtual image with a wide field of view. The focal length is half the radius of curvature.',
 f:[['1/v + 1/u = 1/f','mirror formula'],['f = R/2','focal length and curvature'],['m = −v/u','magnification']],
 ap:['Concave and convex mirrors','Optical bench','Illuminated object and screen','Metre scale'],
 pr:['Find the rough focal length on a distant object.','Set the object at several distances.','Record u and v for each sharp image.','Plot and compare with the formula.'],
 pc:['Use the sign convention consistently.','A convex mirror never forms a real image on a screen.']},
prism:{aim:'To study dispersion and find the refractive index at minimum deviation.',
 th:'A prism refracts light twice, and the total deviation passes through a minimum when the ray inside travels parallel to the base. Because refractive index varies slightly with wavelength, violet is bent most and red least, so white light emerges as a spectrum.',
 f:[['D = i₁ + i₂ − A','deviation'],['n = sin((A + D_m)/2)/sin(A/2)','index from minimum deviation'],['ω = (n_v − n_r)/(n_y − 1)','dispersive power']],
 ap:['Glass prism','Spectrometer or ray box','Protractor','White light source'],
 pr:['Set the prism and trace the emerging ray.','Rotate to find the minimum deviation.','Record A and D_m.','Calculate n for each colour.'],
 pc:['Look for the turning point of the emergent ray.','Keep the prism faces clean.']},
ydse:{aim:'To measure the wavelength of light using Young’s double-slit experiment.',
 th:'Two coherent slits produce overlapping waves that reinforce where their path difference is a whole number of wavelengths and cancel where it is an odd number of half wavelengths. The result is a set of evenly spaced fringes whose spacing gives the wavelength directly.',
 f:[['β = λD/d','fringe width'],['path difference = dsinθ','condition for fringes'],['dsinθ = nλ','bright fringes']],
 ap:['Double slit and laser','Metre scale and screen','Travelling microscope','Optical bench'],
 pr:['Set the slit separation and screen distance.','Measure the width of ten fringes and divide.','Repeat at a different screen distance.','Calculate λ from the gradient.'],
 pc:['Never look into the laser beam.','Measure across many fringes to reduce error.']},
diffraction:{aim:'To study single-slit diffraction and measure the slit width.',
 th:'Light passing a narrow slit spreads out because waves from different parts of the slit interfere. The central maximum is twice as wide as the others and grows as the slit narrows, so the pattern gives a direct measurement of a slit too small to see.',
 f:[['a sinθ = nλ','minima of single-slit diffraction'],['width = 2λD/a','central maximum']],
 ap:['Adjustable single slit','Laser source','Screen and scale','Optical bench'],
 pr:['Pass the beam through the slit.','Measure the central maximum width.','Narrow the slit and repeat.','Plot width against 1/a.'],
 pc:['Work in a darkened room.','Keep the screen perpendicular to the beam.']},
polarization:{aim:'To verify Malus’ law using two polarising filters.',
 th:'Unpolarised light contains vibrations in every direction, and a polariser passes only one of them, halving the intensity. A second filter then passes a fraction cos²θ of what is left, so rotating it from aligned to crossed takes the beam from full brightness to darkness.',
 f:[['I = I₀cos²θ','Malus’ law'],['I₁ = I₀/2','after the first polariser']],
 ap:['Two polaroid filters','Light source and photodiode','Rotating mount with scale','Lux meter'],
 pr:['Align both filters and record the intensity.','Rotate the analyser in 10° steps.','Record the intensity each time.','Plot I against cos²θ.'],
 pc:['Keep stray light out of the detector.','Read the angle from the reference mark.']},
photoelectric:{aim:'To study the photoelectric effect and find the work function.',
 th:'Light ejects electrons from a metal only if each photon carries more energy than the work function, no matter how bright the beam. Above that threshold the maximum kinetic energy rises linearly with frequency, and the intensity controls only how many electrons appear.',
 f:[['hf = φ + KE_max','Einstein’s photoelectric equation'],['eV₀ = KE_max','stopping potential'],['f₀ = φ/h','threshold frequency']],
 ap:['Photocell and monochromatic filters','Variable voltage supply','Microammeter','Light source'],
 pr:['Illuminate the cathode with a chosen wavelength.','Increase the reverse voltage until the current stops.','Record the stopping potential.','Plot V₀ against frequency and find h and φ.'],
 pc:['Shield the photocell from stray light.','Below the threshold nothing happens, however bright the source.']},
bohr:{aim:'To study the Bohr model and the spectral series of hydrogen.',
 th:'Electrons occupy only certain allowed orbits, each with a definite energy. A photon is emitted when an electron drops to a lower level and absorbed when it climbs, with energy exactly equal to the gap. Transitions ending on n = 2 make the visible Balmer series.',
 f:[['E_n = −13.6Z²/n² eV','energy of level n'],['ΔE = hf','photon energy'],['1/λ = R(1/n_f² − 1/n_i²)','Rydberg formula']],
 ap:['Hydrogen discharge tube','Spectrometer and grating','Power supply','Dark room'],
 pr:['Choose the initial and final levels.','Read the transition energy and wavelength.','Identify which series it belongs to.','Compare with the Rydberg formula.'],
 pc:['Discharge tubes carry high voltage.','Only n_f = 2 transitions are visible to the eye.']},
spectra:{aim:'To identify elements from their emission and absorption spectra.',
 th:'Each element has a unique set of energy levels, so it emits a unique set of wavelengths when excited. A cool gas in front of a hot continuous source absorbs exactly the same wavelengths, producing dark lines — which is how the composition of stars was first worked out.',
 f:[['E = hc/λ','photon energy'],['1/λ = R(1/n_f² − 1/n_i²)','hydrogen lines']],
 ap:['Discharge tubes','Diffraction grating spectrometer','Continuous source','Comparison charts'],
 pr:['Observe the emission spectrum of a known gas.','Record the line positions.','Switch to absorption and compare.','Identify an unknown source from its lines.'],
 pc:['Allow your eyes to adapt to the dark.','Calibrate the spectrometer with a known line first.']},
decay:{aim:'To study radioactive decay and determine the half-life.',
 th:'Radioactive decay is random for any one nucleus but highly predictable for a large sample: a constant fraction decays each second. The number remaining falls exponentially, and the half-life is the time for the count to drop to half, regardless of where you start.',
 f:[['N = N₀e^(−λt)','decay law'],['t½ = ln2/λ','half-life'],['A = λN','activity']],
 ap:['Decay simulator or dice model','Geiger-Müller tube','Scaler timer','Radioactive source'],
 pr:['Record the count at regular intervals.','Plot N against t.','Plot ln N against t and take λ from the slope.','Check that ln2/λ matches the graph half-life.'],
 pc:['Subtract the background count.','Handle sources with tongs and keep exposure short.']},
nuclear:{aim:'To study fission, fusion and the binding-energy curve.',
 th:'Binding energy per nucleon peaks near iron. Heavy nuclei therefore release energy by splitting and light nuclei by fusing, in both cases moving toward the peak. The energy released appears as the mass defect, connected by E = mc².',
 f:[['E = Δmc²','mass–energy equivalence'],['1 u = 931.5 MeV','conversion'],['B/A peaks near A = 56','binding energy curve']],
 ap:['Nuclear reaction simulator','Binding energy data tables','Mass tables'],
 pr:['Select a fission or fusion reaction.','Read the binding energy per nucleon.','Calculate the energy released.','Compare fission and fusion yields per nucleon.'],
 pc:['Mass numbers and charge must balance in every reaction.','Energies are per reaction, not per kilogram.']},
debroglie:{aim:'To study matter waves and the conditions for electron diffraction.',
 th:'Every moving particle has a wavelength equal to Planck’s constant divided by its momentum. For electrons accelerated through a few hundred volts this comes out around the spacing of atoms in a crystal, which is why electrons diffract; for anything the size of a dust grain the wavelength is hopelessly small.',
 f:[['λ = h/p','de Broglie wavelength'],['λ = h/√(2mqV)','for an accelerated charge']],
 ap:['Electron diffraction tube','High-voltage supply','Graphite target','Measuring scale'],
 pr:['Accelerate electrons through a known voltage.','Observe the diffraction rings.','Measure the ring radius.','Compare the wavelength with h/√(2meV).'],
 pc:['High-voltage precautions apply.','Keep the beam current low to protect the target.']},
blackbody:{aim:'To study black-body radiation, Wien’s law and Stefan’s law.',
 th:'Every hot object radiates a continuous spectrum whose peak shifts toward shorter wavelengths as it heats up, and whose total output climbs with the fourth power of temperature. This is why a cooling filament moves from dull red through orange to white.',
 f:[['λ_max T = 2.898 × 10⁻³ m·K','Wien’s displacement law'],['P = σεAT⁴','Stefan–Boltzmann law']],
 ap:['Filament lamp and variable supply','Spectrometer','Thermopile','Optical pyrometer'],
 pr:['Set the temperature and record the peak wavelength.','Repeat at several temperatures.','Plot λ_max against 1/T.','Check the total power against T⁴.'],
 pc:['Use absolute temperature.','Shield the detector from room radiation.']},
redshift:{aim:'To measure recession speed and distance from a spectral redshift.',
 th:'Light from a receding galaxy arrives stretched to longer wavelengths. Comparing an identified line with its laboratory wavelength gives the redshift, from which speed follows, and Hubble’s law then converts that speed into a distance.',
 f:[['z = Δλ/λ₀','redshift'],['v ≈ cz','for small z'],['v = H₀d','Hubble’s law']],
 ap:['Spectrograph','Reference lamp','Telescope','Published galaxy spectra'],
 pr:['Identify a known line in the galaxy spectrum.','Measure its observed wavelength.','Calculate z and the speed.','Use Hubble’s law to estimate the distance.'],
 pc:['Identify the line correctly before measuring.','Relativistic formulae are needed once z is large.']},
diode:{aim:'To plot the I–V characteristics of a diode.',
 th:'A pn junction conducts strongly once the forward voltage passes the knee — about 0.7 V for silicon and 0.3 V for germanium — and blocks current in reverse until breakdown. A Zener is built to break down safely at a set voltage and is used to regulate supplies.',
 f:[['I = I₀(e^(qV/kT) − 1)','diode equation'],['V_knee ≈ 0.7 V','silicon forward drop']],
 ap:['Silicon and germanium diodes','Variable DC supply','Milliammeter and voltmeter','Series resistor'],
 pr:['Connect the diode in forward bias with a series resistor.','Record current at increasing voltage.','Reverse the diode and repeat.','Plot the full I–V curve.'],
 pc:['Always include the series resistor.','Note the diode polarity band.']},
transistor:{aim:'To study transistor characteristics and its use as a switch and amplifier.',
 th:'A small base current controls a much larger collector current, the ratio being the gain β. In the active region the device amplifies; driven hard it saturates and behaves like a closed switch; with no base current it is cut off and behaves like an open one.',
 f:[['I_C = βI_B','current gain'],['I_E = I_B + I_C','current relation'],['A_v = −βR_C/r_in','voltage gain']],
 ap:['NPN transistor','Two DC supplies','Milliammeters','Load resistor'],
 pr:['Set a base current and sweep the collector voltage.','Record the collector current.','Repeat for several base currents.','Identify the active and saturation regions.'],
 pc:['Never exceed the collector power rating.','Identify the pin-out before wiring.']},
solarcell:{aim:'To measure the I–V curve and efficiency of a solar cell.',
 th:'A photovoltaic cell turns part of the light falling on it into electricity. Output falls with the cosine of the pointing error and drops as the cell heats, and there is one operating point on the I–V curve where the power delivered is a maximum.',
 f:[['P = VI','electrical output'],['η = P_out/(G × A)','conversion efficiency'],['FF = P_max/(V_ocI_sc)','fill factor']],
 ap:['Solar panel','Variable load resistor','Lamp and lux meter','Voltmeter and ammeter'],
 pr:['Illuminate the panel at a measured irradiance.','Vary the load and record V and I.','Plot the I–V and power curves.','Find the maximum power point and efficiency.'],
 pc:['Keep the panel cool — efficiency falls as it heats.','Measure irradiance at the panel surface.']},
logic:{aim:'To verify the truth tables of the basic logic gates.',
 th:'Digital circuits work with two levels, treated as 0 and 1. Each gate implements a Boolean function of its inputs, and combining gates builds everything from adders to processors. NAND and NOR are universal: either one alone can build any other gate.',
 f:[['Y = A·B','AND'],['Y = A + B','OR'],['Y = Ā','NOT'],['Y = A ⊕ B','XOR']],
 ap:['Logic gate ICs or trainer board','5 V supply','Input switches','LED indicators'],
 pr:['Set both inputs to 0 and note the output.','Work through all input combinations.','Record the truth table.','Repeat for each gate.'],
 pc:['Never leave an input floating.','Observe the supply polarity on the IC.']},
adder:{aim:'To build and verify half adder and full adder circuits.',
 th:'A half adder adds two bits, producing a sum from an XOR gate and a carry from an AND gate. A full adder takes a carry in as well, so several can be chained to add multi-bit numbers — which is how binary arithmetic is done in hardware.',
 f:[['S = A ⊕ B','half adder sum'],['C = A·B','half adder carry'],['S = A ⊕ B ⊕ C_in','full adder sum']],
 ap:['XOR, AND and OR gate ICs','Breadboard and jumpers','Input switches','LED indicators'],
 pr:['Wire the half adder and test all four input cases.','Extend to a full adder with carry in.','Record the truth table.','Check the decimal total matches.'],
 pc:['Keep the wiring tidy so faults are easy to trace.','Check the gate pin-outs before powering up.']},
flipflop:{aim:'To study flip-flops as one-bit memory elements.',
 th:'A flip-flop holds its output until the clock tells it to update. An SR latch sets and resets, a D flip-flop copies its input, a JK toggles when both inputs are high and a T flip-flop toggles on every pulse — the building block of counters.',
 f:[['Q_next = D','D flip-flop'],['Q_next = Q̄ when J = K = 1','JK toggle'],['S = R = 1','forbidden for SR']],
 ap:['Flip-flop ICs','Clock generator','Input switches','LED indicators'],
 pr:['Set the inputs and apply a clock pulse.','Observe the stored output.','Work through the excitation table.','Test the toggle behaviour.'],
 pc:['Avoid the forbidden SR input state.','Use a clean, debounced clock.']},
counter:{aim:'To study a binary ripple counter.',
 th:'Each flip-flop in a ripple counter toggles on the output of the one before it, so each stage halves the frequency. An n-stage counter therefore counts from 0 to 2ⁿ − 1 before rolling over, and divides the clock frequency by 2ⁿ.',
 f:[['modulus = 2ⁿ','count range'],['f_out = f_in/2ⁿ','frequency division']],
 ap:['JK flip-flop ICs','Clock generator','LED display','Logic probe'],
 pr:['Clock the counter slowly and read the LEDs.','Record the binary sequence.','Confirm the roll-over point.','Measure the output frequency of the last stage.'],
 pc:['Ripple counters show brief false states while settling.','Keep the clock slow enough to read.']},
opamp:{aim:'To study inverting and non-inverting op-amp amplifiers.',
 th:'An ideal op-amp draws no input current and, with negative feedback, adjusts its output until the two inputs sit at the same voltage. Those two rules give the gain directly from the resistor ratio. The output can never exceed the supply rails, so large inputs are clipped.',
 f:[['A = −R_f/R_in','inverting gain'],['A = 1 + R_f/R_in','non-inverting gain'],['V_out ≤ V_supply','saturation limit']],
 ap:['Op-amp IC','Dual supply','Resistors','Signal generator and oscilloscope'],
 pr:['Wire the inverting amplifier.','Apply a small input and measure the output.','Change the resistor ratio and repeat.','Increase the input until clipping appears.'],
 pc:['Use a split supply for AC signals.','Stay well inside the rails to avoid distortion.']},
oscillator:{aim:'To study waveform generators and their frequency.',
 th:'An oscillator turns DC into a repeating waveform. An RC astable charges and discharges a capacitor through a resistor, so its frequency is set by the time constant; an LC circuit exchanges energy between the inductor and capacitor and rings at its resonant frequency.',
 f:[['f ≈ 1.44/((R₁ + 2R₂)C)','555 astable'],['f = 1/2π√(LC)','LC oscillator'],['τ = RC','time constant']],
 ap:['555 timer or op-amp','Resistors and capacitors','Oscilloscope','Breadboard'],
 pr:['Build the astable circuit.','Measure the output frequency.','Change R and C and repeat.','Plot frequency against 1/RC.'],
 pc:['Mind electrolytic capacitor polarity.','Keep the scope probe ground close to the circuit ground.']},
sensor:{aim:'To build a sensing circuit that switches an output at a set threshold.',
 th:'A sensor changes its resistance with the quantity being measured — light for an LDR, temperature for a thermistor, vibration for a piezo. A comparator then switches an output when the sensed value crosses a threshold, and a little hysteresis prevents it chattering at the boundary.',
 f:[['V_out = V_in R₂/(R₁ + R₂)','potential divider'],['switch when V_sensor crosses V_ref','comparator action']],
 ap:['LDR or thermistor','Comparator IC or transistor','Relay or LED','Preset resistor'],
 pr:['Build the divider with the sensor.','Set the threshold with the preset.','Vary the sensed quantity and note the switching point.','Add hysteresis and compare.'],
 pc:['Isolate mains loads with a relay.','Shield the sensor from the output it controls.']},
solartracker:{aim:'To compare a solar tracker with a fixed panel over a day.',
 th:'A panel collects power in proportion to the cosine of the angle between the sunlight and its normal. A fixed panel is only well aimed for part of the day, while a tracker keeps the pointing error near zero and typically gains between a quarter and a third more daily energy.',
 f:[['P = GA η cosθ','power collected'],['E = ∫P dt','daily energy']],
 ap:['Solar panel and servo mount','Pair of LDRs','Microcontroller','Light source'],
 pr:['Log output from a fixed panel through the day.','Repeat with tracking enabled.','Compare the two power curves.','Calculate the energy gain.'],
 pc:['Account for the tracker’s own power draw.','Keep the sensors shaded from reflections.']},
ultrasonic:{aim:'To measure distance by ultrasonic echo timing.',
 th:'The sensor sends a short 40 kHz burst and times the echo. Since the pulse travels to the target and back, the distance is half the round trip. Because the speed of sound depends on temperature, accurate work needs a temperature correction.',
 f:[['d = vt/2','distance from echo time'],['v = 331.3 + 0.606T','speed of sound in air']],
 ap:['HC-SR04 module','Microcontroller','Target board','Metre scale'],
 pr:['Place the target at a measured distance.','Record the echo time.','Repeat at several distances.','Plot measured against true distance.'],
 pc:['Keep the target square to the sensor.','Soft targets absorb the pulse and give no echo.']},
radar:{aim:'To study range and Doppler measurement in a simple radar.',
 th:'Radar sends a pulse and measures the delay of the echo to find range. If the target is moving, the returned wave is shifted in frequency, and that Doppler shift gives the radial speed directly. Bearing comes from the direction the antenna is pointing.',
 f:[['R = ct/2','range from echo delay'],['f_d = 2v_r f/c','Doppler shift'],['λ = c/f','wavelength']],
 ap:['Radar demonstration kit','Oscilloscope','Moving target','Signal generator'],
 pr:['Set a target range and note the echo delay.','Move the target and record the Doppler shift.','Convert shift to radial speed.','Plot range against delay.'],
 pc:['Only the radial component of velocity shows up.','Avoid pointing the transmitter at people.']},
waterrocket:{aim:'To study thrust and range of a water rocket.',
 th:'Compressed air pushes water out of the nozzle, and the reaction to that ejected momentum drives the rocket up. Too little water gives nothing to throw, too much leaves no air to throw it, so the range peaks at roughly one third full.',
 f:[['v_e = √(2ΔP/ρ)','exhaust speed'],['F = ṁv_e','thrust'],['R = v₀²sin2θ/g','range']],
 ap:['Plastic bottle and launcher','Bicycle pump and pressure gauge','Measuring tape','Protractor'],
 pr:['Fill to a set fraction and pressurise.','Launch at a fixed angle and measure the range.','Repeat for several fill fractions.','Plot range against fill.'],
 pc:['Never stand over a pressurised bottle.','Wear eye protection and launch outdoors.']},
maglev:{aim:'To balance magnetic lift against weight in a levitation setup.',
 th:'An electromagnet attracts a ferromagnetic object with a force that grows with the square of the current and falls sharply with the gap. That makes the balance point unstable on its own, so practical levitation relies on a sensor and fast feedback to hold the gap steady.',
 f:[['F ∝ (NI)²/g²','magnetic lift'],['F = mg','condition for levitation']],
 ap:['Electromagnet coil','Hall sensor','Driver transistor','Small permanent magnet'],
 pr:['Energise the coil and lower the object.','Adjust the current until it floats.','Record the current and gap.','Plot lift against 1/gap².'],
 pc:['The coil heats quickly — limit run time.','Keep fingers clear of the attracting gap.']},
windturbine:{aim:'To study the power output of a wind turbine.',
 th:'The power in the wind rises with the cube of wind speed and with the swept area, so doubling the blade diameter quadruples the available power. No rotor can capture more than 59.3% of it — the Betz limit — and generator losses cut the electrical output further.',
 f:[['P = ½ρAv³','power in the wind'],['P_shaft = C_p × P','captured power'],['C_p ≤ 0.593','Betz limit']],
 ap:['Model turbine and generator','Variable-speed fan','Anemometer','Multimeter'],
 pr:['Set a wind speed and measure the output.','Increase the speed in steps.','Plot power against v³.','Calculate the power coefficient.'],
 pc:['Keep clear of spinning blades.','Measure wind speed at the rotor plane.']},
emcrane:{aim:'To build an electromagnet crane and study its lifting force.',
 th:'A coil wound on a soft-iron core becomes a strong electromagnet whose pull depends on the ampere-turns and, critically, on the air gap. A soft-iron core is chosen because it loses its magnetism as soon as the current stops, letting the crane release its load.',
 f:[['F ∝ (NI)²','lifting force'],['B = µ₀µ_r nI','field in the core'],['F > mg','condition to lift']],
 ap:['Soft-iron core and enamelled wire','Variable DC supply','Steel loads','Ammeter'],
 pr:['Wind the coil and energise it.','Find the smallest current that lifts the load.','Repeat for heavier loads.','Plot current against load mass.'],
 pc:['Coils heat quickly at high current.','Use soft iron, not steel, for the core.']},
wirelesspower:{aim:'To study inductive power transfer between coupled coils.',
 th:'An alternating current in one coil induces a voltage in a nearby coil through shared magnetic flux. The coupling coefficient falls quickly as the coils separate or misalign, and efficiency peaks when both coils are tuned to the drive frequency.',
 f:[['ε = −M dI/dt','mutual induction'],['k = M/√(L₁L₂)','coupling coefficient'],['η ≈ k²Q','transfer efficiency']],
 ap:['Two matched coils','High-frequency driver','Oscilloscope','LED load'],
 pr:['Align the coils and record the delivered power.','Increase the separation in steps.','Repeat with the receiver tilted.','Plot efficiency against separation.'],
 pc:['Keep metal objects out of the field.','Do not exceed the driver ratings.']},
vernier:{aim:'To measure small lengths with a vernier caliper and a screw gauge.',
 th:'A vernier scale uses divisions slightly smaller than the main scale, so the division that lines up tells you the fraction. A screw gauge converts rotation into tiny linear movement. Both must be checked for zero error before any reading is trusted.',
 f:[['LC = 1 main division/number of vernier divisions','least count'],['reading = main + vernier × LC','total reading'],['corrected = reading − zero error','zero correction']],
 ap:['Vernier caliper','Micrometer screw gauge','Test objects','Notebook'],
 pr:['Check and record the zero error.','Grip the object and read the main scale.','Find the coinciding vernier division.','Apply the zero correction.'],
 pc:['Use the ratchet on a screw gauge — do not over-tighten.','Record the zero error with its sign.']},
errors:{aim:'To analyse random and systematic errors in repeated measurements.',
 th:'Repeated readings scatter about a mean because of random error, which averages out as more trials are taken. A systematic error shifts every reading the same way and never averages out — it has to be found and removed by better technique or calibration.',
 f:[['mean = Σx/n','best estimate'],['σ = √(Σ(x − x̄)²/(n − 1))','standard deviation'],['SE = σ/√n','standard error']],
 ap:['Any measuring instrument','Data table','Calculator','Graph paper'],
 pr:['Take at least eight readings of the same quantity.','Calculate the mean and standard deviation.','Find the standard error.','Compare with the accepted value to spot bias.'],
 pc:['More trials help random error only.','Quote results with an uncertainty and correct units.']},
arduino:{aim:'To generate and measure signals with a microcontroller.',
 th:'A microcontroller reads analogue voltages with an ADC that maps the input range onto discrete counts, and outputs a pseudo-analogue voltage using PWM — switching so fast that the load only responds to the average. Resolution and timing are set by the reference voltage and the clock.',
 f:[['V = counts × V_ref/1024','10-bit ADC'],['V_avg = V × duty cycle','PWM average'],['f = 1/T','signal frequency']],
 ap:['Microcontroller board','Breadboard and sensors','Multimeter','Oscilloscope'],
 pr:['Generate a PWM signal at a set duty cycle.','Measure the average voltage.','Read an analogue sensor.','Convert the counts back to volts.'],
 pc:['Keep inputs within the reference voltage.','PWM is not a true analogue output.']},
generic:{aim:'To explore the relationships between the key variables of this experiment.',
 th:'Adjust the controls, watch how the measured quantities respond, and record readings so the underlying relationship can be plotted and checked.',
 f:[['—','see the live measurements panel']],
 ap:['Virtual apparatus','Measuring instruments','Data table'],
 pr:['Set the input parameters.','Observe the simulation.','Record readings.','Analyse the results.'],
 pc:['Change one variable at a time.','Record units with every value.']}
};

shm:[

ohm:[

seriesparallel:[

rc:[

 {q:'The time constant of an RC circuit is:',o:['R/C','RC','C/R','1/RC'],a:1,e:'τ = RC, measured in seconds when R is in ohms and C in farads.'},

refraction:[
 {q:'Light entering a denser medium bends:',o:['Away from the normal','Toward the normal','Along the normal','Back on itself'],a:1,e:'The wave slows down, so the ray swings toward the normal.'},
 {q:'Total internal reflection requires:',o:['Light going from rare to dense','Light going from dense to rare above the critical angle','Any angle of incidence','A perfectly flat surface'],a:1,e:'Only then can sin r exceed 1, which is impossible, so all the light reflects.'},
 {q:'Snell’s law states that:',o:['n₁sin i = n₂sin r','n₁cos i = n₂cos r','n₁/i = n₂/r','sin i + sin r = n'],a:0,e:'The ratio of the sines is fixed by the refractive indices.'}],
lens:[
 {q:'A converging lens forms a real inverted image when the object is:',o:['Inside the focal length','Beyond the focal length','At the focus','Anywhere'],a:1,e:'Inside f the image becomes virtual and upright.'},
 {q:'The power of a lens of focal length 50 cm is:',o:['0.5 D','2 D','5 D','50 D'],a:1,e:'P = 1/f in metres, so 1/0.5 = 2 dioptres.'},

function quizFor(sim){
  if(QB[sim]) return QB[sim];
  const t=TH[sim]||TH.generic, keys=Object.keys(TH).filter(k=>k!==sim&&k!=='generic');
  const pick=(arr,n)=>{const c=[...arr];const o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o;};
  const mk=(q,correct,pool,e)=>{
    const wrong=pick(pool.filter(x=>x!==correct),3);
    const opts=[correct,...wrong]; const idx=Math.floor(Math.random()*4);
    [opts[0],opts[idx]]=[opts[idx],opts[0]];
    return {q,o:opts,a:idx,e};
  };
  const eqPool=keys.map(k=>TH[k].f[0][0]);
  const apPool=keys.map(k=>TH[k].ap[0]);
  const pcPool=keys.map(k=>TH[k].pc[0]);
  return [
    mk('Which relationship is being tested in this experiment?',t.f[0][0],eqPool,t.f[0][0]+' — '+t.f[0][1]+'.'),
    mk('Which apparatus belongs with this experiment?',t.ap[0],apPool,'The setup uses '+t.ap[0].toLowerCase()+'.'),
    mk('Which precaution applies here?',t.pc[0],pcPool,t.pc[0])
  ];
}

App.paintLab=function(){
  const q=this.state.q.toLowerCase().trim();
  const list=EXPERIMENTS.filter(e=>
    (this.state.cat==='all'||e.category===this.state.cat) &&
    (!q||e.name.toLowerCase().includes(q)||e.description.toLowerCase().includes(q)||e.category.toLowerCase().includes(q)));
  $('#labGrid').innerHTML=list.length?list.map(e=>this.expCard(e)).join('')
    :`<div class="empty" style="grid-column:1/-1"><i class="fas fa-magnifying-glass"></i>
      No experiment matches that. Try a topic name such as optics, or clear the search.</div>`;
  const s=$('#labShown'); if(s) s.textContent=list.length+' shown';
};

App.calcRun=function(){
  const num=id=>parseFloat(($('#'+id)||{}).value);
  let out='Enter values';
  if(this.state.calc==='ohm'){ const V=num('cV'),I=num('cI');
    if(isFinite(V)&&isFinite(I)&&I!==0) out=fmt(V/I)+' Ω  ·  '+fmt(V*I)+' W'; }
  else if(this.state.calc==='kin'){ const u=num('cU')||0,a=num('cA')||0,t=num('cT');
    if(isFinite(t)) out='v = '+fmt(u+a*t)+' m/s  ·  s = '+fmt(u*t+0.5*a*t*t)+' m'; }
  else { const m=num('cM'),v=num('cS')||0,h=num('cH')||0;
    if(isFinite(m)) out='KE '+fmt(0.5*m*v*v)+' J  ·  PE '+fmt(m*9.81*h)+' J'; }
  $('#calcOut').innerHTML='<small>Result</small><b>'+out+'</b>';
};

    const keys=rows.length?Object.keys(rows[0].d):[];
    if(rows.length<2){
      $('#tabBody').innerHTML=`<div class="card"><div class="empty"><i class="fas fa-chart-line"></i>

    $('#tabBody').innerHTML=`
      <div class="card">
        <div class="obs-bar"><h3 style="margin:0"><i class="fas fa-chart-line"></i>Graph</h3>
          <div class="gcfg">
