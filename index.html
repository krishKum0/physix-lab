<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhysiX Lab — Virtual Physics Laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a12;--bg2:#0a1120;--panel:#0c1526;--card:#101b2e;--card2:#15243c;
  --border:#1b2d4a;--border2:#294064;
  --text:#e9eff8;--text2:#b2c1d8;--muted:#7182a1;--dim:#4a5872;
  --accent:#00e5a0;--accent-d:#00b881;--accent-glow:rgba(0,229,160,.22);
  --amber:#fbbf24;--amber-glow:rgba(251,191,36,.18);
  --cyan:#22d3ee;--cyan-glow:rgba(34,211,238,.18);
  --violet:#a78bfa;--violet-glow:rgba(167,139,250,.18);
  --rose:#fb7185;--rose-glow:rgba(251,113,133,.18);
  --orange:#fb923c;
  --cv-grid:rgba(255,255,255,.045);--cv-face:#16243b;--cv-metal:#64748b;
  --r:12px;--r-lg:16px;--r-sm:8px;
  --shadow:0 4px 22px rgba(0,0,0,.32);--shadow-lg:0 14px 44px rgba(0,0,0,.5);
  --sidebar-w:252px;--header-h:58px;
  --tr:.18s cubic-bezier(.4,0,.2,1);
  --font:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eef3fa;--bg2:#e6edf7;--panel:#fff;--card:#fff;--card2:#f3f7fd;
  --border:#dbe3ef;--border2:#c6d2e4;
  --text:#0d1729;--text2:#2b3c59;--muted:#5a6b8a;--dim:#8494ae;
  --accent:#00a878;--accent-d:#008a63;--accent-glow:rgba(0,168,120,.14);
  --cv-grid:rgba(15,25,45,.06);--cv-face:#dfe8f5;--cv-metal:#94a3b8;
  --shadow:0 2px 12px rgba(15,25,45,.07);--shadow-lg:0 12px 32px rgba(15,25,45,.12);
}
html{scroll-behavior:smooth;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 12% -5%,rgba(0,229,160,.07),transparent 42%),radial-gradient(ellipse at 88% 0%,rgba(34,211,238,.055),transparent 38%),radial-gradient(ellipse at 50% 110%,rgba(167,139,250,.05),transparent 45%);pointer-events:none;z-index:0}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--border2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
img,canvas{max-width:100%}

/* ---------- header ---------- */
.app-header{height:var(--header-h);position:sticky;top:env(safe-area-inset-top,0px);z-index:200;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:17px;cursor:pointer;padding:6px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;background:none;border:none;color:inherit;font-family:inherit}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:grid;place-items:center;position:relative;box-shadow:0 0 18px var(--accent-glow);flex-shrink:0}
.logo-mark::before{content:'';position:absolute;inset:2px;border-radius:8px;background:var(--bg)}
.logo-mark i{position:relative;z-index:1;color:var(--accent);font-size:17px}
.logo-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.logo-text b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.logo-text span{font-size:10px;color:var(--muted);font-weight:500}
.header-center{flex:1;display:flex;justify-content:center;max-width:520px}
.search-box{width:100%;height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;transition:var(--tr)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.search-box i{color:var(--muted);font-size:12px}
.search-box input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:13px}
.header-right{display:flex;align-items:center;gap:6px}
.hbtn{height:36px;min-width:36px;padding:0 10px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);color:var(--text2);border-radius:10px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;transition:var(--tr)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.io{padding:0;width:36px;justify-content:center}

/* ---------- layout ---------- */
.app-layout{display:flex;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top,0px));bottom:0;left:0;overflow-y:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-right:1px solid var(--border);padding:12px 10px 40px;z-index:100}
.side-group{margin-bottom:16px}
.side-head{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.4px;padding:0 10px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:none;border:none;border-radius:8px;color:var(--text2);text-align:left;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;transition:var(--tr);position:relative;margin-bottom:1px}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item i{width:16px;text-align:center;font-size:12px;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--card2);color:var(--muted);font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;font-family:var(--mono)}
.main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w));min-height:calc(100vh - var(--header-h));padding:22px 26px 60px}
.view{display:none}
.view.active{display:block}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-40%;right:-5%;width:380px;height:380px;background:radial-gradient(circle,var(--accent-glow),transparent 62%);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:62ch}
.hero h1{font-size:clamp(22px,3.4vw,31px);font-weight:700;line-height:1.14;margin-bottom:8px;letter-spacing:-.6px}
.grad{background:linear-gradient(90deg,var(--accent),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero p{color:var(--text2);font-size:14px;line-height:1.6;margin-bottom:16px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}
.btn-primary{background:var(--accent);color:#04231a;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:hover{background:var(--accent-d)}
.btn-2{background:var(--card2);color:var(--text);border-color:var(--border)}
.btn-2:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:none;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:var(--card);color:var(--text)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative}
.stat i{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.stat b{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;display:block}
.stat span{font-size:11px;color:var(--muted);margin-top:5px;display:block;font-weight:600}

.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec h2 i{color:var(--accent);font-size:14px}
.sec .lnk{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font);display:flex;align-items:center;gap:5px}
.sec .lnk:hover{color:var(--accent)}

.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.exp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;font-family:var(--font);color:inherit}
.exp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc,var(--accent));transform:scaleX(0);transform-origin:left;transition:transform .25s}
.exp-card:hover{border-color:var(--cc,var(--accent));box-shadow:var(--shadow)}
.exp-card:hover::before{transform:scaleX(1)}
.exp-card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:11px;background:color-mix(in srgb,var(--cc,#00e5a0) 14%,transparent);color:var(--cc,var(--accent))}
.exp-card h3{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.3}
.exp-card p{font-size:11.5px;color:var(--muted);line-height:1.45;flex:1}
.exp-card .tag{display:inline-block;margin-top:10px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--card2);color:var(--text2);width:fit-content}
.exp-card .done{position:absolute;top:12px;right:12px;color:var(--accent);font-size:12px}

.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:var(--tr)}
.fcard:hover{border-color:var(--amber)}
.fcard .c{font-size:10px;font-weight:700;color:var(--amber);margin-bottom:7px}
.fcard .n{font-size:13px;font-weight:600;margin-bottom:7px}
.fcard .e{font-family:var(--mono);font-size:14px;color:var(--accent);background:var(--bg2);padding:9px;border-radius:6px;text-align:center}
.fcard .d{font-size:11px;color:var(--muted);margin-top:8px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.panel h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px;color:var(--accent)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
.side-stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.calc-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.calc-tabs button{padding:8px 4px;background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text2);cursor:pointer;font-family:var(--font);font-size:11.5px;font-weight:600;transition:var(--tr)}
.calc-tabs button.active,.calc-tabs button:hover{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.calc-in{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.calc-in label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.calc-in input,.calc-in select{width:100%;height:34px;padding:0 9px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none}
.calc-in input:focus{border-color:var(--accent)}
.calc-out{padding:11px;background:var(--accent-glow);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:7px;text-align:center}
.calc-out small{font-size:10.5px;color:var(--muted);display:block}
.calc-out b{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--accent);display:block;margin-top:3px}

/* ---------- experiment detail ---------- */
.eh{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eh-l{display:flex;align-items:center;gap:13px;min-width:0}
.eh-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.eh h1{font-size:20px;font-weight:700;line-height:1.2}
.eh .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;transition:var(--tr);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:var(--card2)}
.tab.active{background:var(--accent);color:#04231a}
.tab i{font-size:11px}

.theory{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card:last-child{margin-bottom:0}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:8px;color:var(--accent)}
.card p{font-size:13px;line-height:1.72;color:var(--text2);margin-bottom:9px;max-width:72ch}
.card p:last-child{margin-bottom:0}
.eqbox{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;margin:10px 0}
.eqbox .eq{font-family:var(--mono);font-size:16px;color:var(--amber);font-weight:600}
.eqbox .ds{font-size:11px;color:var(--muted);margin-top:5px}
.li{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;background:var(--bg2);border-radius:6px;font-size:12.5px;color:var(--text2);margin-bottom:6px;line-height:1.5}
.li i{color:var(--accent);margin-top:3px;font-size:11px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:9px;list-style:none}
.steps li{display:flex;gap:10px;font-size:13px;line-height:1.6;color:var(--text2)}
.steps li::before{counter-increment:s;content:counter(s);width:21px;height:21px;border-radius:50%;background:var(--accent-glow);color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.warn{display:flex;gap:9px;padding:9px 10px;background:var(--rose-glow);border:1px solid color-mix(in srgb,var(--rose) 22%,transparent);border-radius:6px;font-size:12.5px;color:var(--text2);margin-bottom:6px;line-height:1.5}
.warn i{color:var(--rose);flex-shrink:0;margin-top:3px;font-size:11px}

/* ---------- simulation ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 308px;gap:14px;align-items:start}
.stage{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;height:clamp(380px,58vh,560px)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage-bar{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:5}
.sbtn{width:34px;height:34px;border-radius:8px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:12px;transition:var(--tr)}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.on{background:var(--accent);color:#04231a;border-color:var(--accent)}
.stage-tip{position:absolute;bottom:10px;left:10px;right:10px;font-size:11px;color:var(--muted);pointer-events:none;text-align:center}
.ctrls{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;max-height:clamp(380px,58vh,560px);overflow-y:auto}
.ctrls h3{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.cg{margin-bottom:13px}
.cg .lb{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);margin-bottom:6px;gap:8px}
.cg .lb b{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600;background:var(--bg2);padding:2px 7px;border-radius:4px;white-space:nowrap}
.cg select{width:100%;height:32px;padding:0 8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;outline:none;cursor:pointer}
input[type=range]{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:var(--bg2);border-radius:3px;outline:none;cursor:pointer;border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-glow)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-glow)}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.cbtn{flex:1;min-width:76px;padding:8px 10px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:6px}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.cbtn.p{background:var(--accent);color:#04231a;border-color:var(--accent)}
.cbtn.p:hover{background:var(--accent-d);color:#04231a}
.cbtn.d:hover{border-color:var(--rose);color:var(--rose)}
.ro{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:10px}
.ro h4{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.ro .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);font-size:12px}
.ro .r:last-child{border-bottom:none}
.ro .r span{color:var(--muted)}
.ro .r b{font-family:var(--mono);color:var(--accent);font-weight:600}

/* ---------- data / graph ---------- */
.obs-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.obs{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
table.obs th{padding:9px 11px;text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border);background:var(--bg2);white-space:nowrap;font-size:11.5px}
table.obs td{padding:8px 11px;border-bottom:1px solid var(--border);color:var(--text2);font-family:var(--mono);font-size:12px;white-space:nowrap}
table.obs tr:hover td{background:var(--bg2)}
.xbtn{width:25px;height:25px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:10px}
.xbtn:hover{border-color:var(--rose);color:var(--rose)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px}
.empty i{font-size:26px;display:block;margin-bottom:10px;color:var(--border2)}
.gcfg{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.gcfg select{height:32px;padding:0 9px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;outline:none;cursor:pointer}
.gwrap{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;height:400px}
.gwrap canvas{display:block;width:100%;height:100%}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.gstat{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.gstat small{font-size:10px;color:var(--muted);display:block}
.gstat b{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--accent);display:block;margin-top:2px}

/* ---------- library / chips ---------- */
.lib-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.lib-search{flex:1;min-width:200px;height:38px;padding:0 13px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.lib-search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;background:var(--card);border:1px solid var(--border);border-radius:18px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:var(--font)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#04231a;border-color:var(--accent)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(254px,1fr));gap:12px}
.lib-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;transition:var(--tr)}
.lib-item:hover{border-color:var(--accent)}
.lib-item .c{font-size:10px;font-weight:700;margin-bottom:7px}
.lib-item .n{font-size:13.5px;font-weight:600;margin-bottom:8px}
.lib-item .e{font-family:var(--mono);font-size:13.5px;color:var(--amber);background:var(--bg2);padding:9px;border-radius:6px;text-align:center;margin-bottom:8px;overflow-x:auto}
.lib-item .s{font-size:11px;color:var(--muted);line-height:1.6}

/* ---------- viva ---------- */
.q-opt{width:100%;text-align:left;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer;transition:var(--tr);display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.q-opt:hover{border-color:var(--accent)}
.q-opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);flex-shrink:0}
.q-opt.ok{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}
.q-opt.no{border-color:var(--rose);background:var(--rose-glow);color:var(--rose)}
.q-exp{margin-top:12px;padding:12px;background:var(--bg2);border-radius:8px;border-left:3px solid var(--accent);font-size:12.5px;line-height:1.6;color:var(--text2)}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* ---------- AI ---------- */
.ai-wrap{max-width:820px;margin:0 auto}
.ai-chat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;height:min(62vh,560px);min-height:340px}
.ai-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px}
.msg{display:flex;gap:10px;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.msg.ai .av{background:linear-gradient(135deg,var(--accent),var(--cyan));color:#04231a}
.msg.me .av{background:var(--card2);color:var(--text2)}
.msg .bub{padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.65}
.msg.ai .bub{background:var(--bg2);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text2)}
.msg.me .bub{background:var(--accent);color:#04231a;border-top-right-radius:4px;font-weight:500}
.msg .bub code{font-family:var(--mono);background:var(--card2);padding:5px 9px;border-radius:6px;margin:6px 0;color:var(--amber);display:block;font-size:12.5px}
.msg .bub b{color:var(--accent)}
.msg.me .bub b{color:inherit}
.dots{display:flex;gap:4px;padding:6px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bp 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.ai-in{border-top:1px solid var(--border);padding:11px;display:flex;gap:8px}
.ai-in input{flex:1;min-width:0;height:40px;padding:0 13px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.ai-in input:focus{border-color:var(--accent)}
.ai-in button{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#04231a;border:none;cursor:pointer;font-size:14px}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:min(320px,90vw)}
.toast{background:var(--card);border:1px solid var(--border);border-left-width:3px;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);font-size:12.5px;animation:sl .25s ease;transition:opacity .25s}
.toast.s{border-left-color:var(--accent)}.toast.s i{color:var(--accent)}
.toast.e{border-left-color:var(--rose)}.toast.e i{color:var(--rose)}
.toast.i{border-left-color:var(--cyan)}.toast.i i{color:var(--cyan)}
@keyframes sl{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}

.mnav{display:none;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(56px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border);z-index:150;justify-content:space-around;align-items:center}
.mnav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-family:var(--font);font-weight:600;cursor:pointer;padding:6px 10px}
.mnav button.active{color:var(--accent)}
.mnav button i{font-size:15px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.scrim.on{display:block}

@media(max-width:1180px){.dash{grid-template-columns:1fr}.theory{grid-template-columns:1fr}.sim{grid-template-columns:1fr}.ctrls{max-height:none}}
@media(max-width:820px){
  .menu-toggle{display:block}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:150}
  .sidebar.open{transform:none}
  .main{margin-left:0;width:100%;padding:16px 14px 80px}
  .header-center{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mnav{display:flex}
  .logo-text span{display:none}
}
@media(max-width:480px){.exp-grid{grid-template-columns:1fr 1fr;gap:9px}.exp-card{padding:12px}.exp-card .ic{width:32px;height:32px;font-size:14px}.fcards{grid-template-columns:1fr}.stage{height:320px}}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    <button class="logo" onclick="App.go('home')">
      <span class="logo-mark"><i class="fas fa-atom"></i></span>
      <span class="logo-text"><b>PhysiX Lab</b><span>Virtual physics laboratory</span></span>
    </button>
  </div>
  <div class="header-center">
    <label class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="globalSearch" placeholder="Search experiments, topics, formulas…">
    </label>
  </div>
  <div class="header-right">
    <button class="hbtn io" onclick="App.toggleTheme()" title="Switch theme"><i class="fas fa-moon" id="themeIcon"></i></button>
    <button class="hbtn io" onclick="App.go('ai')" title="Ask the tutor"><i class="fas fa-robot"></i></button>
  </div>
</header>

<div class="scrim" id="scrim" onclick="App.closeMenu()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-group">
      <div class="side-head"><i class="fas fa-compass"></i>Browse</div>
      <button class="nav-item active" data-view="home" onclick="App.go('home')"><i class="fas fa-gauge-high"></i>Dashboard</button>
      <button class="nav-item" data-view="lab" onclick="App.go('lab')"><i class="fas fa-flask"></i>Virtual lab<span class="badge" id="labCount">0</span></button>
      <button class="nav-item" data-view="formulas" onclick="App.go('formulas')"><i class="fas fa-square-root-variable"></i>Formula library</button>
      <button class="nav-item" data-view="ai" onclick="App.go('ai')"><i class="fas fa-robot"></i>Physics tutor</button>
      <button class="nav-item" data-view="progress" onclick="App.go('progress')"><i class="fas fa-chart-simple"></i>My progress</button>
      <button class="nav-item" data-view="settings" onclick="App.go('settings')"><i class="fas fa-sliders"></i>Settings</button>
    </div>
    <div class="side-group" id="catNav"></div>
  </aside>

  <main class="main">
    <section class="view active" id="v-home"></section>
    <section class="view" id="v-lab"></section>
    <section class="view" id="v-exp"></section>
    <section class="view" id="v-formulas"></section>
    <section class="view" id="v-ai"></section>
    <section class="view" id="v-progress"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>

<nav class="mnav">
  <button class="active" data-mv="home" onclick="App.go('home')"><i class="fas fa-gauge-high"></i>Home</button>
  <button data-mv="lab" onclick="App.go('lab')"><i class="fas fa-flask"></i>Lab</button>
  <button data-mv="formulas" onclick="App.go('formulas')"><i class="fas fa-square-root-variable"></i>Formulas</button>
  <button data-mv="ai" onclick="App.go('ai')"><i class="fas fa-robot"></i>Tutor</button>
  <button data-mv="progress" onclick="App.go('progress')"><i class="fas fa-chart-simple"></i>Progress</button>
</nav>

<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   PhysiX Lab — virtual physics laboratory
   Sim engines are pure physics: every readout is computed,
   never faked, so captured data plots into real relationships.
   ============================================================ */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> [...(r||document).querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,d)=>{
  if(typeof v!=='number'||!isFinite(v)) return String(v);
  const a=Math.abs(v);
  if(a!==0&&(a<1e-3||a>=1e6)) return v.toExponential(2);
  if(d!==undefined) return v.toFixed(d);
  return (a>=100?v.toFixed(1):a>=10?v.toFixed(2):v.toFixed(3)).replace(/\.?0+$/,m=>m.includes('.')?'':m);
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- persistence (per-viewer, may be unavailable) ---------- */
const Store={
  key:'physixlab.v2',
  read(){ try{ return JSON.parse(localStorage.getItem(this.key)||'{}'); }catch(e){ return {}; } },
  write(d){ try{ localStorage.setItem(this.key,JSON.stringify(d)); }catch(e){} }
};

const App={
  state:{view:'home',exp:null,tab:'theory',theme:'dark',scores:{},obs:{},activity:[],calc:'ohm',cat:'all',q:''},

  boot(){
    const d=Store.read();
    this.state.scores=d.scores||{}; this.state.obs=d.obs||{}; this.state.activity=d.activity||[];
    this.setTheme(d.theme|| (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
    $('#labCount').textContent=EXPERIMENTS.length;
    this.buildCatNav(); this.renderHome(); this.renderLab(); this.renderFormulas(); this.renderAI(); this.renderSettings();
    $('#menuToggle').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
    $('#globalSearch').addEventListener('keydown',e=>{
      if(e.key!=='Enter') return;
      const q=e.target.value.trim(); if(!q) return;
      const hit=EXPERIMENTS.find(x=>x.name.toLowerCase()===q.toLowerCase())||EXPERIMENTS.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));
      if(hit){ e.target.value=''; this.open(hit.id); }
      else { this.state.q=q; this.state.cat='all'; this.go('lab'); this.renderLab(); }
    });
    document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#globalSearch').focus();} });
  },
  save(){ Store.write({scores:this.state.scores,obs:this.state.obs,activity:this.state.activity,theme:this.state.theme}); },
  closeMenu(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); },

  go(view){
    Sim.stop();
    $$('.view').forEach(v=>v.classList.remove('active'));
    const el=$('#v-'+view); if(el) el.classList.add('active');
    $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
    $$('.mnav button').forEach(b=>b.classList.toggle('active',b.dataset.mv===view));
    this.state.view=view; this.closeMenu();
    if(view==='progress') this.renderProgress();
    if(view==='home') this.renderHome();
    window.scrollTo({top:0,behavior:'smooth'});
  },

  setTheme(t){
    this.state.theme=t;
    document.documentElement.setAttribute('data-theme',t);
    const i=$('#themeIcon'); if(i) i.className='fas fa-'+(t==='dark'?'moon':'sun');
    Pal.refresh(); this.save();
  },
  toggleTheme(){ this.setTheme(this.state.theme==='dark'?'light':'dark'); },

  toast(msg,type='s'){
    const ic={s:'circle-check',e:'circle-exclamation',i:'circle-info'}[type];
    const t=document.createElement('div');
    t.className='toast '+type;
    t.innerHTML=`<i class="fas fa-${ic}"></i><span>${esc(msg)}</span>`;
    $('#toasts').appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),260);},2600);
  },
  log(icon,text,color){
    this.state.activity.unshift({icon,text,color,t:Date.now()});
    if(this.state.activity.length>30) this.state.activity.pop();
    this.save();
  }
};

/* ============================================================
   Canvas palette + drawing helpers
   ============================================================ */
const Pal={c:{},refresh(){
  const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue('--'+n).trim();
  this.c={accent:g('accent'),cyan:g('cyan'),amber:g('amber'),violet:g('violet'),rose:g('rose'),
    orange:g('orange'),grid:g('cv-grid'),ink:g('text'),mut:g('muted'),face:g('cv-face'),
    metal:g('cv-metal'),bg:g('bg2'),bd:g('border2'),dim:g('dim')};
}};
Pal.refresh();

/* canvas cannot parse color-mix(), so build rgba from a hex token */
function tint(c,a){
  if(!c) return `rgba(0,229,160,${a})`;
  c=c.trim();
  if(c[0]!=='#') return c;
  if(c.length===4) c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  const n=parseInt(c.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function Gfx(ctx,W,H){
  const C=Pal.c;
  return {
    ctx,W,H,C,
    clear(){ctx.clearRect(0,0,W,H);},
    grid(step=38){ctx.save();ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
      for(let x=step;x<W;x+=step){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);}
      for(let y=step;y<H;y+=step){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);}
      ctx.stroke();ctx.restore();},
    line(x1,y1,x2,y2,c,w=2,dash){ctx.save();ctx.strokeStyle=c||C.mut;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();},
    arrow(x1,y1,x2,y2,c,w=3,head=9){const a=Math.atan2(y2-y1,x2-x1);ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*head*.8,y2-Math.sin(a)*head*.8);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));
      ctx.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));ctx.closePath();ctx.fill();ctx.restore();},
    rect(x,y,w,h,o={}){ctx.save();const r=o.r||0;ctx.beginPath();
      if(r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
      else ctx.rect(x,y,w,h);
      if(o.f){ctx.fillStyle=o.f;ctx.fill();} if(o.s){ctx.strokeStyle=o.s;ctx.lineWidth=o.lw||2;ctx.stroke();} ctx.restore();},
    circle(x,y,r,f,s,lw=2,glow=0){ctx.save();if(glow){ctx.shadowColor=f||s;ctx.shadowBlur=glow;}
      ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,6.2832);
      if(f){ctx.fillStyle=f;ctx.fill();} if(s){ctx.shadowBlur=0;ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke();} ctx.restore();},
    text(t,x,y,o={}){ctx.save();ctx.fillStyle=o.c||C.ink;
      ctx.font=`${o.b?'700 ':''}${o.s||12}px ${o.m?"'JetBrains Mono',monospace":"'Space Grotesk',sans-serif"}`;
      ctx.textAlign=o.a||'center';ctx.textBaseline=o.vb||'alphabetic';ctx.fillText(t,x,y);ctx.restore();},
    poly(pts,f,s,lw=2,close=true){if(pts.length<2)return;ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]); if(close)ctx.closePath();
      if(f){ctx.fillStyle=f;ctx.fill();} if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();} ctx.restore();},
    path(pts,c,w=2,glow=0){if(pts.length<2)return;ctx.save();if(glow){ctx.shadowColor=c;ctx.shadowBlur=glow;}
      ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
      ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();},
    spring(x1,y1,x2,y2,coils=12,amp=13,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
      const pts=[[x1,y1]];const n=coils*2;
      for(let i=1;i<n;i++){const t=i/n,s=(i%2?1:-1)*amp;pts.push([x1+ux*L*t+px*s,y1+uy*L*t+py*s]);}
      pts.push([x2,y2]);this.path(pts,c||C.metal,2.4);},
    label(t,x,y,c){const w=ctx.measureText?0:0;this.text(t,x,y,{c:c||C.mut,s:11,m:true});},
    /* mini plotting frame used by many engines */
    plot(o){
      const x0=o.x,y0=o.y,w=o.w,h=o.h;
      this.rect(x0,y0,w,h,{f:o.bg||'transparent',s:C.grid,lw:1});
      const xm=o.xmin,xM=o.xmax,ym=o.ymin,yM=o.ymax;
      const X=v=>x0+((v-xm)/((xM-xm)||1))*w, Y=v=>y0+h-((v-ym)/((yM-ym)||1))*h;
      // gridlines
      for(let i=1;i<5;i++){this.line(x0,y0+h*i/5,x0+w,y0+h*i/5,C.grid,1);this.line(x0+w*i/5,y0,x0+w*i/5,y0+h,C.grid,1);}
      // axes (include zero lines if inside range)
      const zx=(0>=xm&&0<=xM)?X(0):x0, zy=(0>=ym&&0<=yM)?Y(0):y0+h;
      this.line(x0,zy,x0+w,zy,C.bd,1.6); this.line(zx,y0,zx,y0+h,C.bd,1.6);
      (o.series||[]).forEach(s=>{
        const pts=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map(p=>[X(p[0]),Y(p[1])]);
        if(s.dots) pts.forEach(p=>this.circle(p[0],p[1],s.r||4,s.c,null,0,8));
        else this.path(pts,s.c,s.w||2.4,s.glow||0);
      });
      (o.marks||[]).forEach(m=>{ this.circle(X(m[0]),Y(m[1]),m[3]||5,m[2],null,0,10); });
      if(o.xlab) this.text(o.xlab,x0+w/2,y0+h+22,{c:C.mut,s:11});
      if(o.ylab){ctx.save();ctx.translate(x0-30,y0+h/2);ctx.rotate(-Math.PI/2);this.text(o.ylab,0,0,{c:C.mut,s:11});ctx.restore();}
      this.text(fmt(xM),x0+w,y0+h+13,{c:C.dim,s:10,a:'right',m:true});
      this.text(fmt(xm),x0,y0+h+13,{c:C.dim,s:10,a:'left',m:true});
      this.text(fmt(yM),x0-6,y0+8,{c:C.dim,s:10,a:'right',m:true});
      this.text(fmt(ym),x0-6,y0+h,{c:C.dim,s:10,a:'right',m:true});
      if(o.title) this.text(o.title,x0+w/2,y0-10,{c:C.ink,s:12,b:true});
      return {X,Y};
    }
  };
}

/* control descriptors */
const C=(k,l,min,max,v,st,u)=>({k,l,min,max,v,st:st||1,u:u||''});
const SEL=(k,l,opts,v)=>({k,l,opts,v:v!==undefined?v:opts[0]});
const R=(l,v,u)=>({l,v,u:u||''});

/* ============================================================
   Simulation runner
   ============================================================ */
const Sim={
  raf:null,def:null,p:{},s:{},paused:false,speed:1,canvas:null,ctx:null,last:0,acc:0,exp:null,ro:null,
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=null;
    if(this._ro){this._ro.disconnect();this._ro=null;} this.def=null; },
  mount(exp){
    this.stop();
    const def=ENGINES[exp.sim]||ENGINES.generic;
    this.def=def; this.exp=exp; this.paused=false; this.speed=1;
    const cv=$('#stage'); if(!cv) return;
    this.canvas=cv; this.ctx=cv.getContext('2d');
    // params
    this.p={};
    (def.c||[]).forEach(c=>{ this.p[c.k]= (exp.ov&&exp.ov[c.k]!==undefined)? exp.ov[c.k] : c.v; });
    if(exp.ov) Object.keys(exp.ov).forEach(k=>{ if(this.p[k]===undefined) this.p[k]=exp.ov[k]; });
    this.p._name=exp.name;
    this.s=def.init?def.init(this.p):{}; this.s.t=0;
    this.buildPanel(def,exp);
    const fit=()=>{ const dpr=Math.min(2,window.devicePixelRatio||1);
      const r=cv.getBoundingClientRect();
      cv.width=Math.max(320,r.width*dpr); cv.height=Math.max(260,r.height*dpr);
      this.ctx.setTransform(dpr,0,0,dpr,0,0); this.W=cv.width/dpr; this.H=cv.height/dpr; };
    fit(); this._ro=new ResizeObserver(fit); this._ro.observe(cv);
    cv.onpointerdown=e=>this.pointer(e,'down'); cv.onpointermove=e=>this.pointer(e,'move');
    cv.onpointerup=e=>this.pointer(e,'up'); cv.onpointerleave=e=>this.pointer(e,'up');
    this.last=performance.now(); this.acc=0;
    const loop=ts=>{
      this.raf=requestAnimationFrame(loop);
      let dt=(ts-this.last)/1000; this.last=ts; if(!isFinite(dt)||dt<=0) dt=1/60; dt=Math.min(dt,0.05);
      if(!this.paused){ const d=dt*this.speed; if(this.def.step) this.def.step(this.s,this.p,d); this.s.t+=d; }
      const g=Gfx(this.ctx,this.W,this.H); g.clear();
      if(this.def.grid!==false) g.grid();
      try{ this.def.draw(g,this.p,this.s); }catch(err){ g.text('Simulation error: '+err.message,this.W/2,this.H/2,{c:Pal.c.rose,s:13}); }
      this.acc+=dt; if(this.acc>0.12){ this.acc=0; this.updateReadout(); }
    };
    this.raf=requestAnimationFrame(loop);
    this.updateReadout();
  },
  pointer(e,type){
    if(!this.def||!this.def.pointer) return;
    const r=this.canvas.getBoundingClientRect();
    this.def.pointer(this.s,this.p,e.clientX-r.left,e.clientY-r.top,type,this);
  },
  buildPanel(def,exp){
    const box=$('#ctrls'); if(!box) return;
    box.innerHTML='<h3><i class="fas fa-sliders"></i>Lab controls</h3>';
    (def.c||[]).forEach(c=>{
      const g=document.createElement('div'); g.className='cg';
      if(c.opts){
        g.innerHTML=`<div class="lb"><span>${c.l}</span></div><select>${c.opts.map(o=>`<option ${o===this.p[c.k]?'selected':''}>${o}</option>`).join('')}</select>`;
        g.querySelector('select').onchange=e=>{ this.p[c.k]=e.target.value; if(def.onset)def.onset(this.s,this.p,c.k); else if(def.resetOnChange) this.reset(); };
      } else {
        g.innerHTML=`<div class="lb"><span>${c.l}</span><b>${fmt(this.p[c.k])}${c.u}</b></div>
          <input type="range" min="${c.min}" max="${c.max}" step="${c.st}" value="${this.p[c.k]}">`;
        const out=g.querySelector('b');
        g.querySelector('input').addEventListener('input',e=>{
          this.p[c.k]=parseFloat(e.target.value); out.textContent=fmt(this.p[c.k])+c.u;
          if(def.onset) def.onset(this.s,this.p,c.k); else if(def.resetOnChange) this.reset();
        });
      }
      box.appendChild(g);
    });
    const btns=document.createElement('div'); btns.className='cbtns';
    btns.innerHTML=`<button class="cbtn p" onclick="Lab.capture()"><i class="fas fa-camera"></i>Record</button>
      <button class="cbtn" onclick="Sim.reset()"><i class="fas fa-rotate-left"></i>Reset</button>`;
    box.appendChild(btns);
    const ro=document.createElement('div'); ro.className='ro'; ro.id='readout'; ro.innerHTML='<h4>Live measurements</h4>';
    box.appendChild(ro);
    if(def.note){ const n=document.createElement('p'); n.style.cssText='font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.55'; n.textContent=def.note; box.appendChild(n); }
  },
  reset(){ if(!this.def) return; this.s=this.def.init?this.def.init(this.p):{}; this.s.t=0; },
  readings(){ if(!this.def||!this.def.read) return []; try{ return this.def.read(this.p,this.s)||[]; }catch(e){ return []; } },
  updateReadout(){
    const el=$('#readout'); if(!el) return;
    el.innerHTML='<h4>Live measurements</h4>'+this.readings().map(r=>
      `<div class="r"><span>${r.l}</span><b>${typeof r.v==='number'?fmt(r.v):esc(r.v)}${r.u?' '+r.u:''}</b></div>`).join('');
  },
  togglePlay(){ this.paused=!this.paused; const b=$('#playBtn'); if(b) b.innerHTML=`<i class="fas fa-${this.paused?'play':'pause'}"></i>`; },
  setSpeed(){ this.speed=this.speed===1?2:this.speed===2?0.25:1; const b=$('#spdBtn'); if(b) b.textContent=this.speed+'×'; }
};

const ENGINES={};

ENGINES.kinematics={
  c:[C('u','Initial velocity',-20,30,5,0.5,' m/s'),C('a','Acceleration',-8,8,2,0.1,' m/s²'),C('T','Run time',2,14,8,0.5,' s')],

    for(let i=0;i<=120;i++){const tt=p.T*i/120;pts.push([tt,p.u*tt+.5*p.a*tt*tt]);vp.push([tt,p.u+p.a*tt]);}

      series:[{pts:vp,c:g.C.cyan}],marks:[[t,v,g.C.amber]],title:'Velocity vs time',xlab:'t (s)',ylab:'v (m/s)'});
  },
  read(p,s){const t=s.t;return [R('Time',t,'s'),R('Velocity',p.u+p.a*t,'m/s'),R('Displacement',p.u*t+.5*p.a*t*t,'m'),
    R('Acceleration',p.a,'m/s²'),R('Distance at T',Math.abs(p.u*p.T+.5*p.a*p.T*p.T),'m')];},
  note:'Slope of the x–t curve is velocity; slope of the v–t curve is acceleration.'
};

ENGINES.projectile={
  c:[C('v0','Launch speed',5,80,35,1,' m/s'),C('ang','Launch angle',5,85,45,1,'°'),

  note:'Record several angles at one speed, then plot range against angle — the peak sits at 45° when h₀ = 0.'
};
function flightTime(p){const vy=p.v0*Math.sin(p.ang*Math.PI/180);return (vy+Math.sqrt(vy*vy+2*p.g*p.h0))/p.g;}

ENGINES.newton={
  c:[C('F','Applied force',0,120,30,1,' N'),C('m','Mass',0.5,25,5,0.5,' kg'),
     C('mu','Friction coefficient',0,1,0.2,0.01),C('g','Gravity',1.6,20,9.81,0.01,' m/s²')],
  init:()=>({x:0,v:0}),
  step(s,p,dt){
    const N=p.m*p.g, fs=p.mu*N;
    let a;
    if(Math.abs(s.v)<1e-3 && p.F<=fs){ a=0; s.v=0; }
    else a=(p.F-Math.sign(s.v||1)*fs)/p.m;
    s.v=Math.max(0,s.v+a*dt); s.x+=s.v*dt; if(s.x>60) s.x=0;
    s.a=a;
  },
  draw(g,p,s){
    const gy=g.H-90, side=34+p.m*2.4, sc=(g.W-180)/60;
    g.rect(0,gy,g.W,g.H-gy,{f:'rgba(34,211,238,.06)'}); g.line(0,gy,g.W,gy,g.C.cyan,2);
    for(let x=-((s.x*sc)%30);x<g.W;x+=30) g.line(x,gy,x-9,gy+11,g.C.grid,2);
    const bx=70+s.x*sc, by=gy-side;
    g.rect(bx,by,side,side,{f:g.C.face,s:g.C.cyan,lw:2,r:4});
    g.text(p.m+' kg',bx+side/2,by+side/2+4,{c:g.C.cyan,s:12,b:true,m:true});
    if(p.F>0){ g.arrow(bx+side,by+side/2,bx+side+p.F*1.6,by+side/2,g.C.amber,3); g.text('F = '+p.F+' N',bx+side+p.F*.8,by+side/2-12,{c:g.C.amber,s:11,m:true}); }
    const fr=p.mu*p.m*p.g;
    if(fr>0){ g.arrow(bx,gy-4,bx-Math.min(fr*1.6,120),gy-4,g.C.rose,3); g.text('f = '+fmt(fr)+' N',bx-Math.min(fr*.8,60),gy+20,{c:g.C.rose,s:11,m:true}); }
    g.arrow(bx+side/2,by+side/2,bx+side/2,by+side/2+Math.min(p.m*p.g,90),g.C.violet,2.2,7);
    g.arrow(bx+side/2,gy,bx+side/2,gy-Math.min(p.m*p.g,90),g.C.accent,2.2,7);
    g.text('Free-body: applied F, friction f, weight mg, normal N',g.W/2,26,{c:g.C.mut,s:12});
  },
  read(p,s){const fr=p.mu*p.m*p.g,net=Math.max(0,p.F-fr);
    return [R('Applied force',p.F,'N'),R('Friction force',fr,'N'),R('Net force',net,'N'),
      R('Acceleration',net/p.m,'m/s²'),R('Velocity',s.v||0,'m/s'),R('Mass',p.m,'kg')];},
  note:'Hold the force steady and step the mass up: a plot of a against 1/m is a straight line through the origin.'
};

ENGINES.incline={
  c:[C('th','Incline angle',0,60,25,1,'°'),C('m','Mass',0.5,20,4,0.5,' kg'),
     C('mu','Friction coefficient',0,1.2,0.25,0.01),C('g','Gravity',1.6,20,9.81,0.01,' m/s²')],
  init:()=>({d:0,v:0}),
  step(s,p,dt){
    const r=p.th*Math.PI/180, driving=p.m*p.g*Math.sin(r), maxStatic=p.mu*p.m*p.g*Math.cos(r);
    let a=0;
    if(s.v>1e-4||driving>maxStatic) a=(driving-maxStatic*Math.sign(s.v||1))/p.m;
    s.v=Math.max(0,s.v+a*dt); s.d+=s.v*dt; s.a=a;
    if(s.d>10){s.d=0;s.v=0;}
  },
  draw(g,p,s){
    const r=p.th*Math.PI/180, ox=70, oy=g.H-70, L=Math.min(g.W-160,(g.H-140)/Math.max(Math.tan(r),.12));
    const tx=ox+L*Math.cos(r), ty=oy-L*Math.sin(r);
    g.poly([[ox,oy],[tx,oy],[tx,ty]],'rgba(34,211,238,.08)',g.C.cyan,2);
    g.text(p.th+'°',ox+40,oy-8,{c:g.C.cyan,s:12,m:true});
    const f=1-clamp(s.d/10,0,1), bx=ox+(tx-ox)*f, by=oy+(ty-oy)*f, side=30+p.m*1.6;
    g.ctx.save(); g.ctx.translate(bx,by); g.ctx.rotate(-r);
    g.rect(-side/2,-side,side,side,{f:g.C.face,s:g.C.accent,lw:2,r:4});
    g.text(p.m+' kg',0,-side/2+4,{c:g.C.accent,s:11,b:true,m:true});
    g.ctx.restore();
    const W=p.m*p.g, comp=Math.min(W*Math.sin(r)*1.4,110), N=Math.min(W*Math.cos(r)*1.4,110);
    g.arrow(bx,by-side/2,bx+comp*Math.cos(r),by-side/2+comp*Math.sin(r),g.C.amber,2.6,8);
    g.arrow(bx,by-side/2,bx+N*Math.sin(r),by-side/2-N*Math.cos(r),g.C.violet,2.2,7);
    const fr=Math.min(p.mu*W*Math.cos(r)*1.4,110);
    if(fr>1) g.arrow(bx,by-side/2,bx-fr*Math.cos(r),by-side/2-fr*Math.sin(r),g.C.rose,2.2,7);
    g.text('mg sinθ drives, μmg cosθ resists',g.W/2,26,{c:g.C.mut,s:12});
  },
  read(p,s){const r=p.th*Math.PI/180,W=p.m*p.g,dr=W*Math.sin(r),fr=p.mu*W*Math.cos(r);
    return [R('Driving force',dr,'N'),R('Max friction',fr,'N'),R('Normal force',W*Math.cos(r),'N'),
      R('Acceleration',Math.max(0,(dr-fr)/p.m),'m/s²'),R('Speed',s.v||0,'m/s'),
      R('State',dr>fr?'Sliding':'At rest')];},
  note:'Raise the angle until the block just slips: tan of that angle equals μ.'
};

ENGINES.atwood={
  c:[C('m1','Left mass',0.1,10,2,0.1,' kg'),C('m2','Right mass',0.1,10,3,0.1,' kg'),C('g','Gravity',1.6,20,9.81,0.01,' m/s²')],
  init:()=>({y:0,v:0}),
  step(s,p,dt){ const a=(p.m2-p.m1)*p.g/(p.m1+p.m2); s.v+=a*dt; s.y+=s.v*dt;
    if(Math.abs(s.y)>1.6){ s.y=Math.sign(s.y)*1.6; s.v=0; } s.a=a; },
  draw(g,p,s){
    const cx=g.W/2, py=70, sc=70, arm=90;
    g.circle(cx,py,26,g.C.face,g.C.metal,3); g.circle(cx,py,5,g.C.metal);

    g.ctx.save();g.ctx.beginPath();g.ctx.arc(cx,py,26,Math.PI,0);g.ctx.strokeStyle=g.C.metal;g.ctx.lineWidth=2;g.ctx.stroke();g.ctx.restore();
    const b=(x,y,m,c)=>{const w=30+m*4;g.rect(x-w/2,y,w,w*.7,{f:g.C.face,s:c,lw:2,r:4});
      g.text(m+' kg',x,y+w*.45,{c,s:11,b:true,m:true});};
    b(cx-arm,y1,p.m1,g.C.cyan); b(cx+arm,y2,p.m2,g.C.accent);
    const a=(p.m2-p.m1)*p.g/(p.m1+p.m2);
    g.text('a = (m₂ − m₁)g / (m₁ + m₂) = '+fmt(a)+' m/s²',g.W/2,g.H-26,{c:g.C.mut,s:12,m:true});
  },
  read(p,s){const a=(p.m2-p.m1)*p.g/(p.m1+p.m2),T=2*p.m1*p.m2*p.g/(p.m1+p.m2);
    return [R('Acceleration',Math.abs(a),'m/s²'),R('Tension',T,'N'),R('Speed',Math.abs(s.v||0),'m/s'),
      R('Mass difference',Math.abs(p.m2-p.m1),'kg'),R('Total mass',p.m1+p.m2,'kg')];},
  note:'An Atwood machine slows gravity down so g can be measured from a small acceleration.'
};

ENGINES.energy={
  c:[C('h','Release height',0.5,8,5,0.1,' m'),C('m','Mass',0.5,10,2,0.1,' kg'),
     C('fr','Track friction',0,0.3,0,0.01),C('g','Gravity',1.6,20,9.81,0.01,' m/s²')],
  init:p=>({x:-1,v:0,E:p.m*p.g*p.h}),
  onset(s,p,k){ if(k==='h'||k==='m'||k==='g'){ s.x=-1; s.v=0; s.E=p.m*p.g*p.h; } },
  step(s,p,dt){
    const prof=x=>p.h*Math.min(1,x*x);           // valley shaped track, x in [-1,1]
    const slope=x=>2*p.h*x;
    const x=s.x, dy=slope(x);
    const a=-p.g*dy/(1+dy*dy)-p.fr*s.v*4;
    s.v+=a*dt; s.x+=s.v*dt*0.5;

ENGINES.collision={
  c:[C('m1','Mass A',0.2,10,2,0.1,' kg'),C('u1','Velocity A',-8,8,3,0.1,' m/s'),
     C('m2','Mass B',0.2,10,3,0.1,' kg'),C('u2','Velocity B',-8,8,-1,0.1,' m/s'),
     C('e','Restitution (1 = elastic)',0,1,1,0.05)],
  resetOnChange:true,
  init:p=>({x1:-4,x2:4,v1:p.u1,v2:p.u2,hit:false}),
  step(s,p,dt){
    s.x1+=s.v1*dt; s.x2+=s.v2*dt;
    if(!s.hit && s.x2-s.x1<1.2){
      const {m1,m2,e}=p, u1=s.v1,u2=s.v2;
      s.v1=((m1-e*m2)*u1+(1+e)*m2*u2)/(m1+m2);
      s.v2=((m2-e*m1)*u2+(1+e)*m1*u1)/(m1+m2);
      s.hit=true; s.flash=1;

    if(s.x1<-9||s.x2>9){ s.x1=-4;s.x2=4;s.v1=p.u1;s.v2=p.u2;s.hit=false; }
    s.flash=Math.max(0,(s.flash||0)-dt*2);

    cart(s.x1,p.m1,s.v1,g.C.cyan,'A'); cart(s.x2,p.m2,s.v2,g.C.accent,'B');
    if(s.flash>0) g.circle(cx+(s.x1+s.x2)/2*sc,cy,40*s.flash,`rgba(251,191,36,${s.flash*.4})`);
    const P=p.m1*s.v1+p.m2*s.v2, K=.5*p.m1*s.v1**2+.5*p.m2*s.v2**2;
    const P0=p.m1*p.u1+p.m2*p.u2, K0=.5*p.m1*p.u1**2+.5*p.m2*p.u2**2;
    g.text('momentum before '+fmt(P0)+'  ·  after '+fmt(P)+'  kg·m/s',g.W/2,36,{c:g.C.mut,s:12,m:true});

  },
  read(p,s){const P=p.m1*s.v1+p.m2*s.v2,K=.5*p.m1*s.v1**2+.5*p.m2*s.v2**2;

      R('Kinetic energy',K,'J'),R('Energy lost',(.5*p.m1*p.u1**2+.5*p.m2*p.u2**2)-K,'J'),R('Restitution',p.e)];},
  note:'Momentum stays constant for every restitution value; kinetic energy only survives when e = 1.'

ENGINES.rolling={

ENGINES.orbit={

  step(s,p,dt){

    const pts=[]; for(let i=0;i<=40;i++){const e=i/40*0.004;pts.push([e*100,Math.min(e,0.002)*Y/1e6+(e>0.002?(e-0.002)*Y*0.06/1e6:0)]);}

function youngY(m){return {Steel:2.0e11,Copper:1.1e11,Aluminium:0.69e11,Brass:0.97e11,Nylon:3e9}[m]||2e11;}

ENGINES.viscosity={
  c:[C('r','Sphere radius',0.5,8,3,0.1,' mm'),C('rs','Sphere density',1200,11000,7800,50,' kg/m³'),
     C('rl','Liquid density',700,1600,1260,10,' kg/m³'),C('eta','Viscosity',0.05,3,1.0,0.01,' Pa·s')],
  init:()=>({y:0,v:0}),
  step(s,p,dt){
    const r=p.r/1000, m=p.rs*4/3*Math.PI*r**3;
    const W=m*9.81, B=p.rl*4/3*Math.PI*r**3*9.81, D=6*Math.PI*p.eta*r*s.v;
    s.v+=((W-B-D)/m)*dt; s.y+=s.v*dt; if(s.y>0.5){s.y=0;s.v=0;}
  },
  draw(g,p,s){
    const tubeW=130,cx=g.W/2-60,top=50,hgt=g.H-110;
    g.rect(cx-tubeW/2,top,tubeW,hgt,{f:'rgba(251,146,60,.10)',s:g.C.bd,lw:2,r:6});
    for(let i=1;i<5;i++){const y=top+hgt*i/5;g.line(cx-tubeW/2,y,cx-tubeW/2+16,y,g.C.mut,1.5);
      g.text((i*10)+' cm',cx-tubeW/2-6,y+4,{c:g.C.dim,s:10,a:'right',m:true});}
    const y=top+20+clamp(s.y/0.5,0,1)*(hgt-50);
    g.circle(cx,y,4+p.r*1.6,g.C.metal,g.C.ink,1.5);
    g.arrow(cx,y,cx,y+Math.min(s.v*140,60),g.C.amber,2,7);
    const vt=2*(p.r/1000)**2*(p.rs-p.rl)*9.81/(9*p.eta);
    g.text('terminal velocity '+fmt(vt)+' m/s',g.W/2,30,{c:g.C.mut,s:12,m:true});
    g.text('v grows until 6πηrv balances weight − upthrust',g.W/2,g.H-24,{c:g.C.dim,s:11});
  },
  read(p,s){const r=p.r/1000,vt=2*r*r*(p.rs-p.rl)*9.81/(9*p.eta);
    return [R('Terminal velocity',vt,'m/s'),R('Current speed',s.v||0,'m/s'),
      R('Weight',p.rs*4/3*Math.PI*r**3*9.81,'N'),R('Upthrust',p.rl*4/3*Math.PI*r**3*9.81,'N'),
      R('Drag at terminal',6*Math.PI*p.eta*r*vt,'N'),R('Viscosity',p.eta,'Pa·s')];},
  note:"Stokes' law: terminal velocity scales with the square of the radius."
};

ENGINES.buoyancy={
  c:[C('rho','Object density',100,4000,600,10,' kg/m³'),C('rl','Fluid density',600,2000,1000,10,' kg/m³'),
     C('V','Object volume',100,2000,800,10,' cm³'),C('g','Gravity',1.6,20,9.81,0.01,' m/s²')],
  init:()=>({y:0,v:0}),
  step(s,p,dt){
    const V=p.V*1e-6, m=p.rho*V;
    const sub=clamp(s.y,0,1);
    const Fb=p.rl*V*sub*p.g, a=(Fb-m*p.g)/m-s.v*3;
    s.v+=a*dt*0.6; s.y=clamp(s.y+s.v*dt,0,1.6);
  },
  draw(g,p,s){
    const wl=g.H*0.38, side=Math.cbrt(p.V)*5.2;
    g.rect(0,wl,g.W,g.H-wl,{f:'rgba(34,211,238,.16)'}); g.line(0,wl,g.W,wl,g.C.cyan,2);
    for(let i=0;i<6;i++) g.line(40+i*((g.W-80)/5),wl+8,40+i*((g.W-80)/5),g.H-8,g.C.grid,1);
    const sub=clamp(s.y,0,1), floats=p.rho<p.rl;
    const topY=wl-side*(1-sub), cx=g.W/2;
    const col=floats?g.C.accent:g.C.rose;
    g.rect(cx-side/2,topY,side,side,{f:tint(col,.32),s:col,lw:2,r:4});
    g.text(fmt(p.rho)+' kg/m³',cx,topY+side/2+4,{c:col,s:11,b:true,m:true});
    const V=p.V*1e-6,W=p.rho*V*p.g,Fb=p.rl*V*sub*p.g;
    g.arrow(cx,topY+side/2,cx,topY+side/2+Math.min(W*8,80),g.C.violet,2.4,8);
    g.arrow(cx,topY+side/2,cx,topY+side/2-Math.min(Fb*8,80),g.C.cyan,2.4,8);
    g.text('weight '+fmt(W)+' N',cx+side,topY+side/2+40,{c:g.C.violet,s:11,a:'left',m:true});
    g.text('upthrust '+fmt(Fb)+' N',cx+side,topY+side/2-40,{c:g.C.cyan,s:11,a:'left',m:true});
    g.text(floats?'Floats — it sinks until upthrust equals weight':'Sinks — upthrust can never match its weight',
      g.W/2,28,{c:g.C.mut,s:12});
  },
  read(p,s){const V=p.V*1e-6,W=p.rho*V*p.g,sub=clamp(s.y,0,1);
    return [R('Weight',W,'N'),R('Upthrust',p.rl*V*sub*p.g,'N'),R('Submerged fraction',sub*100,'%'),
      R('Displaced volume',p.V*sub,'cm³'),R('Apparent weight',Math.max(0,W-p.rl*V*sub*p.g),'N'),
      R('Result',p.rho<p.rl?'Floats':'Sinks')];},
  note:'A floating body settles with submerged fraction equal to the density ratio ρ_object/ρ_fluid.'
};

ENGINES.bernoulli={
  c:[C('Q','Flow rate',1,40,12,0.5,' L/s'),C('d1','Wide diameter',6,24,16,0.5,' cm'),
     C('d2','Throat diameter',2,18,7,0.5,' cm'),C('P1','Inlet pressure',100,400,200,5,' kPa'),
     C('rho','Fluid density',700,1400,1000,10,' kg/m³')],
  draw(g,p,s){
    const A1=Math.PI*(p.d1/200)**2, A2=Math.PI*(p.d2/200)**2, Q=p.Q/1000;
    const v1=Q/A1, v2=Q/A2, P2=p.P1*1000+0.5*p.rho*(v1*v1-v2*v2);
    const cy=g.H/2+20, h1=p.d1*4, h2=p.d2*4, L=g.W-120, x0=60;
    const prof=x=>{const t=clamp((x-0.3)/0.4,0,1), sm=t*t*(3-2*t);
      return x<0.3?h1:x>0.7?h1:h1+(h2-h1)*Math.sin(Math.PI*clamp((x-0.3)/0.4,0,1));};
    const top=[],bot=[];
    for(let i=0;i<=100;i++){const x=i/100,h=prof(x);top.push([x0+x*L,cy-h/2]);bot.push([x0+x*L,cy+h/2]);}
    g.path(top,g.C.bd,3); g.path(bot,g.C.bd,3);
    g.poly([...top,...bot.reverse()],'rgba(34,211,238,.13)',null);
    for(let i=0;i<26;i++){
      const ph=((s.t*0.35+i/26)%1), h=prof(ph), sp=h1/h;
      g.circle(x0+ph*L,cy+Math.sin(i*2.1)*h*0.28,3,`rgba(0,229,160,${.35+.5*sp/3})`);}
    const man=(x,P,lab,c)=>{const hh=clamp(P/1000/4,10,150);
      g.rect(x-7,cy-prof((x-x0)/L)/2-hh,14,hh,{f:'rgba(251,191,36,.25)',s:c,lw:1.5});
      g.text(fmt(P/1000)+' kPa',x,cy-prof((x-x0)/L)/2-hh-8,{c,s:11,m:true});
      g.text(lab,x,cy+prof((x-x0)/L)/2+20,{c:g.C.mut,s:11});};
    man(x0+L*0.14,p.P1*1000,'wide section',g.C.amber);
    man(x0+L*0.5,P2,'throat',P2<0?g.C.rose:g.C.accent);
    g.text('Faster flow at the throat means lower pressure',g.W/2,30,{c:g.C.mut,s:12});
  },
  read(p){const A1=Math.PI*(p.d1/200)**2,A2=Math.PI*(p.d2/200)**2,Q=p.Q/1000,v1=Q/A1,v2=Q/A2;
    return [R('Wide-section speed',v1,'m/s'),R('Throat speed',v2,'m/s'),R('Inlet pressure',p.P1,'kPa'),
      R('Throat pressure',(p.P1*1000+.5*p.rho*(v1*v1-v2*v2))/1000,'kPa'),
      R('Pressure drop',(.5*p.rho*(v2*v2-v1*v1))/1000,'kPa'),R('Flow rate',p.Q,'L/s')];},
  note:'Continuity fixes the speeds, Bernoulli converts the speed difference into a pressure difference.'
};

ENGINES.gaslaw={

      g.plot({x:g.W-250,y:80,w:190,h:g.H-190,xmin:0,xmax:60,ymin:0,ymax:400,series:[{pts,c:g.C.cyan}],

    else { for(let i=0;i<=60;i++){const tt=100+i*13.3;pts.push([tt,p.mode==="Gay-Lussac (V fixed)"?p.n*Rg*tt/(p.Vf/1000)/1000:p.n*Rg*tt/P*1000]);}

ENGINES.kinetic={
  c:[C('T','Temperature',50,1200,300,5,' K'),C('N','Particles',10,160,60,1),
     C('M','Molar mass',2,60,29,1,' g/mol')],
  resetOnChange:false,
  init:p=>({parts:Array.from({length:160},()=>({x:Math.random(),y:Math.random(),a:Math.random()*6.283})),hits:0}),
  step(s,p,dt){
    const v=Math.sqrt(3*8.314*p.T/(p.M/1000))/900;
    s.parts.forEach(q=>{
      q.x+=Math.cos(q.a)*v*dt; q.y+=Math.sin(q.a)*v*dt;
      if(q.x<0||q.x>1){q.a=Math.PI-q.a;q.x=clamp(q.x,0,1);s.hits++;}
      if(q.y<0||q.y>1){q.a=-q.a;q.y=clamp(q.y,0,1);s.hits++;}
    });
  },
  draw(g,p,s){
    const bx=60,by=70,bw=Math.min(g.W*0.5,g.H-140),bh=bw;
    g.rect(bx,by,bw,bh,{s:g.C.metal,lw:3,r:4});
    const speedColor=t=>t<300?g.C.cyan:t<700?g.C.accent:g.C.rose;
    for(let i=0;i<p.N;i++){const q=s.parts[i];
      g.circle(bx+q.x*bw,by+q.y*bh,3.2,speedColor(p.T));}
    const vrms=Math.sqrt(3*8.314*p.T/(p.M/1000));
    const pts=[]; for(let i=0;i<=80;i++){const v=i/80*2200, m=p.M/1000,k=1.380649e-23,Na=6.022e23;
      const f=4*Math.PI*v*v*Math.pow(m/(2*Math.PI*8.314*p.T),1.5)*Math.exp(-m*v*v/(2*8.314*p.T));
      pts.push([v,f*1000]);}
    g.plot({x:bx+bw+80,y:by+10,w:Math.max(150,g.W-bx-bw-140),h:bh-40,xmin:0,xmax:2200,ymin:0,
      ymax:Math.max(...pts.map(q=>q[1]))*1.15,series:[{pts,c:g.C.amber}],marks:[[vrms,0,g.C.accent,5]],
      title:'Maxwell speed distribution',xlab:'speed (m/s)'});
    g.text('Temperature is molecular kinetic energy: v_rms = '+fmt(vrms)+' m/s',g.W/2,34,{c:g.C.mut,s:12,m:true});
  },
  read(p,s){const vrms=Math.sqrt(3*8.314*p.T/(p.M/1000));
    return [R('RMS speed',vrms,'m/s'),R('Mean speed',Math.sqrt(8*8.314*p.T/(Math.PI*p.M/1000)),'m/s'),
      R('Most probable speed',Math.sqrt(2*8.314*p.T/(p.M/1000)),'m/s'),
      R('Average KE per molecule',1.5*1.380649e-23*p.T,'J'),R('Temperature',p.T,'K'),
      R('Wall collisions',s.hits||0)];},
  note:'Average kinetic energy is (3/2)kT and does not depend on the gas — only the speeds do.'
};

ENGINES.heattransfer={

    return [R('Conductivity k',k,'W/m·K'),R('Temperature gradient',(p.Th-p.Tc)/p.L,'K/m'),
      R('Heat current',rate,'W'),R('Energy in 1 minute',rate*60,'J'),
      R('Thermal resistance',p.L/(k*p.A*1e-4),'K/W')];},

ENGINES.cooling={
  c:[C('T0','Initial temperature',30,200,90,1,' °C'),C('Ts','Surrounding temperature',-10,60,25,1,' °C'),

    g.text(fmt(T,1)+' °C',bx+bw/2,by-12,{c:g.C.amber,s:13,b:true,m:true});

    g.plot({x:bx+bw+80,y:80,w:g.W-bx-bw-150,h:bh,xmin:0,xmax:p.span,ymin:Math.min(p.Ts,p.T0)-5,ymax:Math.max(p.Ts,p.T0)+5,
      series:[{pts,c:g.C.accent}],marks:[[s.t,T,g.C.amber,6]],title:"Newton's law of cooling",xlab:'t (s)',ylab:'T (°C)'});
  },

  note:'Plot ln(T − T_room) against time: a straight line proves the exponential law and its slope is −k.'

ENGINES.calorimetry={
  c:[C('m1','Hot mass',10,500,150,5,' g'),C('T1','Hot temperature',30,200,90,1,' °C'),
     C('m2','Cold mass',10,500,200,5,' g'),C('T2','Cold temperature',-5,60,20,1,' °C'),
     SEL('s1','Hot substance','Water,Copper,Aluminium,Iron,Glass'.split(',')),
     SEL('s2','Cold substance','Water,Copper,Aluminium,Iron,Glass'.split(','))],
  draw(g,p,s){
    const cp={Water:4186,Copper:385,Aluminium:900,Iron:450,Glass:840};
    const c1=cp[p.s1],c2=cp[p.s2];
    const Tf=(p.m1*c1*p.T1+p.m2*c2*p.T2)/(p.m1*c1+p.m2*c2);
    const mix=clamp((s.t%8)/4,0,1), show=mix<1;
    const cup=(x,lab,T,m,c)=>{const w=110,h=130,y=g.H/2-40;
      g.poly([[x-w/2,y],[x+w/2,y],[x+w/2-12,y+h],[x-w/2+12,y+h]],'rgba(148,163,184,.12)',g.C.metal,2);
      const f=clamp(m/500,.15,1);
      g.poly([[x-w/2+6,y+h-h*f],[x+w/2-6,y+h-h*f],[x+w/2-12,y+h-2],[x-w/2+12,y+h-2]],c,null);
      g.text(lab,x,y-30,{c:g.C.mut,s:12});
      g.text(fmt(T,1)+' °C',x,y-12,{c:g.C.ink,s:13,b:true,m:true});};
    const heat=T=>`rgba(${Math.round(60+2*clamp(T,0,100))},${Math.round(120-0.4*clamp(T,0,100))},${Math.round(220-1.6*clamp(T,0,100))},.55)`;
    if(show){ cup(g.W/2-150,p.s1+' '+p.m1+' g',p.T1,p.m1,heat(p.T1));
      cup(g.W/2+150,p.s2+' '+p.m2+' g',p.T2,p.m2,heat(p.T2));
      g.arrow(g.W/2-60,g.H/2+40,g.W/2+60,g.H/2+40,g.C.amber,2.5,9);
      g.text('mixing…',g.W/2,g.H/2+30,{c:g.C.amber,s:11}); }
    else cup(g.W/2,'mixture '+(p.m1+p.m2)+' g',Tf,p.m1+p.m2,heat(Tf));
    g.text('Heat lost by the hot body equals heat gained by the cold one',g.W/2,34,{c:g.C.mut,s:12});
  },
  read(p){const cp={Water:4186,Copper:385,Aluminium:900,Iron:450,Glass:840},c1=cp[p.s1],c2=cp[p.s2];
    const Tf=(p.m1*c1*p.T1+p.m2*c2*p.T2)/(p.m1*c1+p.m2*c2);
    return [R('Final temperature',Tf,'°C'),R('Heat lost by hot',p.m1/1000*c1*(p.T1-Tf),'J'),
      R('Heat gained by cold',p.m2/1000*c2*(Tf-p.T2),'J'),R('Hot specific heat',c1,'J/kg·K'),
      R('Cold specific heat',c2,'J/kg·K'),R('Thermal capacity ratio',(p.m1*c1)/(p.m2*c2))];},
  note:'Water resists temperature change most because its specific heat is the highest here.'
};

ENGINES.carnot={
  c:[SEL('mode','Machine','Heat engine,Refrigerator,Heat pump'.split(',')),
     C('Th','Hot reservoir',320,900,500,5,' K'),C('Tc','Cold reservoir',77,400,300,5,' K'),
     C('Qin','Heat exchanged per cycle',100,5000,1000,10,' J')],
  draw(g,p,s){
    const Th=Math.max(p.Th,p.Tc+1), eff=1-p.Tc/Th;
    const cx=g.W*0.3,cy=g.H/2, bw=130;
    g.rect(cx-bw/2,cy-50,bw,100,{f:'rgba(0,229,160,.10)',s:g.C.accent,lw:2,r:10});
    g.text(p.mode,cx,cy+4,{c:g.C.accent,s:13,b:true});
    g.rect(cx-bw/2-20,cy-170,bw+40,46,{f:'rgba(251,113,133,.18)',s:g.C.rose,lw:2,r:6});
    g.text(Th+' K',cx,cy-142,{c:g.C.rose,s:13,b:true,m:true});
    g.rect(cx-bw/2-20,cy+124,bw+40,46,{f:'rgba(34,211,238,.18)',s:g.C.cyan,lw:2,r:6});
    g.text(p.Tc+' K',cx,cy+152,{c:g.C.cyan,s:13,b:true,m:true});
    const engine=p.mode==='Heat engine';
    const Qh=engine?p.Qin:p.Qin*Th/p.Tc, Qc=engine?p.Qin*p.Tc/Th:p.Qin, W=Math.abs(Qh-Qc);
    if(engine){ g.arrow(cx,cy-124,cx,cy-50,g.C.rose,3.5,10); g.arrow(cx,cy+50,cx,cy+124,g.C.cyan,3.5,10);
      g.arrow(cx+bw/2,cy,cx+bw/2+90,cy,g.C.amber,3.5,10); g.text('W = '+fmt(W)+' J',cx+bw/2+95,cy+4,{c:g.C.amber,s:12,a:'left',m:true}); }
    else { g.arrow(cx,cy-50,cx,cy-124,g.C.rose,3.5,10); g.arrow(cx,cy+124,cx,cy+50,g.C.cyan,3.5,10);
      g.arrow(cx+bw/2+90,cy,cx+bw/2,cy,g.C.amber,3.5,10); g.text('W in '+fmt(W)+' J',cx+bw/2+95,cy+4,{c:g.C.amber,s:12,a:'left',m:true}); }
    g.text('Q_H '+fmt(Qh)+' J',cx-bw/2-30,cy-90,{c:g.C.rose,s:11,a:'right',m:true});
    g.text('Q_C '+fmt(Qc)+' J',cx-bw/2-30,cy+96,{c:g.C.cyan,s:11,a:'right',m:true});
    const pts=[],V1=1,V2=2.4,nR=1;
    const iso=(Vs,Ve,T,n)=>{for(let i=0;i<=n;i++){const V=Vs+(Ve-Vs)*i/n;pts.push([V,nR*T/V]);}};
    const adi=(Vs,Ve,Ps,n)=>{for(let i=0;i<=n;i++){const V=Vs+(Ve-Vs)*i/n;pts.push([V,Ps*Math.pow(Vs/V,1.4)]);}};
    iso(V1,V2,Th,30); const V3=V2*Math.pow(Th/p.Tc,1/0.4); adi(V2,V3,nR*Th/V2,30);
    iso(V3,V3*V1/V2,p.Tc,30); adi(V3*V1/V2,V1,nR*p.Tc/(V3*V1/V2),30);
    g.plot({x:g.W-260,y:70,w:200,h:g.H-150,xmin:0,xmax:Math.max(...pts.map(q=>q[0]))*1.1,ymin:0,
      ymax:Math.max(...pts.map(q=>q[1]))*1.1,series:[{pts,c:g.C.amber}],title:'Carnot cycle (P–V)',xlab:'V',ylab:'P'});
  },
  read(p){const Th=Math.max(p.Th,p.Tc+1),eff=1-p.Tc/Th;
    const engine=p.mode==='Heat engine';
    const Qh=engine?p.Qin:p.Qin*Th/p.Tc, Qc=engine?p.Qin*p.Tc/Th:p.Qin, W=Math.abs(Qh-Qc);
    return [R('Carnot efficiency',eff*100,'%'),R('Work per cycle',W,'J'),R('Heat from hot side',Qh,'J'),
      R('Heat to cold side',Qc,'J'),R('COP (refrigerator)',p.Tc/(Th-p.Tc)),R('COP (heat pump)',Th/(Th-p.Tc)),
      R('Temperature ratio',p.Tc/Th)];},
  note:'No real engine between these two temperatures can beat the Carnot efficiency.'
};

ENGINES.pendulum={
  c:[C('L','Length',0.1,4,1,0.01,' m'),C('g','Gravity',1.6,20,9.81,0.01,' m/s²'),
     C('a0','Release angle',2,80,25,1,'°'),C('damp','Air damping',0,0.5,0,0.01)],
  init:p=>({th:p.a0*Math.PI/180,w:0,n:0,tl:0}),
  onset(s,p,k){ if(k==='a0'){s.th=p.a0*Math.PI/180;s.w=0;} },
  step(s,p,dt){
    const prev=s.th;
    s.w+=(-(p.g/p.L)*Math.sin(s.th)-p.damp*s.w)*dt; s.th+=s.w*dt;
    if(prev<0&&s.th>=0){ s.n++; s.tl=s.t; }
  },
  draw(g,p,s){
    const px=g.W/2, py=60, sc=Math.min((g.H-160)/4, 150);
    const L=p.L*sc, bx=px+L*Math.sin(s.th), by=py+L*Math.cos(s.th);
    g.rect(px-56,py-14,112,14,{f:g.C.metal,r:3});
    g.line(px,py,bx,by,g.C.metal,2);
    g.ctx.save();g.ctx.beginPath();g.ctx.arc(px,py,52,Math.PI/2-Math.abs(s.th),Math.PI/2+Math.abs(s.th));
    g.ctx.strokeStyle=g.C.grid;g.ctx.lineWidth=2;g.ctx.stroke();g.ctx.restore();
    g.line(px,py,px,py+L+26,g.C.grid,1.2,[4,4]);
    g.circle(bx,by,17,g.C.violet,null,0,20);
    const T=2*Math.PI*Math.sqrt(p.L/p.g);
    const pts=[]; for(let i=0;i<=100;i++){const tt=i/100*3*T;
      pts.push([tt,p.a0*Math.exp(-p.damp*tt/2)*Math.cos(2*Math.PI*tt/T)]);}
    g.plot({x:60,y:g.H-150,w:g.W-120,h:110,xmin:0,xmax:3*T,ymin:-p.a0,ymax:p.a0,
      series:[{pts,c:'rgba(167,139,250,.65)'}],marks:[[(s.t%(3*T)),s.th*180/Math.PI,g.C.amber,5]],xlab:'t (s)'});
  },
  read(p,s){const T=2*Math.PI*Math.sqrt(p.L/p.g);
    return [R('Length',p.L,'m'),R('Period T',T,'s'),R('Frequency',1/T,'Hz'),
      R('T² value',T*T,'s²'),R('Angle now',(s.th||0)*180/Math.PI,'°'),
      R('g from T',4*Math.PI*Math.PI*p.L/(T*T),'m/s²'),R('Oscillations counted',s.n||0)];},
  note:'Record T for several lengths and plot T² against L — the slope gives g = 4π²/slope.'
};

ENGINES.shm={
  c:[C('k','Spring constant',5,200,40,1,' N/m'),C('m','Mass',0.1,8,1,0.05,' kg'),

  },
  read(p,s){const w=Math.sqrt(p.k/p.m),x=p.A*Math.exp(-p.damp*s.t/2)*Math.cos(w*s.t);
    return [R('Angular frequency',w,'rad/s'),R('Period',2*Math.PI/w,'s'),R('Frequency',w/(2*Math.PI),'Hz'),
      R('Displacement',x,'m'),R('Max speed',p.A*w,'m/s'),R('Total energy',.5*p.k*p.A*p.A,'J'),
      R('Restoring force',-p.k*x,'N')];},
  note:'Period depends on √(m/k) only — amplitude does not change it.'
};

ENGINES.damped={
  c:[C('k','Spring constant',5,200,40,1,' N/m'),C('m','Mass',0.1,8,1,0.05,' kg'),
     C('b','Damping coefficient',0,20,1.2,0.05,' kg/s'),C('A','Initial displacement',0.05,0.4,0.2,0.01,' m')],
  draw(g,p,s){
    const w0=Math.sqrt(p.k/p.m), gam=p.b/(2*p.m), crit=2*Math.sqrt(p.k*p.m);
    const under=gam<w0, wd=under?Math.sqrt(w0*w0-gam*gam):0;
    const X=t=>under?p.A*Math.exp(-gam*t)*Math.cos(wd*t):p.A*Math.exp(-gam*t)*(1+gam*t);
    const T=under?2*Math.PI/wd:2;
    const pts=[],env=[],env2=[];
    const span=Math.min(20,6*T);
    for(let i=0;i<=200;i++){const tt=span*i/200;pts.push([tt,X(tt)]);
      env.push([tt,p.A*Math.exp(-gam*tt)]);env2.push([tt,-p.A*Math.exp(-gam*tt)]);}
    const cy=90, x=X(s.t%span);
    g.rect(54,cy-50,14,100,{f:g.C.metal,r:3});
    g.spring(68,cy,g.W/2+x*500-20,cy,13,11,g.C.metal);
    g.rect(g.W/2+x*500-20,cy-22,44,44,{f:g.C.face,s:g.C.rose,lw:2,r:4});
    g.plot({x:70,y:150,w:g.W-140,h:g.H-210,xmin:0,xmax:span,ymin:-p.A*1.15,ymax:p.A*1.15,
      series:[{pts:env,c:'rgba(251,113,133,.35)',w:1.5},{pts:env2,c:'rgba(251,113,133,.35)',w:1.5},{pts,c:g.C.accent}],
      marks:[[s.t%span,x,g.C.amber,5]],
      title:under?'Underdamped — oscillates inside a decaying envelope':(Math.abs(p.b-crit)<crit*0.05?'Critically damped':'Overdamped — returns without oscillating'),
      xlab:'t (s)',ylab:'x (m)'});
  },
  read(p){const w0=Math.sqrt(p.k/p.m),gam=p.b/(2*p.m),crit=2*Math.sqrt(p.k*p.m);
    return [R('Natural frequency',w0/(2*Math.PI),'Hz'),R('Damping ratio',gam/w0),
      R('Critical damping',crit,'kg/s'),R('Regime',gam<w0?'Underdamped':Math.abs(p.b-crit)<crit*.05?'Critical':'Overdamped'),
      R('Decay time',1/Math.max(gam,1e-6),'s'),R('Quality factor Q',w0/(2*Math.max(gam,1e-6)))];},
  note:'Critical damping returns to rest fastest — it is what car suspensions aim for.'
};

ENGINES.wave={
  c:[C('A','Amplitude',5,90,45,1,' px'),C('f','Frequency',0.2,6,1.5,0.1,' Hz'),
     C('lam','Wavelength',0.2,4,1.5,0.05,' m'),SEL('type','Wave type','Transverse,Longitudinal'.split(','))],
  draw(g,p,s){
    const mid=g.H/2-20, v=p.f*p.lam, k=2*Math.PI/p.lam, w=2*Math.PI*p.f, sc=140;

      g.line(40,mid,g.W-40,mid,g.C.grid,1.5);
      const pts=[]; for(let x=40;x<=g.W-40;x++){const X=(x-40)/sc; pts.push([x,mid+p.A*Math.sin(k*X-w*s.t)]);}
      g.path(pts,g.C.accent,3,10);
      for(let i=0;i<10;i++){const x=40+i*((g.W-80)/9),X=(x-40)/sc;
        const y=mid+p.A*Math.sin(k*X-w*s.t); g.circle(x,y,4,g.C.cyan); g.line(x,mid,x,y,g.C.grid,1);}
      g.line(40,mid-p.A-16,40+p.lam*sc,mid-p.A-16,g.C.amber,2,[5,4]);
      g.text('λ = '+p.lam+' m',40+p.lam*sc/2,mid-p.A-24,{c:g.C.amber,s:11,m:true});
    } else {
      for(let i=0;i<180;i++){

        g.circle(x0+d,mid,3.4,`rgba(0,229,160,${.35+.45*Math.cos(k*X-w*s.t)**2})`);}
      g.text('compressions and rarefactions travel to the right',g.W/2,mid-80,{c:g.C.mut,s:12});
    }
    const pts2=[]; for(let i=0;i<=120;i++){const tt=i/120*3/p.f;pts2.push([tt,p.A*Math.sin(-w*tt)]);}
    g.plot({x:60,y:g.H-150,w:g.W-120,h:110,xmin:0,xmax:3/p.f,ymin:-p.A,ymax:p.A,
      series:[{pts:pts2,c:'rgba(34,211,238,.6)'}],title:'Motion of one particle',xlab:'t (s)'});
  },

    R('Period',1/p.f,'s'),R('Wave number k',2*Math.PI/p.lam,'rad/m'),R('Angular frequency',2*Math.PI*p.f,'rad/s')];},
  note:'v = fλ. Change either factor and record the speed to verify it.'

ENGINES.superposition={
  c:[C('A1','Amplitude 1',0,60,40,1,' px'),C('lam1','Wavelength 1',0.3,4,1.5,0.05,' m'),
     C('A2','Amplitude 2',0,60,40,1,' px'),C('lam2','Wavelength 2',0.3,4,1.5,0.05,' m'),
     C('phi','Phase difference',0,360,0,5,'°'),SEL('dir','Second wave travels','Same direction,Opposite direction'.split(','))],
  draw(g,p,s){
    const sc=130,w1=2*Math.PI*1.2,w2=2*Math.PI*1.2,ph=p.phi*Math.PI/180;

    const f2=x=>p.A2*Math.sin(2*Math.PI*x/p.lam2+(p.dir==='Same direction'?-w2*s.t:w2*s.t)+ph);
    const draw=(fn,y,c,lw)=>{const pts=[];for(let px=40;px<=g.W-40;px++){pts.push([px,y+fn((px-40)/sc)]);}g.path(pts,c,lw||2.4);};
    g.line(40,rows[0],g.W-40,rows[0],g.C.grid,1); draw(f1,rows[0],g.C.cyan);
    g.line(40,rows[1],g.W-40,rows[1],g.C.grid,1); draw(f2,rows[1],g.C.violet);
    g.line(40,rows[2],g.W-40,rows[2],g.C.grid,1); draw(x=>f1(x)+f2(x),rows[2],g.C.accent,3);
    g.text('wave 1',g.W-44,rows[0]-46,{c:g.C.cyan,s:11,a:'right'});
    g.text('wave 2',g.W-44,rows[1]-46,{c:g.C.violet,s:11,a:'right'});

  },

    return [R('Resultant amplitude',sum,'px'),R('Phase difference',p.phi,'°'),
      R('Interference',Math.abs(p.phi%360)<30?'Constructive':Math.abs(p.phi%360-180)<30?'Destructive':'Partial'),
      R('Beat wavelength',Math.abs(p.lam1-p.lam2)<1e-3?'—':fmt(p.lam1*p.lam2/Math.abs(p.lam1-p.lam2)),'m')];},
  note:'Set both wavelengths equal and sweep the phase from 0° to 180° to move from reinforcement to cancellation.'
};

ENGINES.standing={
  c:[C('L','String length',0.2,2,1,0.01,' m'),C('n','Harmonic number',1,8,1,1),

    for(let i=0;i<=200;i++){const f2=i/200, y=A*Math.sin(p.n*Math.PI*f2);

ENGINES.sonometer={
  c:[C('L','Vibrating length',0.1,1,0.5,0.01,' m'),C('m','Hanging load',0.5,20,5,0.5,' kg'),
     C('mu','Wire mass per length',0.1,6,1.2,0.1,' g/m')],

    g.poly([[br2,by+22],[br2-8,by+22],[br2,by-6]],g.C.metal,null);
    const pts=[];for(let x=wx0;x<=wx1;x++){

      R('Length',p.L,'m'),R('1/L',1/p.L,'1/m'),R('√T',Math.sqrt(T))];},

ENGINES.doppler={
  c:[C('vs','Source speed',-120,120,40,1,' m/s'),C('vo','Observer speed',-60,60,0,1,' m/s'),
     C('f0','Source frequency',100,2000,440,10,' Hz'),C('c','Speed of sound',250,400,343,1,' m/s')],
  init:()=>({x:-250,rings:[]}),
  step(s,p,dt){
    s.x+=p.vs*dt*0.6; if(s.x>300)s.x=-300; if(s.x<-300)s.x=300;
    s.rings=s.rings.filter(r=>r.r<520); s.rings.forEach(r=>r.r+=p.c*dt*0.6);
    if(!s.last||s.t-s.last>0.32){ s.rings.push({x:s.x,r:0}); s.last=s.t; }
  },
  draw(g,p,s){
    const cx=g.W/2, cy=g.H/2, sc=0.9;
    s.rings.forEach(r=>{ g.circle(cx+r.x*sc,cy,r.r*sc,null,`rgba(34,211,238,${Math.max(0,.45-r.r/1100)})`,1.6); });
    g.circle(cx+s.x*sc,cy,12,g.C.amber,null,0,16);
    g.text('source',cx+s.x*sc,cy-24,{c:g.C.amber,s:11});
    const ox=cx+230;
    g.circle(ox,cy,11,g.C.accent,null,0,12); g.text('listener',ox,cy+30,{c:g.C.accent,s:11});
    if(Math.abs(p.vs)>1) g.arrow(cx+s.x*sc,cy+26,cx+s.x*sc+Math.sign(p.vs)*40,cy+26,g.C.amber,2.2,7);
    const f=p.f0*(p.c+p.vo)/(p.c-p.vs);
    g.text('heard frequency '+fmt(f)+' Hz  (source '+p.f0+' Hz)',g.W/2,36,{c:g.C.ink,s:13,b:true,m:true});
    g.text('Waves bunch up ahead of the source and stretch out behind it',g.W/2,g.H-26,{c:g.C.mut,s:11});
  },
  read(p){const f=p.f0*(p.c+p.vo)/(p.c-p.vs);
    return [R('Observed frequency',f,'Hz'),R('Frequency shift',f-p.f0,'Hz'),R('Source speed',p.vs,'m/s'),
      R('Observer speed',p.vo,'m/s'),R('Mach number',Math.abs(p.vs)/p.c),
      R('Wavelength ahead',(p.c-p.vs)/p.f0,'m'),R('Wavelength behind',(p.c+p.vs)/p.f0,'m')];},
  note:'Push the source speed to the speed of sound and the shift blows up — that is the sonic barrier.'
};

ENGINES.beats={
  c:[C('f1','Frequency 1',200,600,440,1,' Hz'),C('f2','Frequency 2',200,600,444,1,' Hz'),
     C('A','Amplitude',10,60,40,1)],

};

ENGINES.resonancetube={
  c:[C('f','Tuning fork frequency',200,1200,512,1,' Hz'),C('L','Air column length',0.05,0.8,0.16,0.005,' m'),
     C('T','Air temperature',-10,50,25,1,' °C'),SEL('end','Tube','Closed at one end,Open at both ends'.split(','))],
  draw(g,p,s){
    const c=331.3+0.606*p.T, closed=p.end==='Closed at one end';
    const res=closed?c/(4*p.L):c/(2*p.L);
    const near=Math.abs(res-p.f)/p.f<0.03;
    const tx=g.W/2-120, tw=90, top=60, hgt=g.H-140;
    g.rect(tx,top,tw,hgt,{s:g.C.bd,lw:2});
    const colH=clamp(p.L/0.8,0.05,1)*hgt;
    g.rect(tx+2,top+colH,tw-4,hgt-colH-2,{f:'rgba(34,211,238,.25)'});
    const A=near?30:8;
    const pts=[];for(let i=0;i<=60;i++){const fr=i/60,y=top+colH*fr;
      const shape=closed?Math.sin(Math.PI/2*(1-fr)):Math.sin(Math.PI*(1-fr));
      pts.push([tx+tw/2+A*shape*Math.cos(s.t*10),y]);}
    g.path(pts,near?g.C.accent:g.C.mut,2.5,near?10:0);
    g.line(tx-14,top+colH,tx+tw+14,top+colH,g.C.cyan,2);
    g.text('L = '+fmt(p.L*100)+' cm',tx+tw+22,top+colH/2,{c:g.C.amber,s:12,a:'left',m:true});
    g.circle(tx+tw/2,top-18,10,near?g.C.amber:g.C.metal,null,0,near?14:0);
    g.text(near?'Resonance — the column is loud':'Adjust the length until the column resonates',
      g.W/2,g.H-40,{c:near?g.C.accent:g.C.mut,s:13,b:near});
    const marks=[];for(let n=1;n<=9;n+=(closed?2:1)){const Ln=closed?n*c/(4*p.f):n*c/(2*p.f);
      if(Ln<0.8) marks.push(Ln);}
    marks.forEach((Ln,i)=>{const y=top+clamp(Ln/0.8,0,1)*hgt;
      g.line(tx+tw+60,y,tx+tw+90,y,g.C.violet,2); g.text(fmt(Ln*100)+' cm',tx+tw+96,y+4,{c:g.C.violet,s:11,a:'left',m:true});});
    g.text('resonant lengths',tx+tw+60,top-6,{c:g.C.mut,s:11,a:'left'});
  },
  read(p){const c=331.3+0.606*p.T,closed=p.end==='Closed at one end';
    return [R('Speed of sound',c,'m/s'),R('Column length',p.L*100,'cm'),
      R('Column resonant frequency',closed?c/(4*p.L):c/(2*p.L),'Hz'),R('Fork frequency',p.f,'Hz'),
      R('First resonance length',closed?c/(4*p.f)*100:c/(2*p.f)*100,'cm'),
      R('Wavelength',c/p.f,'m')];},
  note:'Distance between successive resonances is λ/2, so v = 2f(L₂ − L₁).'
};

ENGINES.coulomb={
  c:[C('q1','Charge 1',-10,10,4,0.1,' µC'),C('q2','Charge 2',-10,10,-3,0.1,' µC'),
     C('r','Separation',1,40,12,0.5,' cm'),SEL('med','Medium','Vacuum,Air,Water,Glass,Oil'.split(','))],
  draw(g,p,s){
    const er={Vacuum:1,Air:1.0006,Water:80,Glass:5,Oil:2.2}[p.med];
    const k=8.9875e9/er, F=k*Math.abs(p.q1*p.q2)*1e-12/Math.pow(p.r/100,2);
    const cy=g.H/2, sc=(g.W-260)/40, x1=g.W/2-p.r*sc/2, x2=g.W/2+p.r*sc/2;
    const ball=(x,q)=>{const c=q>0?g.C.rose:g.C.cyan,r=12+Math.abs(q)*1.6;
      g.circle(x,cy,r,tint(c,.35),c,2.5);
      g.text((q>0?'+':'')+fmt(q),x,cy+4,{c,s:12,b:true,m:true});};
    ball(x1,p.q1); ball(x2,p.q2);
    const attract=p.q1*p.q2<0, len=clamp(F*4+18,20,140);
    g.arrow(x1,cy-44,x1+(attract?len:-len),cy-44,g.C.amber,3,9);
    g.arrow(x2,cy-44,x2+(attract?-len:len),cy-44,g.C.amber,3,9);
    g.line(x1,cy+40,x2,cy+40,g.C.grid,1.5,[5,4]);
    g.text('r = '+p.r+' cm',g.W/2,cy+58,{c:g.C.mut,s:11,m:true});
    g.text(attract?'Unlike charges attract':'Like charges repel',g.W/2,36,{c:g.C.mut,s:12});

ENGINES.efield={

ENGINES.kirchhoff={
  c:[C('E1','EMF 1',0,24,12,0.5,' V'),C('E2','EMF 2',0,24,6,0.5,' V'),
     C('Ra','R_A',1,60,10,1,' Ω'),C('Rb','R_B',1,60,20,1,' Ω'),C('Rc','R_C (shared)',1,60,15,1,' Ω')],
  draw(g,p,s){
    const {i1,i2,i3}=kSolve(p);
    const cx=g.W/2, top=g.H/2-100, bot=g.H/2+100, L=Math.min(g.W-140,460);
    g.rect(cx-L/2,top,L,bot-top,{s:g.C.metal,lw:2.5});

      g.text(fmt(E)+'V',x,y-26,{c,s:11,b:true,m:true}); };
